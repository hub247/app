<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121318" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrackFit">
<title>TrackFit — Treinos Thiago & Natália</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ======================= TRACKFIT v7 — TEMA ======================= */
:root{--bg:#121318;--bg2:#17181e;--card:#1e2027;--card2:#272a33;--ln:#30333d;--tx:#f5f5f7;--mut:#a0a5b1;--mut2:#6d7280;--ok:#3dd598;--okbg:rgba(61,213,152,.13);--warn:#f5b84a;--r:18px;
 --pk:#e23a7a;--pk2:#c72a68;--pkhi:#ef4f8e;--pklt:#ff8db8;--pkbg:rgba(226,58,122,.14);--pkln:rgba(226,58,122,.45);--pksh:rgba(226,58,122,.28)}
/* Thiago = azul */
body.th{--pk:#2f7bf6;--pk2:#1d5fd1;--pkhi:#4d8ff8;--pklt:#8dbbff;--pkbg:rgba(47,123,246,.15);--pkln:rgba(47,123,246,.5);--pksh:rgba(47,123,246,.3)}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden;background:#0b0c0f;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--pk);outline-offset:2px}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:448px;margin:0 auto;min-height:100vh;background:var(--bg);border-left:1px solid #1d1f25;border-right:1px solid #1d1f25;padding-bottom:30px}
.app.nav{padding-bottom:96px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:12px}.tiny{font-size:11px}
.up{color:var(--ok);font-weight:800}.dn{color:#f87171;font-weight:800}
.acc{color:var(--pklt)}

/* ======================= CABEÇALHO + BARRA DO TREINO ======================= */
.hdr{position:sticky;top:0;z-index:40;background:rgba(18,19,24,.96);backdrop-filter:blur(10px);border-bottom:1px solid #1d1f25;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.hrow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;min-height:44px}
.hrow.home{grid-template-columns:1fr auto}
.hrow .mid{text-align:center;min-width:0}
.hrow .ttl{font-size:15px;font-weight:800}
.hrow .hs{font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--ln);color:var(--tx);position:relative}
.ib.pl{background:none;border-color:transparent}
.logo{display:inline-flex;align-items:center;gap:2px;font-weight:900;font-size:24px;letter-spacing:-.3px}
.logo b{color:var(--pk)}
.sbar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 6px 6px 12px;border-radius:14px;background:linear-gradient(90deg,var(--okbg),var(--card));border:1px solid rgba(61,213,152,.4)}
.sbar.pz{background:linear-gradient(90deg,rgba(245,184,74,.12),var(--card));border-color:rgba(245,184,74,.45)}
.sbar .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite;flex-shrink:0}
.sbar.pz .dot{background:var(--warn);animation:none}
.sbar small{display:block;font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.sbar .grow b{font-size:12px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .clk{font:900 17px ui-monospace,Menlo,monospace;color:var(--ok);font-variant-numeric:tabular-nums}
.sbar.pz .clk{color:var(--warn)}
.sbb{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--ln)}
.sbf{min-height:38px;padding:0 12px;border-radius:10px;background:var(--pk);color:#fff;font-size:12px;font-weight:800}
@keyframes pulse{50%{opacity:.45}}
.rpill{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:4px 9px;border-radius:99px;background:var(--pkbg);border:1px solid var(--pkln);color:var(--pklt);font:800 12px ui-monospace,Menlo,monospace;animation:pulse 1.6s infinite}

/* ======================= BASE ======================= */
.scr{padding:14px 16px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.scr>*{min-width:0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.ctitle{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctitle small{font-size:11px;color:var(--mut);font-weight:600}
.btn{width:100%;min-height:52px;padding:12px 14px;border-radius:99px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(180deg,var(--pkhi),var(--pk2));display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:0 8px 22px var(--pksh)}
.btn.out{background:transparent;border:1.5px solid var(--pkln);color:var(--pklt);box-shadow:none}
.btn.gh{background:transparent;border:1.5px solid var(--ln);color:var(--tx);box-shadow:none}
.btn.dk{background:var(--card2);border:1px solid var(--ln);color:var(--tx);box-shadow:none}
.btn.sm{width:auto;min-height:40px;padding:8px 14px;font-size:12px}
.btn.ok{background:linear-gradient(180deg,#34c48a,#20a06e);box-shadow:0 8px 22px rgba(61,213,152,.2)}
.btn.red{background:#b91c1c;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--ln);color:#d0d3db;white-space:nowrap}
.chip.pk{background:var(--pkbg);border-color:var(--pkln);color:var(--pklt)}
.chip.ok{background:var(--okbg);border-color:rgba(61,213,152,.4);color:var(--ok)}
.empty{font-size:12px;color:var(--mut2);text-align:center;padding:16px}
.lnk{font-size:13px;color:var(--pklt);text-decoration:underline;min-height:40px;justify-self:center}
.seg{display:grid;gap:4px;padding:4px;background:var(--bg2);border:1px solid var(--ln);border-radius:14px}
.seg button{min-height:40px;border-radius:10px;font-size:12px;font-weight:800;color:var(--mut)}
.seg button.on{background:var(--pk);color:#fff}

/* ======================= TELA INICIAL ======================= */
.prof{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prof button{min-height:48px;border-radius:14px;background:var(--card);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.4px}
.prof button.on{background:var(--pk);border-color:var(--pk);color:#fff;box-shadow:0 6px 18px var(--pksh)}
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 16px 16px;background:radial-gradient(90% 120% at 100% 0%,var(--pkbg),transparent 60%),linear-gradient(160deg,#1f2129,#16171c);border:1px solid var(--ln);min-height:150px}
.hero h1{font-size:24px;font-weight:900}
.hero .dt{font-size:12px;color:#d0d3db;margin-top:2px}
.hero .q{font-size:14px;font-style:italic;color:var(--pklt);line-height:1.5;margin-top:14px;max-width:78%}
.hero svg.bg{position:absolute;right:-18px;bottom:-14px;width:150px;height:150px;color:var(--pk);opacity:.13}
.tcard{display:block;width:100%;text-align:left;position:relative}
.tcard .lb{font-size:12px;color:var(--mut);font-weight:700}
.tcard h3{font-size:20px;font-weight:900;margin-top:4px;padding-right:56px}
.tcard .tg{font-size:14px;color:#d0d3db;margin-top:2px}
.tcard .go{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pk);color:#fff;box-shadow:0 6px 18px var(--pksh)}
.tcard .mt{display:flex;gap:18px;margin-top:12px;font-size:13px;color:#d0d3db}
.tcard .mt span{display:inline-flex;align-items:center;gap:6px}
.tcard .mt svg{color:var(--pk);width:16px;height:16px}
.picks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.picks button{flex-shrink:0;min-height:52px;padding:6px 14px;border-radius:14px;background:var(--card);border:1px solid var(--ln);text-align:left}
.picks button small{display:block;font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase}
.picks button b{display:block;font-size:12px;font-weight:800;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picks button.on{border-color:var(--pk);background:var(--pkbg)}
.picks button.on small{color:var(--pklt)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk b{width:36px;height:36px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;border:1.5px solid var(--ln);color:#d0d3db;position:relative}
.wk b.tr{border-color:var(--pk);color:var(--pklt)}
.wk b.td{background:var(--pk);border-color:var(--pk);color:#fff;box-shadow:0 0 0 4px var(--pkbg)}
.wk b.tr::after{content:"✓";position:absolute;right:-4px;top:-4px;width:15px;height:15px;border-radius:50%;background:var(--ok);color:#06281b;font-size:9px;display:grid;place-items:center}
.wk span{display:block;font-size:10px;color:var(--mut);margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.tile svg{width:26px;height:26px;color:var(--pk)}
.tile b{display:block;font-size:22px;font-weight:900}
.tile span{font-size:11px;color:var(--mut)}
.wcard .big{font-size:30px;font-weight:900}
.wcard .big small{font-size:14px;color:var(--mut);font-weight:700}
.chart{width:100%;height:auto;display:block}
.chartbox{background:var(--bg2);border:1px solid var(--ln);border-radius:12px;margin-top:10px;overflow:hidden}

/* ======================= BARRA INFERIOR ======================= */
nav.bot{position:fixed;bottom:0;left:0;right:0;max-width:448px;margin:0 auto;z-index:45;background:rgba(22,23,29,.97);backdrop-filter:blur(10px);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px max(8px,env(safe-area-inset-bottom))}
nav.bot button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 0;font-size:10.5px;color:var(--mut2);font-weight:600}
nav.bot button svg{width:22px;height:22px}
nav.bot button.on{color:var(--pk);font-weight:800}

/* ======================= FICHA DO DIA ======================= */
.ftop{text-align:center}
.ftop h2{font-size:22px;font-weight:900}
.ftop p{font-size:13px;color:var(--mut);margin-top:2px}
.bodies{display:flex;justify-content:center;gap:18px;padding:6px 0}
.bodies svg{height:190px;width:auto;filter:drop-shadow(0 0 16px var(--pksh))}
.legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:#d0d3db}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.exr{display:grid;grid-template-columns:34px 1fr 78px;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 10px 10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--ln)}
.exr.dn{opacity:.6}.exr.cur{border-color:var(--pkln);box-shadow:0 0 0 1px var(--pkln) inset}
.exr .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ln);font-weight:800;font-size:13px}
.exr.dn .n{background:var(--okbg);border-color:rgba(61,213,152,.5);color:var(--ok)}
.exr h4{font-size:15px;font-weight:800;line-height:1.3}
.exr .pr{font-size:12px;color:var(--pklt);font-weight:700;margin-top:3px}
.thumb{position:relative;width:78px;height:58px;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--pkbg),#16171c);display:grid;place-items:center;border:1px solid var(--ln)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .pb{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:var(--pk);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.thumb .pb svg{width:10px;height:10px;fill:#fff;stroke:none;margin-left:2px}
.thumb>svg{color:var(--mut2)}
.sticky{position:sticky;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(18,19,24,0),var(--bg) 35%)}

/* ======================= EXERCÍCIO ======================= */
.media{position:relative;display:block;width:100%;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--ln);aspect-ratio:16/11;padding:0}
.media img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.media .ph{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,var(--pkbg),transparent 60%),#16171c}
.media .play{position:absolute;inset:0;display:grid;place-items:center}
.media .play span{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.85);display:grid;place-items:center}
.media .play svg{width:26px;height:26px;fill:#fff;stroke:none;margin-left:4px}
.media.vid{aspect-ratio:9/16;max-height:64vh}
.media iframe{width:100%;height:100%;border:0;display:block}
.vtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--card);border:1px solid var(--ln);border-radius:14px}
.vtabs button{min-height:38px;border-radius:10px;font-size:11px;font-weight:800;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.vtabs button.on{background:var(--pk);color:#fff}
.exnav{display:flex;justify-content:space-between;gap:8px}
.exnav button{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--ln)}
.exnav button:disabled{opacity:.3}
.exname{font-size:20px;font-weight:900;line-height:1.25}
.exname em{font-style:normal;color:#ff9a5c}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{min-height:40px;border-radius:12px;background:var(--card);border:1px solid var(--ln);font-size:13px;font-weight:700;color:#d0d3db}
.tabs button.on{background:#e9eaee;color:#121318;border-color:#e9eaee}
.steps{list-style:none;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:14px;line-height:1.45;color:#dcdee4;counter-increment:s}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--ln);border-radius:var(--r)}
.stats>*{padding:12px 4px;text-align:center;border-right:1px solid var(--ln)}
.stats>*:last-child{border-right:0}
.stats span{display:block;font-size:11px;color:var(--mut)}
.stats b{display:block;font-size:16px;font-weight:900;margin-top:4px}
.stats button b{color:var(--pklt)}
.hint{font-size:12px;font-weight:700;padding:10px 12px;border-radius:12px;line-height:1.45}
.hint.upg{background:var(--okbg);color:var(--ok);border:1px solid rgba(61,213,152,.3)}
.hint.keep{background:var(--pkbg);color:var(--pklt);border:1px solid var(--pkln)}
.serie{border:1.5px solid var(--pkln);background:linear-gradient(180deg,var(--pkbg),var(--card));border-radius:var(--r);padding:14px;display:grid;gap:12px}
.serie h3{font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
.serie h3 small{font-size:11px;color:var(--mut);font-weight:700}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sgrid .bl{grid-column:1/-1;font-size:11px;font-weight:800;color:#ff9a5c;margin-bottom:-4px}
.fld label{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:5px}
.fld .box{display:flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--ln);border-radius:14px;padding:0 6px 0 12px;min-height:56px}
.fld .box:focus-within{border-color:var(--pk)}
.fld input{width:100%;min-width:0;background:none;border:0;outline:0;font-size:24px;font-weight:900;color:#fff;padding:8px 0}
.fld .u{font-size:12px;color:var(--mut);font-weight:700;margin-right:4px}
.kb{width:34px;height:34px;flex-shrink:0;border-radius:10px;background:var(--card2);border:1px solid var(--ln);font-weight:900;font-size:18px;color:#d0d3db}
.foot{font-size:11px;color:var(--mut2);text-align:center}
.donebox{display:grid;gap:10px;text-align:center}
.donebox b{font-size:15px;color:var(--ok)}

/* ======================= TIMER ======================= */
.tscr{min-height:100vh;display:flex;flex-direction:column;gap:18px;padding:max(12px,env(safe-area-inset-top)) 16px 24px}
.tlab{text-align:center}
.tlab b{display:block;font-size:16px;font-weight:800}
.tlab small{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.ring{position:relative;width:268px;height:268px;margin:0 auto;display:grid;place-items:center}
.ring svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .in{text-align:center;display:grid;justify-items:center;gap:2px}
.ring .in>svg{width:34px;height:34px;color:#d0d3db}
.ring .big{font:900 58px ui-monospace,Menlo,monospace;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring small{font-size:13px;color:#d0d3db}
.ring .ph{font-size:15px;font-weight:900;min-height:18px}
.ctl{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.ctl .pmb{min-height:54px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:17px;font-weight:800}
.ctl .pz{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1.5px solid var(--ln)}
.ctl .pz svg{width:26px;height:26px}
.ctl .pz.play svg{fill:currentColor;stroke:none;margin-left:3px}
.tog{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--ln);font-size:13px;color:#e6e7eb;line-height:1.45;text-align:left;width:100%}
.tog small{display:block;font-size:11px;color:var(--mut)}
.tog .sw{flex-shrink:0;width:48px;height:28px;border-radius:99px;background:var(--card2);border:1px solid var(--ln);position:relative;transition:.2s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8a8f9b;transition:.2s}
.tog.on .sw{background:var(--pk);border-color:var(--pk)}
.tog.on .sw::after{left:23px;background:#fff}
select.sel{width:100%;min-height:50px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:0 12px;font-size:15px;font-weight:600;color:#fff}
.vol{display:flex;align-items:center;gap:12px;color:#d0d3db}
input[type=range]{width:100%;min-height:32px;accent-color:var(--pk)}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pre button{min-height:46px;border-radius:14px;background:var(--card);border:1px solid var(--ln);font-size:13px;font-weight:800}
.warn{font-size:12px;color:var(--warn);background:rgba(245,184,74,.1);border:1px solid rgba(245,184,74,.35);padding:10px 12px;border-radius:12px;line-height:1.5}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}

/* ======================= CONCLUÍDO ======================= */
.donescr{display:grid;gap:14px;padding:max(14px,env(safe-area-inset-top)) 16px 24px;text-align:center}
.troph{position:relative;width:200px;height:150px;margin:0 auto}
.troph svg{width:100%;height:100%}
.donescr h2{font-size:26px;font-weight:900}
.donescr .cg{color:var(--pklt);font-size:14px;margin-top:4px}
.st4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st4 div{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;text-align:left}
.st4 svg{width:26px;height:26px;color:#e6e7eb}
.st4 span{display:block;font-size:11px;color:var(--mut)}
.st4 b{font-size:19px;font-weight:900}
.quote{background:var(--pkbg);border:1px solid var(--pkln);border-radius:16px;padding:16px;font-size:15px;font-style:italic;color:var(--pklt)}
.socials{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.socials button{display:grid;justify-items:center;gap:6px;font-size:11px;color:#d0d3db}
.socials .c{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--ln)}
.socials .c svg{width:26px;height:26px}
.socials .ig{border-color:#d6249f}.socials .wa{border-color:#25d366}

/* ======================= FICHA COMPLETA / EVOLUÇÃO / OUTRAS ======================= */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:10px 6px;text-align:center}
.kpi span{display:block;font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase}
.kpi b{font-size:18px;font-weight:900}
details.day{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
details.day summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px}
details.day summary::-webkit-details-marker{display:none}
details.day summary .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pkbg);color:var(--pklt);font-weight:900;font-size:12px}
details.day summary b{display:block;font-size:14px}
details.day summary small{font-size:11px;color:var(--mut)}
details.day summary::after{content:"▾";color:var(--mut2);margin-left:auto}
details.day[open] summary::after{transform:rotate(180deg)}
.dbody{padding:0 14px 14px;display:grid;gap:8px}
.prow{display:grid;grid-template-columns:24px 1fr 38px;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--ln)}
.prow .k{font-size:12px;font-weight:800;color:var(--mut);text-align:center}
.prow b{font-size:13px;display:block}
.prow small{font-size:11px;color:var(--pklt);font-weight:700}
.prow .pv{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pk);color:#fff}
.prow .pv svg{width:12px;height:12px;fill:#fff;stroke:none;margin-left:2px}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.tbl th{font-size:9px;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 4px;border-bottom:1px solid var(--ln)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--ln)}
.lst{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;background:var(--bg2);border-radius:12px;border:1px solid var(--ln);font-size:12px;margin-top:8px}
.lst .d{font:10px ui-monospace,Menlo,monospace;color:var(--mut2);display:block}
.del{color:var(--mut2);font-size:15px;min-width:40px;min-height:40px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:5px}
.f input{width:100%;background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:16px;font-weight:700;color:#fff;min-height:48px;color-scheme:dark}
.f input:focus{outline:0;border-color:var(--pk)}
.tip{padding:12px;background:var(--bg2);border-radius:12px;border:1px solid var(--ln);font-size:13px;color:#d6d8de;line-height:1.6;margin-top:10px}
.tip b{display:block;margin-bottom:3px}

/* ======================= JANELAS ======================= */
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,6,9,.78);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{position:relative;width:100%;max-width:448px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--ln);border-radius:22px 22px 0 0;padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.sheet h3{font-size:16px;font-weight:900;margin-bottom:12px;padding-right:44px;line-height:1.35}
.xbtn{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--ln);color:var(--mut);font-size:15px}
.shr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--ln);margin-top:8px;text-align:left;font-size:14px;font-weight:700}
.mi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--pkbg);color:var(--pk);font-size:12px;font-weight:900}
.mi small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.mi.on{border-color:var(--pkln)}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--ln);margin-top:8px;font-size:14px;font-weight:700}
.opt input{width:20px;height:20px;accent-color:var(--pk)}
.mtbl{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:6px;align-items:center;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--ln)}
.mrow.bi{grid-template-columns:20px 1fr 1fr 1fr 1fr 46px}.mrow.one{grid-template-columns:22px 1fr 46px}
.mrow.on{border-color:var(--pkln);background:var(--pkbg)}
.mrow>span{font-size:12px;font-weight:800;color:var(--mut);text-align:center}
.mrow input{width:100%;min-width:0;background:var(--bg2);border:1px solid var(--ln);border-radius:9px;padding:10px 2px;font-size:16px;font-weight:800;text-align:center;color:#fff}
.mrow input:focus{outline:0;border-color:var(--pk)}
.mhd{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:6px;font-size:10px;font-weight:800;color:var(--mut);text-align:center;padding:0 8px}
.mhd.bi{grid-template-columns:20px 1fr 1fr 1fr 1fr 46px}.mhd.one{grid-template-columns:22px 1fr 46px}
.mck{width:46px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--ln);color:var(--mut2)}
.mck.on{background:var(--pk);border-color:var(--pk);color:#fff}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#f1f2f5;color:#121318;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:800;z-index:90;display:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{display:block}
</style>

const sess=()=>S.sess[S.prof]||null;

const elapsedOf=s=>s?((s.pausedAt||Date.now())-s.start-s.pausedMs)/1000:0;

function pauseSess(){const s=sess();if(!s||s.pausedAt)return;s.pausedAt=Date.now();save();keepAwake(false);render();toast("Treino pausado ⏸")}
function resumeSess(silent){const s=sess();if(!s||!s.pausedAt)return;s.pausedMs+=Date.now()-s.pausedAt;s.pausedAt=null;save();keepAwake(true);if(!silent){render();toast("Treino retomado ▶")}}
let wl=null;
async function keepAwake(on){try{if(on&&"wakeLock" in navigator&&!wl&&!document.hidden){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}if(!on&&wl){await wl.release();wl=null}}catch(e){}}

/* ======================= VIRADA DO DIA =======================
   Treino em andamento NUNCA é descartado sozinho (pode ser finalizado em outro dia).
   Séries soltas de outro dia, sem treino em andamento, são limpas. */
function rollover(){
  const t=today(); let msg="";
  USERS.forEach(u=>{if(S.sess[u])return;let n=0;for(const k of Object.keys(S.logs))if(k.startsWith(u+"_")&&S.draftDay[k]&&S.draftDay[k]!==t){delete S.logs[k];delete S.draftDay[k];n++}if(n)msg="Séries não finalizadas de outro dia foram limpas."});
  if(S.timer&&isoOf(S.timer.end||0)!==t&&!S.timer.run) S.timer=null;
  if(msg){save();setTimeout(()=>toast(msg),400)}
  return !!msg;
}

   O descanso toca como faixa de áudio: continua com a tela bloqueada ou em segundo plano. */
const AC=window.AudioContext||window.webkitAudioContext;
let actx=null;
function unlockAudio(){try{actx=actx||new AC();if(actx.state==="suspended")actx.resume();const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0)}catch(e){}}

const SND={gong:{l:"Gongo",s:4.5},bell:{l:"Sino",s:2.8},beep:{l:"Bipe",s:1.1}};
function partials(f,start,sr,f0,P,len,amp){const n=Math.min(f.length-start,Math.round(len*sr));for(let i=0;i<n;i++){const t=i/sr;let s=0;for(const[r,a,tau]of P)s+=a*Math.sin(6.2831853*f0*r*t)*Math.exp(-t/tau);f[start+i]+=s*Math.min(1,t/0.004)*amp}}
function soundInto(f,start,sr,kind,vol){
  const v=Math.max(0,Math.min(1,vol));
  if(kind==="bell"){const B=[[1,1,1.4],[2.0,.55,.9],[3.0,.35,.6],[4.16,.22,.4]];partials(f,start,sr,880,B,1.6,.22*v);partials(f,start+Math.round(.55*sr),sr,880,B,1.6,.22*v)}
  else if(kind==="beep"){for(let k=0;k<3;k++){const s0=start+Math.round(k*.3*sr),n=Math.min(f.length-s0,Math.round(.18*sr));for(let i=0;i<n;i++){const t=i/sr;f[s0+i]+=Math.sin(6.2831853*1000*t)*Math.min(1,t/.005,(.18-t)/.01)*.4*v}}}
  else{const G=[[1,1,3.2],[1.004,.45,3.0],[2.0,.55,2.2],[2.76,.45,1.7],[3.9,.3,1.2],[5.4,.2,.8],[6.9,.12,.55]];partials(f,start,sr,200,G,4.5,.3*v);for(let i=0;i<Math.round(.04*sr)&&start+i<f.length;i++)f[start+i]+=(Math.random()*2-1)*.15*v*Math.exp(-i/sr/.01)}
}
function tickInto(f,start,sr,vol){const n=Math.min(f.length-start,Math.round(.09*sr));for(let i=0;i<n;i++){const t=i/sr;f[start+i]+=Math.sin(6.2831853*1050*t)*Math.exp(-t/.025)*.4*vol}}
function restWav(sec){
  const sr=11025,len=SND[S.snd].s,n=Math.round((sec+len)*sr),f=new Float32Array(n);
  for(let k=3;k>=1;k--)if(sec-k>=0)tickInto(f,Math.round((sec-k)*sr),sr,S.vol);
  soundInto(f,Math.round(sec*sr),sr,S.snd,S.vol);
  const b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);

const RA=new Audio();RA.preload="auto";RA.setAttribute("playsinline","");let RAurl=null;
function restAudioStart(sec){
  T.audio=false;T.audioFail=false;
  if(!S.sound||!S.bgSound||sec<1) return;
  try{
    if(RAurl)URL.revokeObjectURL(RAurl);RAurl=URL.createObjectURL(restWav(Math.min(600,sec)));
    RA.src=RAurl;const p=RA.play();T.audio=true;
    if(p&&p.catch)p.catch(()=>{T.audio=false;T.audioFail=true;paint()});
    if("mediaSession" in navigator&&window.MediaMetadata){navigator.mediaSession.metadata=new MediaMetadata({title:`${T.work?"Execução":"Descanso"} · ${mm2(sec)}`,artist:"TrackFit",album:T.label||"Descanso"})}
  }catch(e){T.audio=false}
}
function restAudioStop(){try{RA.pause()}catch(e){}T.audio=false}
function playEnd(kind){if(!S.sound)return;try{actx=actx||new AC();if(actx.state==="suspended")actx.resume();const sr=actx.sampleRate,k=kind||S.snd,buf=actx.createBuffer(1,Math.round(SND[k].s*sr),sr);soundInto(buf.getChannelData(0),0,sr,k,S.vol);const s=actx.createBufferSource();s.buffer=buf;s.connect(actx.destination);s.start()}catch(e){}}

/* ======================= TIMER (descanso, execução e tiros) ======================= */
const T={mode:"rest",run:false,end:0,sec:0,init:60,iv:null,label:"",next:"",done:false,work:false,audio:false,audioFail:false,h:null};
const restActive=()=>T.mode==="rest"&&(T.run||T.done||(T.sec>0&&T.sec<T.init));
const timerActive=()=>restActive()||(T.mode==="iv"&&T.iv&&(T.run||(T.iv.ph!=="done"&&T.sec>0&&T.sec<T.init)));
function saveTimer(){S.timer={mode:T.mode,run:T.run,end:T.end,sec:T.sec,init:T.init,iv:T.iv,label:T.label,next:T.next,done:T.done,work:T.work};save()}
function run(on){T.run=on;clearInterval(T.h);if(on){T.done=false;T.end=Date.now()+T.sec*1000;T.h=setInterval(tick,250)}paint();saveTimer()}
function tick(){
  if(!T.run) return;
  const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  if(left>0){if(left!==T.sec){T.sec=left;if(left<=3&&!T.audio)beep(660,80);paint()}return}
  if(T.mode==="iv"&&T.iv){
    const v=T.iv;let over=Date.now()-T.end;
    for(;;){
      if(v.ph==="w"){v.ph="r";T.init=v.r}
      else if(v.round>=v.n){v.ph="done";T.sec=0;T.run=false;clearInterval(T.h);if(over<3000){playEnd();vib([300,100,300])}
        if(v.exId){const ex=cur().ex.find(x=>x.id===v.exId);if(ex&&!exDone(ex))setLog(ex.id,0,"completed",true)}
        toast("Tiros concluídos! 🔥");paint();saveTimer();return}
      else{v.round++;v.ph="w";T.init=v.w}
      if(over<T.init*1000)break;over-=T.init*1000;
    }
    T.end=Date.now()+T.init*1000-over;T.sec=Math.ceil((T.end-Date.now())/1000);
    if(over<1500){beep(v.ph==="w"?990:440,400);vib(300)}
    paint();saveTimer();return;
  }
  const late=Date.now()-T.end;
  T.sec=0;T.run=false;T.done=true;clearInterval(T.h);
  if(!T.audio&&late<3000)playEnd();
  if(late<3000)vib([400,150,400]);
  paint();saveTimer();
  if(S.ui.screen!=="timer")toast(T.work?"Tempo concluído! 👏":"Descanso concluído! Hora da próxima série 💪");
}
function startRest(sec,label,next,opt={}){
  T.mode="rest";T.iv=null;T.init=sec;T.sec=sec;T.label=label||"Descanso livre";T.next=next||"";T.done=false;T.work=!!opt.work;
  run(true);restAudioStart(sec);
  if(!opt.stay) go("timer");
}
function restPauseToggle(){
  if(T.mode!=="rest"||T.done) return;
  if(T.run){T.sec=Math.max(1,Math.ceil((T.end-Date.now())/1000));run(false);restAudioStop()}
  else if(T.sec>0){run(true);restAudioStart(T.sec)}
}
function restAdd(d){
  if(T.mode!=="rest"||T.done) return;
  if(T.run){T.end=Math.max(Date.now()+1000,T.end+d*1000);T.sec=Math.ceil((T.end-Date.now())/1000);T.init=Math.max(T.init,T.sec);restAudioStart(T.sec)}
  else{T.sec=Math.min(600,Math.max(5,T.sec+d));T.init=Math.max(T.init,T.sec)}
  paint();saveTimer();
}
function stopTimer(){restAudioStop();T.run=false;clearInterval(T.h);T.sec=0;T.done=false;if(T.mode==="iv"){T.mode="rest";T.iv=null}paint();saveTimer()}
function startIv(cfg,name,exId){restAudioStop();T.mode="iv";T.iv={...cfg,round:1,ph:"w",name,exId:exId||""};T.init=cfg.w;T.sec=cfg.w;T.label=name;T.work=false;run(true);beep(990,300);vib(200);go("timer")}
function paint(){
  document.querySelectorAll("[data-restT]").forEach(e=>e.textContent=mm2(T.sec));
  document.querySelectorAll("[data-restpill]").forEach(p=>p.style.display=timerActive()&&S.ui.screen!=="timer"?"":"none");
  const big=$("#tBig"); if(!big) return;
  const v=T.iv, iv=T.mode==="iv"&&v, C=653.45, frac=T.done?1:(T.init?T.sec/T.init:0);
  const ring=$("#tRing"); ring.style.strokeDashoffset=T.done?0:C-C*frac;

  $("#tSt").textContent=iv?(v.ph==="done"?"Tiros concluídos":`Rodada ${v.round} de ${v.n}`):T.done?(T.work?"Tempo concluído!":"Descanso concluído!"):T.run?(T.work?"Segure firme...":"Descansando..."):restActive()?"Pausado":"Escolha um tempo";

const monday=iso=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return isoOf(d.getTime())};
function loadEvoPct(days){
  const M=evoSeries(),from=isoOf(Date.now()-days*864e5),pcs=[];
  for(const ser of Object.values(M)){const w=ser.filter(p=>p.top>0);if(w.length<2)continue;const inP=w.filter(p=>p.date>=from);if(!inP.length)continue;
    const before=w.filter(p=>p.date<from),base=before.length?before[before.length-1]:inP[0],last=inP[inP.length-1];if(base===last||!base.top)continue;pcs.push((last.top-base.top)/base.top*100)}
  return pcs.length?pcs.reduce((a,b)=>a+b,0)/pcs.length:null;
}

function evoSeries(){
  const M={};
  S.hist.forEach(h=>{if(h.user!==S.prof)return;
    for(const[k,sets]of Object.entries(h.logs||{})){const d=(sets||[]).filter(s=>s&&s.completed);if(!d.length)continue;
      let top=0,reps=0,vol=0,e1=0,maxR=0;
      d.forEach(s=>{const w=num(s.weight)||0,r=num(s.reps)||0;vol+=w*r+(num(s.weight2)||0)*(num(s.reps2)||0);if(w>top||(w===top&&r>reps)){top=w;reps=r}maxR=Math.max(maxR,r);if(w&&r)e1=Math.max(e1,w*(1+r/30))});
      (M[k]=M[k]||[]).push({date:h.date,top,reps,vol:Math.round(vol),e1:Math.round(e1*10)/10,maxR,sets:d.length})}});
  return M;
}
function progressions(from){const M=evoSeries(),out=[];for(const[k,ser]of Object.entries(M)){let best=0;ser.forEach(p=>{if(p.top>0&&best>0&&p.top>best&&p.date>=from)out.push({date:p.date,k,from:best,to:p.top});if(p.top>best)best=p.top})}return out.sort((a,b)=>b.date.localeCompare(a.date))}
function periodBuckets(){
  const per=S.ui.per,H=S.hist.filter(h=>h.user===S.prof),out=[];
  if(per==="m"||per==="t"){const n=per==="m"?5:13;for(let i=n-1;i>=0;i--){const m=monday(isoOf(Date.now()-i*7*864e5));out.push({m,l:n<=5||i%3===0?fmtDM(m):"",v:0})}
    H.forEach(h=>{const w=out.find(x=>x.m===monday(h.date));if(w)w.v++})}
  else{const n=per==="s"?6:12,d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({m:`${x.getFullYear()}-${p2(x.getMonth()+1)}`,l:MES3[x.getMonth()],v:0})}
    H.forEach(h=>{const w=out.find(x=>x.m===h.date.slice(0,7));if(w)w.v++})}
  return out;
}
function periodKpis(){
  const from=since(),H=S.hist.filter(h=>h.user===S.prof&&h.date>=from),wk=PER[S.ui.per].d/7;
  return `<div class="kpi"><div><span>Treinos</span><b>${H.length}</b></div><div><span>Média/semana</span><b>${fx(H.length/wk)}</b></div><div><span>Tempo total</span><b>${fmtMin(H.reduce((a,h)=>a+h.min,0))}</b></div>

}
function weightBlock(){
  const from=since(),all=wList(),pts=all.filter(m=>m.date>=from),before=all.filter(m=>m.date<from).pop(),base=before||pts[0],last=all[all.length-1];

let lastFocus=null,askRes=null,askDef=null,sheetKind="";
function openModal(html,label,kind){
  if(!$("#modal").classList.contains("show"))lastFocus=document.activeElement;
  sheetKind=kind||"";
  $("#sheet").innerHTML=`<button type="button" class="xbtn" data-close aria-label="Fechar">✕</button>`+html;
  $("#modal").setAttribute("aria-label",label||"Janela");$("#modal").classList.add("show");document.body.style.overflow="hidden";$("#sheet").scrollTop=0;
  $("#sheet .xbtn").focus();
}
function closeModal(){
  const k=sheetKind;sheetKind="";
  $("#modal").classList.remove("show");$("#sheet").innerHTML="";document.body.style.overflow="";
  if(askRes){const r=askRes;askRes=null;r(askDef)}
  if(k==="manual"||k==="weight") render();
  if(lastFocus&&document.contains(lastFocus)&&lastFocus.focus)lastFocus.focus();lastFocus=null;
}
function ask(msg,{input=null,mode="numeric",ok="Confirmar",cancel="Cancelar",danger=false,sub=""}={}){
  return new Promise(res=>{
    if(askRes){const r=askRes;askRes=null;r(askDef)}
    openModal(`<h3>${esc(msg)}</h3>${sub?`<p class="small mut" style="margin:-4px 0 10px">${esc(sub)}</p>`:""}${input!=null?`<div class="f" style="margin:10px 0"><input id="askIn" type="text" inputmode="${mode}" autocomplete="off" value="${esc(input)}"></div>`:""}
     <div class="shr" style="margin-top:12px"><button type="button" class="btn gh" id="askNo">${esc(cancel)}</button><button type="button" class="btn ${danger?"red":""}" id="askOk">${esc(ok)}</button></div>`,"Confirmação");
    askRes=res;askDef=input!=null?null:false;
    const done=v=>{askRes=null;closeModal();res(v)};
    $("#askOk").onclick=()=>done(input!=null?$("#askIn").value:true);
    $("#askNo").onclick=()=>done(input!=null?null:false);
    const i=$("#askIn");if(i){i.focus();i.select();i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#askOk").click()}}}
  });
}

    openModal(`<h3>Em que dia registrar este treino?</h3><p class="small mut">Ele foi iniciado em <b style="color:#fff">${fmtD(startIso)}</b> e está sendo finalizado hoje (${fmtD(t)}).</p>

     <div class="shr" style="margin-top:14px"><button type="button" class="btn gh" id="askNo">Cancelar</button><button type="button" class="btn" id="askOk">Registrar</button></div>`,"Data do treino");
    askRes=res;askDef=null;

/* ======================= REPLICAR CARGA PARA AS OUTRAS SÉRIES ======================= */
const repAsked=new Set(); let repTimer=null, repPending=null;
async function maybeReplicate(id,j,field){
  repPending=null;
  const ex=cur().ex.find(x=>x.id===id); if(!ex||isOne(ex)||ex.kind!=="w") return null;
  const val=(logsOf(ex)[j]||{})[field]; if(!val) return null;
  const tg=[];for(let k=0;k<nSets(ex);k++){if(k===j)continue;const l=logsOf(ex)[k];if(l&&l.completed)continue;if(String(curVal(ex,k,field))!==String(val))tg.push(k)}
  const key=`${id}|${field}|${val}`; if(!tg.length||repAsked.has(key)) return null;
  repAsked.add(key);
  const names=tg.map(k=>k+1),lst=names.length>1?names.slice(0,-1).join(", ")+" e "+names[names.length-1]:names[0];
  const ok=await ask(`Replicar ${val} kg para ${names.length>1?"as séries":"a série"} ${lst}?`,{ok:"Replicar",cancel:"Só esta série",sub:ex.bi&&field==="weight2"?ex.bi:ex.name});
  if(ok){tg.forEach(k=>setLog(id,k,field,val));toast(`Carga de ${val} kg aplicada ✓`)}
  return ok;
}
function scheduleRep(id,j,field){clearTimeout(repTimer);repPending={id,j,field};repTimer=setTimeout(()=>{const p=repPending;if(p)maybeReplicate(p.id,p.j,p.field)},350)}
async function flushRep(){clearTimeout(repTimer);if(repPending){const p=repPending;await maybeReplicate(p.id,p.j,p.field)}}

/* ======================= FINALIZAR / DESCARTAR ======================= */
let lastUndo=null;
async function finishWorkout(){
  await flushRep();
  const r=cur(),s=sess();const logs={};let sets=0,vol=0,exs=0;
  r.ex.forEach(ex=>{const a=S.logs[logKey(ex.id)];if(a&&a.some(x=>x&&x.completed)){exs++;logs[logKey(ex.id)]=a;a.forEach(x=>{if(x&&x.completed){sets++;vol+=(num(x.weight)||0)*(num(x.reps)||0)+(num(x.weight2)||0)*(num(x.reps2)||0)}})}});
  if(!sets){
    if(s&&await ask("Nenhuma série foi concluída. Encerrar e descartar este treino?",{ok:"Descartar treino",danger:true})){
      delete S.sess[S.prof];r.ex.forEach(ex=>{delete S.logs[logKey(ex.id)];delete S.draftDay[logKey(ex.id)]});keepAwake(false);if(timerActive())stopTimer();go("home");toast("Treino descartado")}
    else if(!s) toast("Conclua pelo menos uma série antes de finalizar");
    return;
  }
  const pend=r.ex.reduce((a,ex)=>a+nSets(ex)-doneCount(ex),0);
  if(pend&&!(await ask(`Ainda faltam ${pend} séries. Finalizar mesmo assim?`,{ok:"Finalizar"})))return;
  let date=today();
  const startIso=s?isoOf(s.start):today();
  if(startIso!==date){date=await askDate(startIso);if(!date)return}
  let min=s?Math.round(elapsedOf(s)/60):null;
  if(min==null||min>180){
    const v=await ask(min>180?`O relógio marcou ${fmtMin(min)}. Quantos minutos o treino durou de verdade?`:"Quanto tempo durou o treino (minutos)?",{input:"60",ok:"Salvar"});
    if(v==null)return;min=parseInt(v,10);if(!(min>=1&&min<=300)){toast("Informe entre 1 e 300 minutos");return}
  }
  min=Math.max(1,min);
  const kg=bodyWeight(),kcal=Math.round(metOf(r)*kg*(min/60)),uid=Date.now();
  lastUndo={uid,prof:S.prof,sess:s?{...s}:null,exIdx:S.ui.exIdx,logs:JSON.parse(JSON.stringify(Object.fromEntries(r.ex.map(ex=>[logKey(ex.id),S.logs[logKey(ex.id)]]).filter(([,v])=>v))))};
  const sum={date,user:S.prof,who:P().name,name:r.name,tag:r.tag,sets,exs,vol:Math.round(vol),min,kcal,kg,uid};
  S.hist.push({...sum,logs:JSON.parse(JSON.stringify(logs))});S.hist.sort((a,b)=>a.date.localeCompare(b.date));
  r.ex.forEach(ex=>{delete S.logs[logKey(ex.id)];delete S.draftDay[logKey(ex.id)]});
  delete S.sess[S.prof];keepAwake(false);if(timerActive())stopTimer();
  S.lastSum=sum;S.ui.exIdx=0;go("done");playEnd();
}
function undoFinish(){
  if(!lastUndo)return;
  const i=S.hist.findIndex(h=>h.uid===lastUndo.uid);if(i>=0)S.hist.splice(i,1);
  Object.assign(S.logs,lastUndo.logs);Object.keys(lastUndo.logs).forEach(k=>S.draftDay[k]=today());
  if(lastUndo.sess){S.sess[lastUndo.prof]=lastUndo.sess;keepAwake(true)}
  S.ui.exIdx=lastUndo.exIdx;lastUndo=null;S.lastSum=null;go("ficha");toast("Treino reaberto ↩️");
}

function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
function wrapT(x,t,X,Y,maxW,lh){const w=String(t).split(" ");let l="",y=Y;for(const p of w){const tt=l?l+" "+p:p;if(x.measureText(tt).width>maxW&&l){x.fillText(l,X,y);l=p;y+=lh}else l=tt}x.fillText(l,X,y);return y}
async function makeCard(s,fmt){
  const W=1080,H=fmt==="story"?1920:1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const F="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif",pad=80,th=s.user==="thiago",A=th?"#2f7bf6":"#e23a7a",AL=th?"#8dbbff":"#ff8db8";
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#121318");g.addColorStop(.6,"#1a1b22");g.addColorStop(1,th?"#0f2547":"#3a1428");x.fillStyle=g;x.fillRect(0,0,W,H);
  const gl=x.createRadialGradient(W*.85,H*.1,10,W*.85,H*.1,W*.75);gl.addColorStop(0,th?"rgba(47,123,246,.35)":"rgba(226,58,122,.35)");gl.addColorStop(1,"transparent");x.fillStyle=gl;x.fillRect(0,0,W,H);
  let y=fmt==="story"?300:120;
  x.font=`900 46px ${F}`;x.fillStyle="#fff";x.fillText("TRACK",pad,y);const tw=x.measureText("TRACK").width;x.fillStyle=A;x.fillText("FIT",pad+tw,y);
  y+=fmt==="story"?170:120;
  x.font=`900 34px ${F}`;const pt="TREINO CONCLUÍDO",pw=x.measureText(pt).width+64;x.fillStyle=A;rr(x,pad,y-62,pw,76,38);x.fill();
  x.fillStyle="#fff";x.textBaseline="middle";x.fillText(pt,pad+32,y-24);x.textBaseline="alphabetic";
  y+=110;x.font=`900 92px ${F}`;x.fillStyle="#fff";x.fillText(s.who,pad,y);
  y+=60;x.font=`600 38px ${F}`;x.fillStyle="#a0a5b1";x.fillText(fmtD(s.date),pad,y);
  y+=95;x.font=`800 54px ${F}`;x.fillStyle="#f5f5f7";y=wrapT(x,s.name.split("—").pop().trim(),pad,y,W-pad*2,66);
  if(s.tag){y+=58;x.font=`700 36px ${F}`;x.fillStyle=AL;y=wrapT(x,s.tag,pad,y,W-pad*2,46)}
  y+=fmt==="story"?110:70;
  const st=[["TEMPO",fmtMin(s.min),"#f5f5f7"],["CALORIAS",`${s.kcal} kcal`,AL],["EXERCÍCIOS",String(s.exs||s.sets),"#f5f5f7"],["VOLUME",`${s.vol.toLocaleString("pt-BR")} kg`,"#3dd598"]];
  const cw=(W-pad*2-30)/2,ch=fmt==="story"?230:200;
  st.forEach((v,i)=>{const cx=pad+(i%2)*(cw+30),cy=y+Math.floor(i/2)*(ch+30);x.fillStyle="rgba(31,33,40,.92)";rr(x,cx,cy,cw,ch,32);x.fill();x.strokeStyle="rgba(160,165,177,.25)";x.lineWidth=2;x.stroke();
    x.fillStyle="#a0a5b1";x.font=`800 30px ${F}`;x.fillText(v[0],cx+36,cy+64);x.fillStyle=v[2];x.font=`900 ${v[1].length>9?62:76}px ${F}`;x.fillText(v[1],cx+36,cy+ch-50)});
  x.fillStyle="#6d7280";x.font=`600 28px ${F}`;x.fillText("Calorias estimadas",pad,H-(fmt==="story"?250:90));
  return c;
}
function shareText(s){return `🔥 Treino concluído — ${s.who}\n🏋️ ${s.name}\n⏱️ ${fmtMin(s.min)} · 🔥 ~${s.kcal} kcal\n✅ ${s.exs||s.sets} exercícios · ${s.vol.toLocaleString("pt-BR")} kg de volume\n#TrackFit`}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
async function doShare(kind){
  const s=S.lastSum;if(!s)return;
  const fmt=kind==="story"?"story":"feed",c=await makeCard(s,fmt),blob=await new Promise(r=>c.toBlob(r,"image/png"));
  if(!blob){toast("Não foi possível gerar a imagem");return}
  const file=new File([blob],`trackfit-${s.user}-${s.date}-${fmt}.png`,{type:"image/png"});
  if(kind==="dl"){download(blob,file.name);toast("Imagem salva ✅");return}
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share(kind==="wa"?{files:[file],text:shareText(s)}:{files:[file]});if(kind!=="wa")toast(kind==="story"?"Escolha Instagram → Stories":"Escolha Instagram → Feed");return}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  if(kind==="wa"){window.open("https://wa.me/?text="+encodeURIComponent(shareText(s)),"_blank","noopener");toast("Abrindo WhatsApp com o resumo");return}
  download(blob,file.name);toast("Imagem baixada. Abra o Instagram e poste no "+(kind==="story"?"Story":"Feed"));

/* ======================= NAVEGAÇÃO ======================= */
const SCR={home:scrHome,ficha:scrFicha,exercicio:scrExercicio,timer:scrTimer,done:scrDone,plan:scrPlan,evo:scrEvo,metricas:scrMetricas,nutri:scrNutri};
function render(){
  if(S.ui.screen==="done"&&!S.lastSum) S.ui.screen="home";
  document.body.classList.toggle("th",S.prof==="thiago");
  const navOn=NAVSCR.includes(S.ui.screen);
  APP.classList.toggle("nav",navOn); $("#nav").style.display=navOn?"":"none";
  document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("on",b.dataset.nav===S.ui.screen));
  APP.innerHTML=(SCR[S.ui.screen]||scrHome)();
  paint();
}
let scrollT=null;
function saveScroll(now){clearTimeout(scrollT);const f=()=>{S.ui.scroll[S.ui.screen]=Math.round(window.scrollY);save()};now?f():scrollT=setTimeout(f,400)}
function go(screen){
  if(!SCR[screen]) return;
  if($("#modal").classList.contains("show")) closeModal();
  saveScroll(true);
  if(screen==="timer"&&S.ui.screen!=="timer") S.ui.prev=S.ui.screen;
  if(screen!=="exercicio") playing="";
  S.ui.screen=screen; save(); render();
  window.scrollTo(0,["exercicio","timer","done"].includes(screen)?0:(S.ui.scroll[screen]||0));
}
function backFromTimer(){const p=S.ui.prev;go(p&&p!=="timer"&&SCR[p]?p:(sessOn()?"exercicio":"home"))}
function pickRoutine(k){
  if(sessOn()&&k!==curIdx()){toast("Finalize ou pause o treino atual antes de trocar");return false}
  S.idx[S.prof]=k;S.idxDay=today();S.ui.exIdx=0;save();return true;
}
function startWorkout(){
  const r=cur(); startSess();
  const c=Math.min(S.ui.exIdx,r.ex.length-1);
  if(exDone(r.ex[c])){const nx=nextOpenIdx(r,c);if(nx>=0)S.ui.exIdx=nx}
  S.ui.vsel=1;S.ui.tab="how";go("exercicio");
}
async function conclude(){
  await flushRep();
  const r=cur(),i=S.ui.exIdx,ex=r.ex[i];if(!ex)return;
  const n=nSets(ex),j=firstOpen(ex);if(j>=n)return;
  if(!isOne(ex)){
    const g=id=>{const e=document.getElementById(id);return e?e.value:""};
    const top=topRep(ex)?String(topRep(ex)):"";
    const reps=cleanReps(g("cR"))||top; if(!reps){toast("Informe as repetições");return}
    setLog(ex.id,j,"reps",reps);
    if(ex.kind==="w"){setLog(ex.id,j,"weight",cleanKg(g("cW")));if(ex.bi){setLog(ex.id,j,"weight2",cleanKg(g("cW2")));setLog(ex.id,j,"reps2",cleanReps(g("cR2"))||top)}}
  }
  setLog(ex.id,j,"completed",true);
  startSess(true);
  const lastSet=j>=n-1,nx=nextOpenIdx(r,i),rsec=restOf(ex);
  if(nx<0&&lastSet){render();window.scrollTo(0,0);toast("Último exercício concluído! Finalize o treino 🏁");return}
  if(lastSet&&nx>=0){S.ui.exIdx=nx;S.ui.vsel=1;S.ui.tab="how"}
  if(rsec&&!isOne(ex)) startRest(rsec,ex.name,lastSet?`Próximo: ${r.ex[nx].name}`:`Próxima: série ${j+2} de ${n}`);
  else{render();window.scrollTo(0,0);if(lastSet)toast("Exercício concluído ✓")}
}
/* ações usadas tanto na tela quanto nas janelas */
async function doAct(act){
  const r=cur(),cx=r.ex[S.ui.exIdx];
  switch(act){
    case "more": sheetMore(); break;
    case "start": startWorkout(); break;
    case "finish": finishWorkout(); break;
    case "spause": sess()&&sess().pausedAt?resumeSess():pauseSess(); break;
    case "conclude": conclude(); break;
    case "manual": sheetManual(); break;
    case "exmenu": sheetExMenu(); break;
    case "wadd": sheetWeight(true); break;
    case "wchart": sheetWeight(false); break;
    case "play": playing=cx.id+"|"+(cx.bi&&S.ui.vsel===2?2:1); render(); break;
    case "vlink":{
      const sel=cx.bi&&S.ui.vsel===2?2:1,vk=logKey(cx.id)+(sel===2?"_2":""),now=S.videos[vk]||"";
      const v=await ask("Cole o link do YouTube/Shorts (deixe vazio para voltar ao vídeo padrão):",{input:now?`https://youtube.com/shorts/${now}`:"",mode:"url",ok:"Salvar"});
      if(v==null)break;
      if(!v.trim()){delete S.videos[vk];save();render();toast("Vídeo padrão restaurado");break}
      const id=ytId(v);if(!id){toast("Link do YouTube inválido");break}
      S.videos[vk]=id;playing="";save();render();toast("Vídeo salvo ✅");break}
    case "editrest":{
      const v=await ask(`Descanso de "${cx.name}" (segundos):`,{input:String(restOf(cx)),ok:"Salvar"});
      if(v==null)break;const n=parseInt(v,10);if(!(n>=0&&n<=600)){toast("Use de 0 a 600 segundos");break}
      S.rest[restKey(cx.id)]=n;save();render();toast(`Descanso: ${n}s`);break}
    case "worktimer": startSess(true); startRest(topRep(cx)||30,cx.name,"Segure a posição",{work:true}); break;
    case "iv": startSess(true); startIv(cx.iv,cx.name,cx.id); break;
    case "min": backFromTimer(); break;
    case "pause": restPauseToggle(); break;
    case "skip": stopTimer(); backFromTimer(); break;
    case "restok": T.done=false; saveTimer(); backFromTimer(); break;
    case "sndon": if(T.run) restAudioStart(Math.max(1,Math.ceil((T.end-Date.now())/1000))); paint(); break;
    case "bg":{const on=!(S.bgSound&&S.sound);S.bgSound=on;if(on)S.sound=true;save();if($("#modal").classList.contains("show"))sheetMore();else render();break}
    case "snd": S.sound=!S.sound;save();sheetMore();break;
    case "csv": exportCsv(); break;
    case "close": go("home"); break;
    case "undo": undoFinish(); break;
    case "exp": download(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),`backup-trackfit-${today()}.json`);break;
    case "reset": if(await ask("Apagar TODOS os dados deste celular? Exporte um backup antes.",{ok:"Apagar tudo",danger:true})){localStorage.removeItem(KEY);location.reload()}break;
    case "wsave":{
      const w=num($("#wIn").value),d=$("#wDt").value;
      if(w==null||w<30||w>250){toast("Peso inválido (30 a 250 kg)");break}
      if(!isDate(d)||d>today()){toast("Data inválida");break}
      saveWeight(w,d);sheetWeight(false);toast("Peso registrado ✅");break}
  }
}

APP.addEventListener("click",async e=>{
  const t=e.target,a=t.closest("[data-act]");
  if(a){doAct(a.dataset.act);return}
  const pv=t.closest("[data-vid]"); if(pv){e.stopPropagation();sheetVideo(cur().ex[+pv.dataset.vid]);return}
  const g=t.closest("[data-go]"); if(g){go(g.dataset.go);return}
  const pf=t.closest("[data-prof]"); if(pf){const u=pf.dataset.prof;if(u!==S.prof){S.prof=u;S.ui.exIdx=0;save();render();window.scrollTo(0,0);if(sessOn()&&!sess().pausedAt)keepAwake(true)}return}
  const pk=t.closest("[data-pickr]"); if(pk){if(pickRoutine(+pk.dataset.pickr)){render();toast(`Treino escolhido: ${cur().title}`)}return}
  const dp=t.closest("[data-dopl]"); if(dp){if(pickRoutine(+dp.dataset.dopl))go("ficha");return}
  const ppv=t.closest("[data-pvid]"); if(ppv){const[k,j]=ppv.dataset.pvid.split("|").map(Number);sheetVideo(routines()[k].ex[j]);return}
  const ex=t.closest("[data-ex]"); if(ex){S.ui.exIdx=+ex.dataset.ex;S.ui.vsel=1;S.ui.tab="how";go("exercicio");return}
  const en=t.closest("[data-exnav]"); if(en){await flushRep();const r=cur();S.ui.exIdx=Math.max(0,Math.min(r.ex.length-1,S.ui.exIdx+(+en.dataset.exnav)));S.ui.vsel=1;S.ui.tab="how";playing="";save();render();window.scrollTo(0,0);return}
  const vs=t.closest("[data-vsel]"); if(vs){S.ui.vsel=+vs.dataset.vsel;playing="";save();render();return}
  const tb=t.closest("[data-tab]"); if(tb){S.ui.tab=tb.dataset.tab;save();render();return}
  const pr=t.closest("[data-per]"); if(pr){S.ui.per=pr.dataset.per;save();render();return}
  const kb=t.closest("[data-kg]");
  if(kb){const[f,sg]=kb.dataset.kg.split("|"),ex2=cur().ex[S.ui.exIdx],j=firstOpen(ex2),inp=document.querySelector(`[data-cf="${f}"]`);
    const nv=Math.max(0,Math.round(((num(inp.value)||0)+(sg==="+"?1:-1)*stepKg(ex2))*10)/10),sv=String(nv).replace(".",",");
    inp.value=sv;setLog(ex2.id,j,f,sv);scheduleRep(ex2.id,j,f);return}
  const ad=t.closest("[data-add]"); if(ad){restAdd(+ad.dataset.add);return}
  const pre=t.closest("[data-pre]"); if(pre){startRest(+pre.dataset.pre,"Descanso livre","",{stay:true});return}
  const sh=t.closest("[data-share]"); if(sh){doShare(sh.dataset.share);return}
  const dm=t.closest("[data-delm]"); if(dm){if(await ask("Apagar este registro de medidas?",{ok:"Apagar",danger:true})){S.metrics.splice(+dm.dataset.delm,1);save();render()}return}
  const dh=t.closest("[data-delh]"); if(dh){if(await ask("Apagar este treino do histórico? As cargas dele saem da evolução.",{ok:"Apagar",danger:true})){const i=S.hist.findIndex(h=>h.uid===+dh.dataset.delh);if(i>=0)S.hist.splice(i,1);save();render()}return}
});
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{const n=b.dataset.nav;if(n==="more")sheetMore();else go(n)}));
APP.addEventListener("input",e=>{
  const d=e.target.dataset;
  if(d.cf){const ex=cur().ex[S.ui.exIdx];if(!ex)return;const reps=d.cf.startsWith("reps"),v=reps?cleanReps(e.target.value):cleanKg(e.target.value);if(v!==e.target.value)e.target.value=v;setLog(ex.id,firstOpen(ex),d.cf,v);return}
  if(e.target.id==="mn"){$("#mnv").textContent=`${e.target.value} / 10`;return}
  if(e.target.id==="volIn"){S.vol=Math.max(0,Math.min(1,(+e.target.value||0)/100));save();return}
});
APP.addEventListener("change",e=>{
  const d=e.target.dataset;
  if(d.cf&&d.cf.startsWith("weight")){const ex=cur().ex[S.ui.exIdx];if(ex)scheduleRep(ex.id,firstOpen(ex),d.cf);return}
  if(e.target.id==="evoSel"){S.ui.evoEx=e.target.value;save();render();return}
  if(e.target.id==="sndSel"){S.snd=e.target.value;save();playEnd();if(T.run&&T.mode==="rest")restAudioStart(T.sec);return}
  if(e.target.id==="volIn"){playEnd();if(T.run&&T.mode==="rest")restAudioStart(T.sec);return}
});
APP.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!e.target.dataset.cf)return;e.preventDefault();
  const all=[...APP.querySelectorAll("input[data-cf]")],n=all[all.indexOf(e.target)+1];n?n.focus():conclude();
});
APP.addEventListener("submit",e=>{
  if(e.target.id!=="mform")return;e.preventDefault();
  const w=num($("#mw").value),cRaw=$("#mc").value.trim(),c=cRaw?num(cRaw):null,dt=$("#md").value;
  if(w==null||w<30||w>250){toast("Peso inválido (30 a 250 kg)");return}
  if(cRaw&&(c==null||c<40||c>200)){toast("Cintura inválida (40 a 200 cm)");return}
  if(!isDate(dt)||dt>today()){toast("Data inválida");return}
  saveWeight(w,dt,c,S.prof==="natalia"?Math.min(10,Math.max(0,parseInt($("#mn").value,10)||0)):null);render();toast("Registro salvo ✅");
});

/* ======================= CLIQUES NAS JANELAS ======================= */
$("#modal").addEventListener("click",async e=>{
  const t=e.target;
  if(t.id==="modal"||t.closest("[data-close]")){closeModal();return}
  const g=t.closest("[data-go]"); if(g){closeModal();go(g.dataset.go);return}
  const ex=t.closest("[data-ex]"); if(ex){closeModal();S.ui.exIdx=+ex.dataset.ex;S.ui.vsel=1;S.ui.tab="how";go("exercicio");return}
  const wp=t.closest("[data-wper]"); if(wp){S.ui.per=wp.dataset.wper;save();sheetWeight(false);return}
  const wd=t.closest("[data-wdel]"); if(wd){const i=S.metrics.findIndex(m=>m.user===S.prof&&m.date===wd.dataset.wdel);if(i>=0){S.metrics.splice(i,1);save()}sheetWeight(false);return}
  const mk=t.closest("[data-mck]");
  if(mk){const ex2=cur().ex[S.ui.exIdx],j=+mk.dataset.mck,c0=((logsOf(ex2)[j])||{}).completed;
    if(!c0){const row=mk.closest(".mrow");row.querySelectorAll("input[data-m]").forEach(inp=>{const f=inp.dataset.m.split("|")[1];if(f.startsWith("weight")&&inp.value)setLog(ex2.id,j,f,cleanKg(inp.value));if(f.startsWith("reps")&&!inp.value&&topRep(ex2))setLog(ex2.id,j,f,String(topRep(ex2)))})}
    setLog(ex2.id,j,"completed",!c0);if(!c0)startSess(true);sheetManual();return}
  const a=t.closest("[data-act]"); if(a){const act=a.dataset.act;if(["vlink","editrest","manual","finish"].includes(act))closeModal();doAct(act)}
});
$("#modal").addEventListener("input",e=>{
  const m=e.target.dataset.m;if(!m)return;
  const[j,f]=m.split("|"),ex=cur().ex[S.ui.exIdx],reps=f.startsWith("reps");
  const v=reps?cleanReps(e.target.value):cleanKg(e.target.value);if(v!==e.target.value)e.target.value=v;
  setLog(ex.id,+j,f,v);
});
$("#modal").addEventListener("change",async e=>{
  const m=e.target.dataset.m;
  if(m){const[j,f]=m.split("|");if(f.startsWith("weight")){const ex=cur().ex[S.ui.exIdx];if(await maybeReplicate(ex.id,+j,f)!==null)sheetManual()}return}
  if(e.target.id!=="imp")return;const fl=e.target.files[0];if(!fl)return;
  if(fl.size>5e6){toast("Arquivo grande demais");return}
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||typeof o!=="object"||typeof o.logs!=="object"||!Array.isArray(o.hist)||!Array.isArray(o.metrics))throw 0;
    const c=sanitize(o);["prof","idx","idxDay","logs","draftDay","hist","metrics","videos","sound","bgSound","snd","vol","rest","sess"].forEach(k=>{if(k in c)S[k]=c[k]});
    save();closeModal();render();toast("Backup importado ✅")}catch(err){toast("Arquivo de backup inválido")}};
  rd.readAsText(fl);
});
$("#modal").addEventListener("keydown",e=>{
  if(e.key!=="Tab")return;
  const f=[...$("#sheet").querySelectorAll("button,a[href],input,select")];if(!f.length)return;
  const a=f[0],b=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#modal").classList.contains("show"))closeModal();else if(S.ui.screen==="timer")backFromTimer()}});

/* ======================= NÃO PERDER NADA AO SAIR / VOLTAR ======================= */
window.addEventListener("scroll",()=>saveScroll(false),{passive:true});
window.addEventListener("pagehide",()=>{saveScroll(true);saveTimer()});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){saveScroll(true);saveTimer();return}
  if(rollover()) render();
  if(T.run) tick();
  tickSess();
  if(actx&&actx.state==="suspended") actx.resume();
  if(sessOn()&&!sess().pausedAt) keepAwake(true);
});
function tickSess(){const s=sess();if(s)document.querySelectorAll("[data-sess]").forEach(el=>el.textContent=mmss(elapsedOf(s)))}
setInterval(tickSess,1000);

/* ======================= INÍCIO ======================= */
rollover();
(function restoreTimer(){
  const t=S.timer;if(!t)return;
  Object.assign(T,{mode:t.mode,run:t.run,end:t.end,sec:t.sec,init:t.init,iv:t.iv,label:t.label,next:t.next,done:t.done,work:t.work,audio:false});
  if(T.run){
    if(T.mode==="rest"&&T.end<=Date.now()){T.run=false;T.sec=0;T.done=true;setTimeout(()=>toast("Seu descanso terminou enquanto o app estava fechado"),500)}
    else{T.h=setInterval(tick,250);tick();if(T.mode==="rest"&&S.bgSound&&S.sound)T.audioFail=true}
  }
})();
if(S.ui.screen==="timer"&&!timerActive()) S.ui.screen=sessOn()?"exercicio":"home";
render();
requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,S.ui.scroll[S.ui.screen]||0)));
if(sessOn()&&!sess().pausedAt) keepAwake(true);
if("serviceWorker" in navigator&&location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
