<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym WP">
<title>Gym WP — Treinos Thiago & Natália</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--s950:#020617;--s900:#0f172a;--s800:#1e293b;--s700:#334155;--s600:#475569;--s500:#64748b;--s400:#94a3b8;--s300:#cbd5e1;--s200:#e2e8f0;--red:#ef4444;--red6:#dc2626;--pink:#ec4899;--rose:#f43f5e;--purple:#a855f7;--amber:#f59e0b;--em:#34d399;--ac:var(--red);--ac6:var(--red6);--acg:linear-gradient(90deg,#dc2626,#ea580c)}
body.nat{--ac:#ec4899;--ac6:#db2777;--acg:linear-gradient(90deg,#ec4899,#f43f5e)}
*{box-sizing:border-box;margin:0}
html,body{background:#000;color:#f1f5f9;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:448px;margin:0 auto;min-height:100vh;background:var(--s950);border-left:1px solid var(--s800);border-right:1px solid var(--s800);padding-bottom:96px;position:relative}
header{position:sticky;top:0;z-index:40;background:rgba(15,23,42,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--s800);padding:14px;padding-top:max(14px,env(safe-area-inset-top))}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.prof{display:flex;gap:6px;background:var(--s950);padding:4px;border-radius:12px;border:1px solid var(--s800);flex:1}
.prof button{flex:1;padding:8px 0;border-radius:9px;font-size:12px;font-weight:900;color:var(--s400);display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.3px}
.prof button.on.t{background:linear-gradient(90deg,#dc2626,#ea580c);color:#fff;box-shadow:0 6px 16px rgba(220,38,38,.3)}
.prof button.on.n{background:linear-gradient(90deg,#ec4899,#f43f5e);color:#fff;box-shadow:0 6px 16px rgba(236,72,153,.3)}
.tpill{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1px solid var(--s800);background:var(--s950);font:700 12px ui-monospace,Menlo,monospace;color:var(--s300)}
.tpill svg{color:var(--red)}
.tpill.run{background:rgba(239,68,68,.2);color:#f87171;border-color:rgba(239,68,68,.5);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.6}}
.phase{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--s950);border-radius:12px;border:1px solid var(--s800);margin-top:12px}
.phase button{padding:7px 2px;font-size:10.5px;font-weight:700;border-radius:9px;color:var(--s400);border:1px solid transparent}
.phase button.on.f1{background:rgba(236,72,153,.2);color:#f9a8d4;border-color:rgba(236,72,153,.3)}
.phase button.on.f2{background:rgba(168,85,247,.2);color:#d8b4fe;border-color:rgba(168,85,247,.3)}
main{padding:16px;display:grid;gap:16px}
.card{background:var(--s900);border:1px solid var(--s800);border-radius:16px;padding:16px}
.banner{border-radius:16px;padding:16px;border:1px solid rgba(127,29,29,.3);background:linear-gradient(90deg,var(--s900),var(--s900),rgba(69,10,10,.4))}
body.nat .banner{border-color:rgba(131,24,67,.3);background:linear-gradient(90deg,var(--s900),var(--s900),rgba(80,7,36,.4))}
.banner h2{font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--s800);color:var(--s300);border:1px solid var(--s700)}
.sub{font-size:12px;color:var(--s400);margin-top:2px;line-height:1.4}
.goal{margin-top:8px;font-size:12px;font-weight:700;color:#f87171;background:rgba(69,10,10,.3);padding:8px;border-radius:12px;border:1px solid rgba(127,29,29,.2);display:flex;gap:6px;align-items:center}
body.nat .goal{color:#f9a8d4;background:rgba(80,7,36,.3);border-color:rgba(131,24,67,.25)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex-shrink:0;padding:10px 16px;border-radius:12px;text-align:left;border:1px solid var(--s800);background:var(--s900);color:var(--s400)}
.strip button.on{background:var(--ac6);color:#fff;border-color:var(--ac);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.strip small{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;opacity:.8}
.strip b{display:block;font-size:12px;font-weight:900;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm h4{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--s300);display:flex;align-items:center;gap:8px}
.mm h4 svg{color:var(--red)}
.mmgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--s950);padding:16px;border-radius:12px;border:1px solid rgba(30,41,59,.8);margin-top:12px;justify-items:center}
.mmgrid div{display:flex;flex-direction:column;align-items:center;width:112px}
.mmgrid span{font-size:9px;font-weight:700;color:var(--s400);margin-bottom:4px}
.mmgrid svg{width:112px;height:176px}
.legend{display:flex;justify-content:center;gap:16px;margin-top:8px;font-size:10px;color:var(--s400);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
.rhead{display:flex;justify-content:space-between;align-items:center}
.rtag{font-size:10px;font-weight:700;color:#f87171;text-transform:uppercase;letter-spacing:.6px;background:rgba(69,10,10,.4);padding:2px 8px;border-radius:6px;border:1px solid rgba(127,29,29,.4)}
body.nat .rtag{color:#f9a8d4;background:rgba(80,7,36,.4);border-color:rgba(131,24,67,.4)}
.rhead h3{font-size:14px;font-weight:900;margin-top:6px}
.cnt{text-align:right}.cnt span{font-size:10px;color:var(--s400);display:block}.cnt b{font-size:14px;color:var(--s200)}
.ex{background:var(--s900);border:1px solid var(--s800);border-radius:16px;overflow:hidden;box-shadow:0 20px 25px -5px rgba(0,0,0,.4)}
.ex.done{border-color:rgba(52,211,153,.35)}
.biset{background:linear-gradient(90deg,#ea580c,#d97706);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.biset small{font-size:9px;text-transform:uppercase;letter-spacing:.6px}
.fin{background:linear-gradient(90deg,#7c3aed,#c026d3)}
.vid{margin:12px;background:var(--s950);border-radius:12px;overflow:hidden;border:1px solid var(--s800)}
.vid .frame{position:relative;width:100%;aspect-ratio:9/16;max-height:380px;margin:0 auto;background:var(--s900)}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vid .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;color:var(--s400);font-size:12px}
.vid .ph .play{width:64px;height:64px;border-radius:50%;background:rgba(239,68,68,.15);display:grid;place-items:center;color:var(--red)}
.vid .ph .play svg{width:30px;height:30px}
.vid .ph.load{cursor:pointer;background:radial-gradient(circle at 50% 40%,rgba(239,68,68,.12),transparent 60%)}
.vtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;background:var(--s900);border-bottom:1px solid var(--s800)}.vtabs button{padding:7px 4px;border-radius:8px;font-size:11px;font-weight:700;color:var(--s400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vtabs button.on{background:linear-gradient(90deg,#ea580c,#d97706);color:#fff}
.vfoot{padding:8px;background:rgba(15,23,42,.9);border-top:1px solid var(--s800);display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.vfoot a,.vfoot button{font-size:10px;font-weight:700;color:#f87171;display:flex;align-items:center;gap:4px;text-decoration:none}
.vfoot svg{width:12px;height:12px}
.exb{padding:0 16px 16px;display:grid;gap:12px}
.exb h4{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;line-height:1.3}
.n{width:20px;height:20px;border-radius:50%;background:rgba(239,68,68,.2);color:#f87171;font-size:12px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
body.nat .n{background:rgba(236,72,153,.2);color:#f9a8d4}
.ex.done .n{background:rgba(52,211,153,.2);color:var(--em)}
.mus{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mus span{font-size:10px;font-weight:500;background:var(--s800);color:var(--s300);padding:2px 8px;border-radius:99px;border:1px solid var(--s700)}
.params{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:var(--s950);border-radius:12px;text-align:center;border:1px solid var(--s800)}
.params span{font-size:9px;color:var(--s400);text-transform:uppercase;font-weight:700;display:block}
.params b{font-size:12px;font-weight:900}
.params .rir{font-size:10px;color:#f87171}
.params button{font-size:12px;font-weight:700;color:#c084fc;text-decoration:underline}
.note{padding:12px;background:rgba(2,6,23,.8);border-radius:12px;border:1px solid var(--s800);display:flex;gap:8px;font-size:12px;color:var(--s300);line-height:1.6}
.note svg{color:var(--red);margin-top:2px}
.last{font-size:11px;color:var(--s400);padding:0 4px}
.hint{font-size:11px;font-weight:700;padding:8px 10px;border-radius:10px}
.hint.up{background:rgba(52,211,153,.12);color:var(--em);border:1px solid rgba(52,211,153,.25)}
.hint.keep{background:rgba(168,85,247,.12);color:#d8b4fe;border:1px solid rgba(168,85,247,.25)}
.lh{display:grid;grid-template-columns:32px 1fr 1fr 32px;gap:8px;font-size:10px;font-weight:700;color:var(--s400);padding:0 8px;text-align:center}
.lh.bi,.ls.bi{grid-template-columns:28px 1fr 1fr 1fr 1fr 32px}
.lh.one,.ls.one{grid-template-columns:32px 1fr 32px}
.ls{display:grid;grid-template-columns:32px 1fr 1fr 32px;gap:8px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--s800);background:var(--s950);margin-top:8px}
.ls.on{background:rgba(69,10,10,.2);border-color:rgba(239,68,68,.3)}
body.nat .ls.on{background:rgba(80,7,36,.2);border-color:rgba(236,72,153,.3)}
.ls>span{font-size:12px;font-weight:700;color:var(--s400);text-align:center}
.ls input{width:100%;min-width:0;background:var(--s900);border:1px solid var(--s700);border-radius:8px;padding:6px 4px;font-size:12px;font-weight:700;text-align:center;color:#fff}
.ls input:focus{outline:0;border-color:var(--ac)}
.ck{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--s900);color:var(--s600);border:1px solid var(--s700)}
.ck svg{width:20px;height:20px}
.ck.on{background:var(--ac6);color:#fff;border-color:var(--ac6)}
.btn{width:100%;padding:12px;border-radius:12px;font-size:13px;font-weight:800;color:#fff;background:var(--ac6);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 20px rgba(0,0,0,.3)}
.btn.sec{background:var(--s800);color:var(--s300);border:1px solid var(--s700);box-shadow:none}
.btn.sm{width:auto;padding:8px 12px;font-size:12px}
.btn.hiit{background:linear-gradient(90deg,#7c3aed,#c026d3)}
/* timer */
.tc{text-align:center;display:grid;gap:22px;padding:24px}
.tc h3{font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
.tc h3 svg{color:var(--red);width:20px;height:20px}
.ring{position:relative;width:224px;height:224px;margin:0 auto;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .big{font:900 48px ui-monospace,Menlo,monospace;display:block}
.ring small{font-size:12px;font-weight:700;color:var(--s400);text-transform:uppercase;letter-spacing:.6px}
.ring .ph{font-size:16px;font-weight:900;margin-bottom:2px}
.ctr{display:flex;justify-content:center;gap:12px}
.ctr .go{padding:12px 24px;border-radius:12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;background:var(--red6);color:#fff}
.ctr .go.pause{background:var(--amber);color:var(--s950)}
.ctr .rs{padding:12px;background:var(--s800);border-radius:12px;border:1px solid var(--s700);color:var(--s300)}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pre button{padding:8px 0;border-radius:12px;font-size:12px;font-weight:700;border:1px solid var(--s800);background:var(--s950);color:var(--s400)}
.pre button.on{background:rgba(239,68,68,.2);color:#f87171;border-color:rgba(239,68,68,.4)}
.lbl{font-size:12px;font-weight:700;color:var(--s400);text-transform:uppercase;display:block;margin-bottom:8px}
.snd{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--s950);border-radius:12px;border:1px solid var(--s800);font-size:12px;color:var(--s300)}
.snd button{padding:8px;border-radius:8px;border:1px solid var(--s700);background:var(--s800);color:var(--s500)}
.snd button.on{background:rgba(239,68,68,.2);color:#f87171;border-color:rgba(239,68,68,.3)}
/* nutri/metrics */
.sec h3{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tip{padding:12px;background:var(--s950);border-radius:12px;border:1px solid var(--s800);font-size:12px;color:var(--s300);line-height:1.6;margin-top:10px}
.tip b{display:block;margin-bottom:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{font-size:10px;font-weight:700;color:var(--s400);text-transform:uppercase;display:block;margin-bottom:4px}
.f input[type=number],.f input[type=text]{width:100%;background:var(--s950);border:1px solid var(--s800);border-radius:12px;padding:10px;font-size:12px;font-weight:700;color:#fff}
.f input:focus{outline:0;border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--pink)}
.hist{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--s950);border-radius:12px;border:1px solid var(--s800);font-size:12px;margin-top:8px;gap:8px}
.hist .d{font:10px ui-monospace,Menlo,monospace;color:var(--s500);display:block}
.del{color:var(--s500);font-size:14px;padding:4px 8px}
.empty{font-size:12px;color:var(--s500);text-align:center;padding:16px}
.alert{border-color:rgba(239,68,68,.4)}
nav.bot{position:fixed;bottom:0;left:0;right:0;max-width:448px;margin:0 auto;background:rgba(15,23,42,.95);backdrop-filter:blur(8px);border-top:1px solid var(--s800);display:grid;grid-template-columns:repeat(4,1fr);padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:50}
nav.bot button{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:12px;color:var(--s500);font-size:10px;gap:4px}
nav.bot button svg{width:20px;height:20px}
nav.bot button.on{color:var(--red);font-weight:700}
body.nat nav.bot button.on{color:var(--pink)}
.playbtn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:800;color:#fff;background:var(--ac6);flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.playbtn svg{width:12px;height:12px;fill:currentColor}
.titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.restcell{display:flex;align-items:center;justify-content:center;gap:4px}
.restcell input{width:46px;background:var(--s900);border:1px solid var(--s700);border-radius:8px;padding:4px 2px;font-size:12px;font-weight:800;text-align:center;color:#c084fc}
.restcell input:focus{outline:0;border-color:var(--ac)}
.restcell button{font-size:13px;line-height:1;padding:4px 6px;border-radius:8px;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.35)}
.sess{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;border:1px solid var(--s800);background:var(--s900)}
.sess .clk{font:900 22px ui-monospace,Menlo,monospace}
.sess.on{border-color:rgba(52,211,153,.4);background:linear-gradient(90deg,var(--s900),rgba(6,78,59,.35))}
.sess.on .clk{color:var(--em)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(2,6,23,.85);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:448px;max-height:94vh;overflow:auto;background:var(--s900);border:1px solid var(--s800);border-radius:20px 20px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet h3{font-size:15px;font-weight:900;margin-bottom:10px;padding-right:36px}
.xbtn{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--s800);color:var(--s300);font-size:16px}
.mvid{position:relative;width:100%;aspect-ratio:9/16;max-height:62vh;margin:0 auto 10px;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--s800)}
.mvid iframe{width:100%;height:100%;border:0}
.warn{font-size:11px;color:#fbbf24;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);padding:8px 10px;border-radius:10px;margin-bottom:10px;line-height:1.5}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sum div{background:var(--s950);border:1px solid var(--s800);border-radius:12px;padding:10px;text-align:center}
.sum span{font-size:10px;color:var(--s400);font-weight:700;text-transform:uppercase;display:block}
.sum b{font-size:20px;font-weight:900}
.prev{width:100%;border-radius:12px;border:1px solid var(--s800);display:block;margin:6px 0 10px}
.shr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shr .btn{font-size:12px;padding:11px 8px}
.ig{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)}
.wa{background:#16a34a}
.toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);background:var(--s200);color:var(--s950);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:60;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="row between">
    <div class="prof" role="group" aria-label="Perfil">
      <button type="button" class="t" data-prof="thiago"><svg class="i"><use href="#i-user"/></svg>THIAGO</button>
      <button type="button" class="n" data-prof="natalia"><svg class="i"><use href="#i-spark"/></svg>NATÁLIA</button>
    </div>
    <button type="button" class="tpill" id="tpill" aria-label="Abrir timer"><svg class="i"><use href="#i-clock"/></svg><span id="tpillT">1:00</span></button>
  </div>
  <div class="phase" id="phaseBar" role="group" aria-label="Fase">
    <button type="button" class="f1" data-fase="f1">Fase 1 · Transição (Sem 1–3)</button>
    <button type="button" class="f2" data-fase="f2">Fase 2 · Completa (Sem 4+)</button>
  </div>
</header>
<main id="view"></main>
<nav class="bot">
  <button type="button" data-tab="treino"><svg class="i"><use href="#i-dumb"/></svg>Treinos</button>
  <button type="button" data-tab="timer"><svg class="i"><use href="#i-clock"/></svg>Timer</button>
  <button type="button" data-tab="dieta"><svg class="i"><use href="#i-apple"/></svg>Nutrição</button>
  <button type="button" data-tab="metricas"><svg class="i"><use href="#i-trend"/></svg>Métricas</button>
</nav>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Janela"><div class="sheet" id="sheet" style="position:relative"></div></div>

<!-- ÍCONES (traçados no estilo lucide) -->

// Estimativa: kcal = MET × peso(kg) × horas. MET 5,0 = musculação com finalizador de cardio (estimativa média).
const MET=5.0;
function bodyWeight(){const m=S.metrics.filter(x=>x.user===S.prof).sort((a,b)=>b.date.localeCompare(a.date))[0];return m?m.weight:(S.prof==="natalia"?64.55:89)}

let lastSum=null;
function finishWorkout(){
  const r=routines()[curIdx()]; const logs={};let sets=0,vol=0;
  r.ex.forEach(ex=>{const a=S.logs[logKey(ex.id)];if(a&&a.some(s=>s&&s.completed)){logs[logKey(ex.id)]=a;a.forEach(s=>{if(s&&s.completed){sets++;vol+=(num(s.weight)||0)*(num(s.reps)||0)+(num(s.weight2)||0)*(num(s.reps2)||0)}})}});
  if(!sets){toast("Marque pelo menos uma série antes de finalizar");return}
  const start=(S.sess&&S.sess[S.prof])||null;
  let min=start?Math.max(1,Math.round((Date.now()-start)/60000)):null;
  if(min==null){const v=prompt("Quanto tempo durou o treino (minutos)?","60");if(v===null)return;min=Math.min(300,Math.max(1,parseInt(v)||0));if(!min){toast("Tempo inválido");return}}
  min=Math.min(min,300);
  const kg=bodyWeight(), kcal=Math.round(MET*kg*(min/60));
  const sum={date:today(),user:S.prof,who:S.prof==="natalia"?"Natália":"Thiago",fase:S.prof==="natalia"?S.fase:null,name:r.name,tag:r.tag,sets,vol:Math.round(vol),min,kcal,kg};
  S.hist.push({...sum,logs:JSON.parse(JSON.stringify(logs))});
  r.ex.forEach(ex=>delete S.logs[logKey(ex.id)]);
  if(S.sess)delete S.sess[S.prof];
  save();render();lastSum=sum;showSummary(sum);
}

function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
function wrap(x,t,X,Y,maxW,lh){const w=t.split(" ");let l="",y=Y;for(const p of w){const tt=l?l+" "+p:p;if(x.measureText(tt).width>maxW&&l){x.fillText(l,X,y);l=p;y+=lh}else l=tt}x.fillText(l,X,y);return y}

  const gl=x.createRadialGradient(W*.85,H*.12,10,W*.85,H*.12,W*.7);gl.addColorStop(0,a1+"55");gl.addColorStop(1,"transparent");x.fillStyle=gl;x.fillRect(0,0,W,H);

  y+=fmt==="story"?110:70;

  const st=[["TEMPO",fmtMin(s.min),"#f1f5f9"],["CALORIAS",`${s.kcal} kcal`,"#fb923c"],["SÉRIES",String(s.sets),"#f1f5f9"],["VOLUME",`${s.vol.toLocaleString("pt-BR")} kg`,"#34d399"]];

function shareText(s){return `🔥 Treino concluído — ${s.who}\n🏋️ ${s.name}\n⏱️ ${s.min} min · 🔥 ~${s.kcal} kcal\n✅ ${s.sets} séries · ${s.vol.toLocaleString("pt-BR")} kg de volume`}

  const download=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};

}

function exCard(ex,k){
  const logs=S.logs[logKey(ex.id)]||[];
  const n=(ex.kind==="c"||ex.kind==="i")?1:ex.sets;
  const allDone=Array.from({length:n}).every((_,j)=>logs[j]&&logs[j].completed);
  let h=`<article class="ex ${allDone?"done":""}">`;
  if(ex.bi) h+=`<div class="biset"><span style="display:flex;gap:4px;align-items:center">${ic("zap")}BI-SET COMBINADO COM: ${esc(ex.bi)}</span><small>Sem descanso entre eles</small></div>`;
  else if(ex.fin) h+=`<div class="biset fin"><span style="display:flex;gap:4px;align-items:center">${ic("zap")}FINALIZADOR</span><small>Para sair pingando</small></div>`;
  h+=`<div class="exb" style="padding-top:16px"><div><div class="titlerow"><h4><span class="n">${allDone?"✓":k+1}</span>${esc(ex.name)}${ex.bi?` <span style="color:#fb923c">+ ${esc(ex.bi)}</span>`:""}</h4>
    <button type="button" class="playbtn" data-how="${ex.id}" aria-label="Ver como executar ${esc(ex.name)}">${ic("play")}Como fazer</button></div>
    ${ex.changed?`<div class="mus"><span style="background:rgba(168,85,247,.2);color:#d8b4fe;border-color:rgba(168,85,247,.4)">Exercício novo na Fase 2</span></div>`:""}
    <div class="mus">${ex.muscles.map(m=>`<span>${esc(m)}</span>`).join("")}</div></div>
   <div class="params"><div><span>Séries x Reps</span><b>${ex.kind==="c"||ex.kind==="i"?esc(ex.reps):`${ex.sets}x (${esc(ex.reps)})`}</b></div>
    <div><span>Reserva (RIR)</span><b class="rir">${esc(ex.rir)}</b></div>
    <div><span>Descanso (s)</span>${ex.kind==="c"||ex.kind==="i"?`<b style="color:var(--s500)">—</b>`:`<div class="restcell"><input type="number" inputmode="numeric" min="0" max="600" step="5" value="${restOf(ex)}" data-restin="${ex.id}" aria-label="Descanso em segundos"><button type="button" data-rest="${ex.id}" aria-label="Iniciar descanso">⏱️</button></div>`}</div></div>
   <div class="note">${ic("info")}<p>${esc(ex.notes)}</p></div>`;
  if(ex.kind==="i") h+=`<button type="button" class="btn hiit" data-iv="${ex.id}">${ic("zap")}Iniciar tiros (${ex.iv.n} rodadas)</button>`;
  const last=lastFor(ex.id);
  if(last&&(ex.kind==="w"||ex.kind==="b"||ex.kind==="t")){
    const done=last.sets.filter(s=>s&&s.completed);
    if(done.length){
      const txt=done.map(s=>ex.kind==="w"?(ex.bi?`${s.weight||"?"}kg×${s.reps||"?"} / ${s.weight2||"?"}kg×${s.reps2||"?"}`:`${s.weight||"?"}kg×${s.reps||"?"}`):(s.reps||"?")).join(" · ");
      h+=`<div class="last">Última vez (${fmtD(last.date)}): ${esc(txt)}</div>`;
      const top=parseInt(String(ex.reps).split("-").pop());
      if(isFinite(top)&&ex.kind!=="t"){
        const hit=done.length>=ex.sets&&done.every(s=>(num(s.reps)||0)>=top&&(!ex.bi||(num(s.reps2)||0)>=top));
        const up=ex.muscles.some(m=>/glúteo|quadr|posterior|isquio|gastro|coxa|lombar/i.test(m))?"+2 a 5 kg":"+1 a 2 kg";
        h+=hit?`<div class="hint up">⬆️ Fechou ${top} reps em todas as séries. ${ex.kind==="w"?`Suba a carga: ${up}.`:"Dificulte o exercício."}</div>`
              :`<div class="hint keep">➡️ Mantenha a carga e busque ${top} reps em todas as séries.</div>`;
      }
    }
  }
  if(ex.kind==="c"||ex.kind==="i"){
    const s=logs[0]||{};
    h+=`<div class="ls one ${s.completed?"on":""}"><span>✓</span><span style="text-align:left;font-weight:500">Marque quando terminar</span><button type="button" class="ck ${s.completed?"on":""}" data-ck="${ex.id}|0" aria-pressed="${!!s.completed}" aria-label="Concluído">${ic("check")}</button></div>`;
  } else {
    const cls=ex.kind!=="w"?"one":ex.bi?"bi":"";
    h+=`<div><div class="lh ${cls}">${ex.kind!=="w"?`<span>Série</span><span>${ex.kind==="t"?"Segundos":"Reps"}</span><span>Feito</span>`:ex.bi?`<span>#</span><span>kg</span><span>reps</span><span>kg</span><span>reps</span><span>✓</span>`:`<span>Série</span><span>Carga (kg)</span><span>Reps</span><span>Feito</span>`}</div>`;
    if(ex.bi) h+=`<div class="lh bi" style="margin-top:2px"><span></span><span style="grid-column:span 2;color:#fb923c">${esc(ex.name.split(" ")[0]+" "+(ex.name.split(" ")[1]||""))}</span><span style="grid-column:span 2;color:#fb923c">${esc(ex.bi.split(" ").slice(0,2).join(" "))}</span><span></span></div>`;
    for(let j=0;j<ex.sets;j++){
      const prev=last&&last.sets[j]||{};
      const s=logs[j]||{weight:prev.weight||"",weight2:prev.weight2||"",reps:"",reps2:"",completed:false};
      const inp=(f,ph)=>`<input type="number" inputmode="decimal" min="0" step="0.5" placeholder="${ph}" value="${esc(s[f])}" data-in="${ex.id}|${j}|${f}" aria-label="${f} série ${j+1}">`;
      const cells=ex.kind!=="w"?inp("reps",ex.kind==="t"?"seg":"reps"):ex.bi?inp("weight","kg")+inp("reps","reps")+inp("weight2","kg")+inp("reps2","reps"):inp("weight","kg")+inp("reps","reps");
      h+=`<div class="ls ${cls} ${s.completed?"on":""}"><span>#${j+1}</span>${cells}<button type="button" class="ck ${s.completed?"on":""}" data-ck="${ex.id}|${j}" aria-pressed="${!!s.completed}" aria-label="Concluir série ${j+1}">${ic("check")}</button></div>`;
    }
    h+=`</div>`;
  }
  return h+`</div></article>`;
}
function setLog(id,j,f,v){
  const k=logKey(id); const a=S.logs[k]=S.logs[k]||[];
  if(!a[j]){const p=(lastFor(id)||{sets:[]}).sets[j]||{};a[j]={weight:p.weight||"",weight2:p.weight2||"",reps:"",reps2:"",completed:false}}
  a[j][f]=v; save();
}

/* ====================== TIMER ====================== */
const T={sec:60,init:60,run:false,h:null,mode:"rest",iv:null};
let actx=null;
function beep(f=880,ms=200){if(!S.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);o.start();o.stop(actx.currentTime+ms/1000)}catch(e){}}
function vib(p){if(S.sound&&navigator.vibrate)navigator.vibrate(p)}
function startRest(sec){T.mode="rest";T.iv=null;T.init=sec;T.sec=sec;run(true)}
function startIv(cfg,name){T.mode="iv";T.iv={...cfg,round:1,ph:"w",name};T.init=cfg.w;T.sec=cfg.w;S.tab="timer";save();run(true);beep(990,300);vib(200);render()}
function run(on){
  T.run=on; clearInterval(T.h);
  if(on) T.h=setInterval(tick,1000);
  paint();
}
function tick(){
  T.sec--;
  if(T.sec<=3&&T.sec>0)beep(660,80);
  if(T.sec<=0){
    if(T.mode==="iv"&&T.iv){
      const v=T.iv;
      if(v.ph==="w"){v.ph="r";T.init=T.sec=v.r;beep(440,400);vib(300)}
      else if(v.round>=v.n){v.ph="done";T.sec=0;run(false);beep(990,700);vib([300,100,300]);toast("Tiros concluídos! 🔥");return}
      else{v.round++;v.ph="w";T.init=T.sec=v.w;beep(990,400);vib(300)}
    } else {T.sec=0;run(false);beep(990,500);vib([300,100,300]);toast("Hora da próxima série! 💪");return}
  }
  paint();
}
function paint(){
  $("#tpillT").textContent=mmss(T.sec);
  $("#tpill").classList.toggle("run",T.run);
  if(S.tab!=="timer")return;
  const ring=$("#ringP"); if(!ring) return;
  const C=596; ring.style.strokeDashoffset=C-(C*T.sec)/(T.init||1);
  $("#bigT").textContent=mmss(T.sec);
  const v=T.iv;
  $("#stT").textContent=T.mode==="iv"&&v?(v.ph==="done"?"Finalizado":`Rodada ${v.round} de ${v.n}`):(T.run?"Descansando...":"Pausado");
  const ph=$("#phT"); if(ph){ph.textContent=T.mode==="iv"&&v?(v.ph==="w"?"🔥 FORTE":v.ph==="r"?"😮‍💨 LEVE":"🎉"):"";ph.style.color=v&&v.ph==="w"?"#f87171":"#34d399"}
  ring.setAttribute("stroke",T.mode==="iv"&&v&&v.ph==="r"?"#34d399":"#ef4444");
  const go=$("#goT"); go.className="go"+(T.run?" pause":""); go.innerHTML=`${ic(T.run?"pause":"play")}${T.run?"Pausar":"Iniciar"}`;
}
function renderTimer(){
  view.innerHTML=`<div class="card tc"><h3>${ic("clock")}${T.mode==="iv"&&T.iv?esc("Intervalado — "+T.iv.name):"Cronômetro de Recuperação Muscular"}</h3>
   <div class="ring"><svg width="224" height="224"><circle cx="112" cy="112" r="95" stroke="#1e293b" stroke-width="12" fill="transparent"/><circle id="ringP" cx="112" cy="112" r="95" stroke="#ef4444" stroke-width="12" fill="transparent" stroke-dasharray="596" stroke-linecap="round" style="transition:stroke-dashoffset 1s linear"/></svg>

    const nc=[...document.querySelectorAll(".ex")].find(c=>c.querySelector(`[data-vsel^="${i2}|"]`)); if(nc) window.scrollBy(0,nc.getBoundingClientRect().top-y);
    return}

    const cur=S.videos[vk]||"";

    if(v===null)return;

    const id=ytId(v.trim()); if(!id){toast("Link do YouTube inválido");return}
    S.videos[vk]=id;save();render();toast("Vídeo salvo ✅");return;
  }
  const rs=t.closest("[data-rest]"); if(rs){const ex=r.ex.find(x=>x.id===rs.dataset.rest);const sec=restOf(ex);if(!sec){toast("Defina o descanso em segundos");return}startRest(sec);toast(`Descanso de ${sec}s iniciado`);return}
  const hw=t.closest("[data-how]"); if(hw){howTo(hw.dataset.how,1);return}
  if(t.closest("#startSess")){startSess();render();toast("Treino iniciado ⏱️ Bora!");return}
  if(t.closest("[data-finish]")){finishWorkout();return}
  const iv=t.closest("[data-iv]"); if(iv){const ex=r.ex.find(x=>x.id===iv.dataset.iv);startIv(ex.iv,ex.name);return}
  const ck=t.closest("[data-ck]");
  if(ck){
    const[id,j]=ck.dataset.ck.split("|");const ex=r.ex.find(x=>x.id===id);
    const k=logKey(id);const done=!((S.logs[k]||[])[+j]||{}).completed;

    const rsec=restOf(ex);
    if(done&&rsec&&(+j<ex.sets-1||r.ex[r.ex.length-1].id!==id))startRest(rsec);
    render();return;
  }
  if(t.closest("#goT")){if(T.sec<=0){T.sec=T.init;if(T.iv&&T.iv.ph==="done"){T.mode="rest";T.iv=null}}run(!T.run);return}
  if(t.closest("#rsT")){run(false);if(T.iv){T.iv.round=1;T.iv.ph="w";T.init=T.iv.w}T.sec=T.init;paint();return}
  const pr=t.closest("[data-pre]"); if(pr){startRest(+pr.dataset.pre);renderTimer();return}
  if(t.closest("#sndT")){S.sound=!S.sound;save();renderTimer();return}
  const dm=t.closest("[data-delm]"); if(dm){if(confirm("Apagar este registro?")){S.metrics.splice(+dm.dataset.delm,1);save();render()}return}
  if(t.closest("#exp")){const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`backup-gymwp-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}
  if(t.closest("#reset")){if(confirm("Apagar TODOS os dados deste celular? Exporte um backup antes.")){localStorage.removeItem(KEY);location.reload()}return}
});
$("#modal").addEventListener("click",e=>{
  const t=e.target;
  if(t.id==="modal"||t.closest("[data-close]")){closeModal();return}
  const hs=t.closest("[data-hsel]"); if(hs){const[i2,n2]=hs.dataset.hsel.split("|");howTo(i2,+n2);return}
  const sh=t.closest("[data-share]"); if(sh){doShare(sh.dataset.share);return}
  const vl=t.closest("[data-vlink]");
  if(vl){const [vid,vn]=vl.dataset.vlink.split("|"), vk=logKey(vid)+(vn?"_2":""), cur=S.videos[vk]||"";
    const v=prompt("Cole o link do YouTube/Shorts (deixe vazio para remover):",cur?`https://youtube.com/shorts/${cur}`:"");
    if(v===null)return;
    if(!v.trim()){delete S.videos[vk];save();howTo(vid,vn?2:1);toast("Vídeo removido");return}
    const id=ytId(v.trim()); if(!id){toast("Link do YouTube inválido");return}
    S.videos[vk]=id;save();howTo(vid,vn?2:1);toast("Vídeo salvo ✅")}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").classList.contains("show"))closeModal()});
view.addEventListener("keydown",e=>{const ld=e.target.closest&&e.target.closest("[data-load]");if(ld&&(e.key==="Enter"||e.key===" ")){e.preventDefault();loadVid(ld)}});
function loadVid(el){
  const id=el.dataset.load;
  el.parentElement.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&modestbranding=1&rel=0&playsinline=1" title="Vídeo demonstrativo" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
}
view.addEventListener("input",e=>{
  const d=e.target.dataset;
  if(d.restin){let v=parseInt(e.target.value);if(!isFinite(v)||v<0)return;v=Math.min(600,v);S.rest=S.rest||{};S.rest[logKey(d.restin)]=v;save();return}
  if(d.in){const[id,j,f]=d.in.split("|");let v=e.target.value;if(v!==""&&(num(v)==null||num(v)<0)){v=""}setLog(id,+j,f,v.slice(0,6));return}
  if(e.target.id==="mn")$("#mnv").textContent=`${e.target.value} / 10`;
});
view.addEventListener("submit",e=>{
  if(e.target.id!=="mform")return;e.preventDefault();
  const w=num($("#mw").value), c=num($("#mc").value);
  if(w==null||w<30||w>250){toast("Peso inválido");return}
  if(c!=null&&(c<40||c>200)){toast("Cintura inválida");return}
  S.metrics.push({date:today(),weight:w,waist:c,nausea:S.prof==="natalia"?Math.min(10,Math.max(0,parseInt($("#mn").value)||0)):0,user:S.prof});
  save();render();toast("Registro salvo ✅");
});
view.addEventListener("change",e=>{
  if(e.target.id!=="imp")return;const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||typeof o.logs!=="object")throw 0;Object.assign(S,o);save();render();toast("Backup importado ✅")}catch(err){toast("Arquivo de backup inválido")}};rd.readAsText(f);
});

render();
setInterval(tickSess,1000);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
