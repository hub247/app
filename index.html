<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrackFit">
<title>TrackFit — Treinos Thiago & Natália</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ======================= TRACKFIT v15 — TEMA ======================= */
:root{--bg:#121318;--bg2:#17181e;--card:#1e2027;--card2:#272a33;--ln:#30333d;--tx:#f5f5f7;--mut:#a0a5b1;--mut2:#6d7280;--ok:#3dd598;--okbg:rgba(61,213,152,.13);--warn:#f5b84a;--r:18px;
 --pk:#e23a7a;--pk2:#c72a68;--pkhi:#ef4f8e;--pklt:#ff8db8;--pkbg:rgba(226,58,122,.14);--pkln:rgba(226,58,122,.45);--pksh:rgba(226,58,122,.28)}
body.th{--pk:#2f7bf6;--pk2:#1d5fd1;--pkhi:#4d8ff8;--pklt:#8dbbff;--pkbg:rgba(47,123,246,.15);--pkln:rgba(47,123,246,.5);--pksh:rgba(47,123,246,.3)}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden;background:#0b0c0f;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--pk);outline-offset:2px}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:448px;margin:0 auto;min-height:100vh;background:var(--bg);border-left:1px solid #1d1f25;border-right:1px solid #1d1f25;padding-bottom:30px}
.app.nav{padding-bottom:96px}
.app.fr{padding-bottom:120px}
.app.fr.nav{padding-bottom:190px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:12px}.tiny{font-size:11px}
.up{color:var(--ok);font-weight:800}.dn{color:#f87171;font-weight:800}
.acc{color:var(--pklt)}

/* ======================= CABEÇALHO + BARRA DO TREINO ======================= */
.hdr{position:sticky;top:0;z-index:40;background:rgba(18,19,24,.96);backdrop-filter:blur(10px);border-bottom:1px solid #1d1f25;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.hrow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;min-height:44px}
.hrow.home{grid-template-columns:1fr auto}
.hrow .mid{text-align:center;min-width:0}
.hrow .ttl{font-size:15px;font-weight:800}
.hrow .hs{font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--ln);color:var(--tx);position:relative}
.ib.pl{background:none;border-color:transparent}
.logo{display:inline-flex;align-items:center;gap:2px;font-weight:900;font-size:24px;letter-spacing:-.3px}
.logo b{color:var(--pk)}
.sbar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 6px 6px 12px;border-radius:14px;background:linear-gradient(90deg,var(--okbg),var(--card));border:1px solid rgba(61,213,152,.4)}
.sbar.pz{background:linear-gradient(90deg,rgba(245,184,74,.12),var(--card));border-color:rgba(245,184,74,.45)}
.sbar .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite;flex-shrink:0}
.sbar.pz .dot{background:var(--warn);animation:none}
.sbar small{display:block;font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.sbar .grow b{font-size:12px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .clk{font:900 17px ui-monospace,Menlo,monospace;color:var(--ok);font-variant-numeric:tabular-nums}
.sbar.pz .clk{color:var(--warn)}
.sbb{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--ln)}
.sbf{min-height:38px;padding:0 12px;border-radius:10px;background:var(--pk);color:#fff;font-size:12px;font-weight:800}
@keyframes pulse{50%{opacity:.45}}

/* ======================= BASE ======================= */
.scr{padding:14px 16px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.scr>*{min-width:0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.ctitle{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctitle small{font-size:11px;color:var(--mut);font-weight:600}
.btn{width:100%;min-height:52px;padding:12px 14px;border-radius:99px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(180deg,var(--pkhi),var(--pk2));display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:0 8px 22px var(--pksh)}
.btn.out{background:transparent;border:1.5px solid var(--pkln);color:var(--pklt);box-shadow:none}
.btn.gh{background:transparent;border:1.5px solid var(--ln);color:var(--tx);box-shadow:none}
.btn.dk{background:var(--card2);border:1px solid var(--ln);color:var(--tx);box-shadow:none}
.btn.sm{width:auto;min-height:40px;padding:8px 14px;font-size:12px}
.btn.ok{background:linear-gradient(180deg,#34c48a,#20a06e);box-shadow:0 8px 22px rgba(61,213,152,.2)}
.btn.red{background:#b91c1c;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--ln);color:#d0d3db;white-space:nowrap}
.chip.pk{background:var(--pkbg);border-color:var(--pkln);color:var(--pklt)}
.chip.ok{background:var(--okbg);border-color:rgba(61,213,152,.4);color:var(--ok)}
.chip.bs{background:rgba(234,88,12,.14);border-color:rgba(251,146,60,.5);color:#ffb37a}
.chip.sk{background:rgba(245,184,74,.12);border-color:rgba(245,184,74,.45);color:var(--warn)}
.empty{font-size:12px;color:var(--mut);text-align:center;padding:16px}
.lnk{font-size:13px;color:var(--pklt);text-decoration:underline;min-height:40px;justify-self:center}
.seg{display:grid;gap:4px;padding:4px;background:var(--bg2);border:1px solid var(--ln);border-radius:14px}
.seg button{min-height:40px;border-radius:10px;font-size:12px;font-weight:800;color:var(--mut)}
.seg button.on{background:var(--pk);color:#fff}

/* ======================= TELA INICIAL ======================= */
.prof{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prof button{min-height:48px;border-radius:14px;background:var(--card);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.4px}
.prof button.on{background:var(--pk);border-color:var(--pk);color:#fff;box-shadow:0 6px 18px var(--pksh)}
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 16px 16px;background:radial-gradient(90% 120% at 100% 0%,var(--pkbg),transparent 60%),linear-gradient(160deg,#1f2129,#16171c);border:1px solid var(--ln);min-height:150px}
.hero h1{font-size:24px;font-weight:900}
.hero .dt{font-size:12px;color:#d0d3db;margin-top:2px}
.hero .q{font-size:14px;font-style:italic;color:var(--pklt);line-height:1.5;margin-top:14px;max-width:78%}
.hero svg.bg{position:absolute;right:-18px;bottom:-14px;width:150px;height:150px;color:var(--pk);opacity:.13}
.tcard{display:block;width:100%;text-align:left;position:relative}
.tcard .lb{font-size:12px;color:var(--mut);font-weight:700}
.tcard h3{font-size:20px;font-weight:900;margin-top:4px;padding-right:56px}
.tcard .tg{font-size:14px;color:#d0d3db;margin-top:2px}
.tcard .go{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pk);color:#fff;box-shadow:0 6px 18px var(--pksh)}
.tcard .mt{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:#d0d3db}
.tcard .mt span{display:inline-flex;align-items:center;gap:6px}
.tcard .mt svg{color:var(--pk);width:16px;height:16px}
.picks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.picks button{flex-shrink:0;width:150px;min-height:72px;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--ln);text-align:left;display:flex;flex-direction:column;justify-content:flex-start;gap:2px}
.picks button small{display:block;font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase}
.picks button b{display:block;font-size:13px;font-weight:800;line-height:1.25}
.picks button em{display:block;font-style:normal;font-size:11px;color:var(--mut);line-height:1.3}
.picks button.on{border-color:var(--pk);background:var(--pkbg)}
.picks button.on small,.picks button.on em{color:var(--pklt)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk b{width:36px;height:36px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;border:1.5px solid var(--ln);color:#d0d3db;position:relative}
.wk b.tr{border-color:var(--pk);color:var(--pklt)}
.wk b.td{background:var(--pk);border-color:var(--pk);color:#fff;box-shadow:0 0 0 4px var(--pkbg)}
.wk b.tr::after{content:"✓";position:absolute;right:-4px;top:-4px;width:15px;height:15px;border-radius:50%;background:var(--ok);color:#06281b;font-size:9px;display:grid;place-items:center}
.wk span{display:block;font-size:10px;color:var(--mut);margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.tile svg{width:26px;height:26px;color:var(--pk)}
.tile b{display:block;font-size:22px;font-weight:900}
.tile span{font-size:11px;color:var(--mut)}
.wcard .big{font-size:30px;font-weight:900}
.wcard .big small{font-size:14px;color:var(--mut);font-weight:700}
.wempty{display:flex;align-items:center;gap:12px;padding:4px 0}
.wempty .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--pkbg);color:var(--pk);flex-shrink:0}
.wempty b{display:block;font-size:15px}
.wempty span{font-size:12px;color:var(--mut)}
.chart{width:100%;height:auto;display:block}
.chartbox{background:var(--bg2);border:1px solid var(--ln);border-radius:12px;margin-top:10px;overflow:hidden}

/* ======================= BARRA INFERIOR ======================= */
nav.bot{position:fixed;bottom:0;left:0;right:0;max-width:448px;margin:0 auto;z-index:45;background:rgba(22,23,29,.97);backdrop-filter:blur(10px);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 6px max(8px,env(safe-area-inset-bottom))}
nav.bot button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 0;font-size:10.5px;color:var(--mut2);font-weight:600;border-radius:12px}
nav.bot button svg{width:22px;height:22px}
nav.bot button.on{color:var(--pk);font-weight:800}
nav.bot button:focus{outline:none}
nav.bot button:focus-visible{outline:2px solid var(--pk);outline-offset:-2px}

/* ======================= DESCANSO RECOLHIDO (canto inferior) ======================= */
.frest{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:424px;z-index:60;background:rgba(30,32,39,.97);backdrop-filter:blur(10px);border:1.5px solid var(--pkln);border-radius:18px;padding:8px 8px 10px 14px;box-shadow:0 14px 34px rgba(0,0,0,.55);overflow:hidden;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.frest[hidden]{display:none}
body.hasnav .frest{bottom:calc(78px + env(safe-area-inset-bottom))}
.frest.dn{border-color:rgba(61,213,152,.6)}
.frest .fo{display:flex;flex-direction:column;text-align:left;min-width:0}
.frest .fl{font-size:11px;font-weight:800;color:var(--pklt);text-transform:uppercase;letter-spacing:.4px}
.frest.dn .fl{color:var(--ok)}
.frest .ft{font:900 26px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;line-height:1.1}
.frest .fb{min-width:44px;min-height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--ln);display:grid;place-items:center;font-size:13px;font-weight:800;padding:0 10px}
.frest .fb.pk{background:var(--pk);border-color:var(--pk);color:#fff}
.fbar{position:absolute;left:0;bottom:0;height:3px;width:100%}
.fbar i{display:block;height:100%;background:var(--pk);width:0;transition:width .25s linear}

/* ======================= POPUP DE DESCANSO ======================= */
.rp{position:fixed;inset:0;z-index:72;background:rgba(5,6,9,.8);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.rp.show{display:flex}
.rpb{width:100%;max-width:448px;background:var(--bg2);border:1px solid var(--ln);border-radius:24px 24px 0 0;padding:14px 16px max(18px,env(safe-area-inset-bottom));display:grid;gap:14px;max-height:94vh;overflow:auto}
.rph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rph b{font-size:16px;font-weight:900}
.rmin{display:inline-flex;gap:6px;align-items:center;min-height:42px;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:13px;font-weight:800}
.rlab{text-align:center}.rlab b{display:block;font-size:15px}.rlab small{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.rring{position:relative;width:220px;height:220px;margin:0 auto;display:grid;place-items:center}
.rring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.rring .big{display:block;font:900 54px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;text-align:center}
.rring small{display:block;text-align:center;font-size:12px;color:var(--mut)}

/* ======================= PERGUNTA DE REPETIÇÕES (tela cheia) ======================= */
.qp{position:fixed;inset:0;z-index:88;background:var(--bg);display:none;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow:auto}
.qp.show{display:flex}
.qtop{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mut);padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--ln);align-self:center}
.qtop b{color:var(--pklt);font:900 15px ui-monospace,Menlo,monospace}
.qmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:420px;width:100%;margin:0 auto;padding:16px 0}
.qe{text-align:center;font-size:13px;color:var(--mut)}
.qmain h2{text-align:center;font-size:24px;font-weight:900;line-height:1.25}
.qm{text-align:center;font-size:13px;color:var(--pklt);font-weight:700}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qgrid button{min-height:64px;border-radius:16px;background:var(--card);border:1.5px solid var(--ln);font-size:24px;font-weight:900}
.qgrid button.in{border-color:var(--pkln);background:var(--pkbg)}
.qgrid button:active{background:var(--pk);color:#fff}
.qother{display:grid;grid-template-columns:1fr auto;gap:8px}
.qother input{min-width:0;min-height:56px;border-radius:14px;background:var(--card);border:1px solid var(--ln);padding:0 14px;font-size:20px;font-weight:800;color:#fff}
.qother input:focus{outline:0;border-color:var(--pk)}
.qother .btn{width:auto;padding:0 22px;min-height:56px}
.qundo{align-self:center;font-size:12px;color:var(--mut);text-decoration:underline;min-height:44px}

/* ======================= FICHA DO DIA ======================= */
.ftop{text-align:center}
.ftop h2{font-size:22px;font-weight:900}
.ftop p{font-size:13px;color:var(--mut);margin-top:2px}
.bodies{display:flex;justify-content:center;gap:18px;padding:6px 0}
.bodies svg{height:190px;width:auto;filter:drop-shadow(0 0 16px var(--pksh))}
.legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:#d0d3db}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.exr{display:grid;grid-template-columns:34px 1fr 78px;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 10px 10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--ln)}
.exr.dn{opacity:.6}.exr.cur{border-color:var(--pkln);box-shadow:0 0 0 1px var(--pkln) inset}
.exr.bsa,.exr.bsb{border-left:4px solid #fb923c}
.exr .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ln);font-weight:800;font-size:13px}
.exr.dn .n{background:var(--okbg);border-color:rgba(61,213,152,.5);color:var(--ok)}
.exr h4{font-size:15px;font-weight:800;line-height:1.3}
.exr .pr{font-size:12px;color:var(--pklt);font-weight:700;margin-top:3px}
.bslink{font-size:10px;font-weight:900;color:#fb923c;letter-spacing:.5px;text-align:center;margin:-8px 0}
.thumb{position:relative;width:78px;height:58px;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--pkbg),#16171c);display:grid;place-items:center;border:1px solid var(--ln)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .pb{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:var(--pk);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.thumb .pb svg{width:10px;height:10px;fill:#fff;stroke:none;margin-left:2px}
.thumb>svg{color:var(--mut2)}
.sticky{position:sticky;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(18,19,24,0),var(--bg) 35%)}
body.frs .sticky{bottom:84px}

/* ======================= EXERCÍCIO ======================= */
.media{position:relative;display:block;width:100%;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--ln);padding:0}
.media.vid{aspect-ratio:9/16;max-height:64vh}
.media iframe{width:100%;height:100%;border:0;display:block}
.exnav{display:flex;justify-content:space-between;gap:8px}
.exnav button{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--ln)}
.exnav button:disabled{opacity:.3}
.exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.exname{font-size:21px;font-weight:900;line-height:1.25}
.vbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:99px;background:var(--pkbg);border:1px solid var(--pkln);color:var(--pklt);font-size:12px;font-weight:800;flex-shrink:0;white-space:nowrap}
.vbtn svg{width:13px;height:13px;fill:currentColor;stroke:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
details.how{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
details.how summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:54px}
details.how summary::-webkit-details-marker{display:none}
details.how summary .k{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--pkbg);color:var(--pk);flex-shrink:0}
details.how summary b{display:block;font-size:14px}
details.how summary small{display:block;font-size:11px;color:var(--mut)}
details.how summary::after{content:"▾";margin-left:auto;color:var(--mut2)}
details.how[open] summary::after{transform:rotate(180deg)}
.howb{padding:0 14px 14px;display:grid;gap:12px}
.steps{list-style:none;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:14px;line-height:1.45;color:#dcdee4;counter-increment:s}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mut)}
.dica{font-size:12px;color:var(--pklt);background:var(--pkbg);border-radius:10px;padding:8px 10px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--ln);border-radius:var(--r)}
.stats>*{padding:12px 4px;text-align:center;border-right:1px solid var(--ln)}
.stats>*:last-child{border-right:0}
.stats span{display:block;font-size:11px;color:var(--mut)}
.stats b{display:block;font-size:16px;font-weight:900;margin-top:4px}
.stats button b{color:var(--pklt)}
.gline{font-size:12px;color:var(--mut);line-height:1.45;padding:0 4px;margin-top:-6px}
.hint{font-size:13px;font-weight:700;padding:10px 12px;border-radius:12px;line-height:1.45}
.hint.upg{background:var(--okbg);color:var(--ok);border:1px solid rgba(61,213,152,.3)}
.hint.keep{background:var(--pkbg);color:var(--pklt);border:1px solid var(--pkln)}
.hint.down{background:rgba(245,184,74,.12);color:var(--warn);border:1px solid rgba(245,184,74,.35)}
.sugg{display:grid;gap:8px}
.bsband{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(234,88,12,.12);border:1px solid rgba(251,146,60,.45);color:#ffb37a;font-size:12px;font-weight:700;line-height:1.4}
.bsband b{color:#fff}
.serie{border:1.5px solid var(--pkln);background:linear-gradient(180deg,var(--pkbg),var(--card));border-radius:var(--r);padding:14px;display:grid;gap:12px}
.serie h3{font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
.serie h3 small{font-size:11px;color:var(--mut);font-weight:700}
.slist{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--ln);font-size:13px}
.srow .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;border:1.5px solid var(--ln);color:var(--mut)}
.srow .sv{font-weight:700;color:#e6e7eb;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.done .sn{background:var(--okbg);border-color:rgba(61,213,152,.5);color:var(--ok)}
.srow.pend{opacity:.72}.srow.pend .sv{color:var(--mut);font-weight:600}
.srow.cur{grid-template-columns:1fr;gap:12px;border:1.5px solid var(--pk);background:linear-gradient(180deg,var(--pkbg),var(--bg2));box-shadow:0 0 0 3px var(--pkbg)}
.srh{display:flex;align-items:center;gap:10px}
.srh b{font-size:15px;flex:1}
.srow.cur .sn{background:var(--pk);border-color:var(--pk);color:#fff}
.stc{font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px;background:var(--card2);color:var(--mut);border:1px solid var(--ln);white-space:nowrap}
.stc.ok{background:var(--okbg);color:var(--ok);border-color:rgba(61,213,152,.4)}
.stc.cur{background:var(--pk);color:#fff;border-color:var(--pk)}
.fld label{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:5px}
.fld .box{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:0 6px 0 14px;min-height:58px}
.fld .box:focus-within{border-color:var(--pk)}
.fld input{width:100%;min-width:3ch;background:none;border:0;outline:0;font-size:26px;font-weight:900;color:#fff;padding:8px 0}
.fld .u{font-size:13px;color:var(--mut);font-weight:700;margin-right:4px}
.kb{min-width:46px;height:42px;flex-shrink:0;border-radius:10px;background:var(--card2);border:1px solid var(--ln);font-weight:900;font-size:13px;color:#d0d3db;padding:0 6px}
.foot{font-size:11px;color:var(--mut2);text-align:center}
.donebox,.skipbox{display:grid;gap:10px;text-align:center}
.donebox>b{font-size:15px;color:var(--ok)}

/* ======================= TIMER LIVRE ======================= */
.tscr{min-height:100vh;display:flex;flex-direction:column;gap:18px;padding:max(12px,env(safe-area-inset-top)) 16px 24px}
.tlab{text-align:center}
.tlab b{display:block;font-size:16px;font-weight:800}
.tlab small{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.ring{position:relative;width:268px;height:268px;margin:0 auto;display:grid;place-items:center}
.ring svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .in{text-align:center;display:grid;justify-items:center;gap:2px}
.ring .in>svg{width:34px;height:34px;color:#d0d3db}
.ring .big{font:900 58px ui-monospace,Menlo,monospace;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring small{font-size:13px;color:#d0d3db}
.ctl{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.ctl .pmb{min-height:54px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:17px;font-weight:800}
.ctl .pz{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1.5px solid var(--ln)}
.ctl .pz svg{width:26px;height:26px}
.ctl .pz.play svg{fill:currentColor;stroke:none;margin-left:3px}
.tog{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--ln);font-size:13px;color:#e6e7eb;line-height:1.45;text-align:left;width:100%}
.tog small{display:block;font-size:11px;color:var(--mut)}
.tog .sw{flex-shrink:0;width:48px;height:28px;border-radius:99px;background:var(--card2);border:1px solid var(--ln);position:relative;transition:.2s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8a8f9b;transition:.2s}
.tog.on .sw{background:var(--pk);border-color:var(--pk)}
.tog.on .sw::after{left:23px;background:#fff}
select.sel{width:100%;min-height:50px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:0 12px;font-size:15px;font-weight:600;color:#fff}
.vol{display:flex;align-items:center;gap:12px;color:#d0d3db}
input[type=range]{width:100%;min-height:32px;accent-color:var(--pk)}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pre button{min-height:46px;border-radius:14px;background:var(--card);border:1px solid var(--ln);font-size:13px;font-weight:800}
.warn{font-size:12px;color:var(--warn);background:rgba(245,184,74,.1);border:1px solid rgba(245,184,74,.35);padding:10px 12px;border-radius:12px;line-height:1.5}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}

/* ======================= CONCLUÍDO ======================= */
.donescr{display:grid;gap:14px;padding:max(14px,env(safe-area-inset-top)) 16px 24px;text-align:center}
.troph{position:relative;width:200px;height:150px;margin:0 auto}
.troph svg{width:100%;height:100%}
.donescr h2{font-size:26px;font-weight:900}
.donescr .cg{color:var(--pklt);font-size:14px;margin-top:4px}
.st4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st4 div{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;text-align:left}
.st4 svg{width:26px;height:26px;color:#e6e7eb}
.st4 span{display:block;font-size:11px;color:var(--mut)}
.st4 b{font-size:19px;font-weight:900}
.quote{background:var(--pkbg);border:1px solid var(--pkln);border-radius:16px;padding:16px;font-size:15px;font-style:italic;color:var(--pklt)}
.socials{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.socials button{display:grid;justify-items:center;gap:6px;font-size:11px;color:#d0d3db}
.socials .c{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--ln)}
.socials .c svg{width:26px;height:26px}
.socials .ig{border-color:#d6249f}.socials .wa{border-color:#25d366}

/* ======================= FICHA COMPLETA / EVOLUÇÃO / OUTRAS ======================= */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:10px 6px;text-align:center}
.kpi span{display:block;font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase}
.kpi b{font-size:18px;font-weight:900}
details.day{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
details.day summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px}
details.day summary::-webkit-details-marker{display:none}
details.day summary .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pkbg);color:var(--pklt);font-weight:900;font-size:12px;flex-shrink:0}
details.day summary b{display:block;font-size:14px}
details.day summary small{font-size:11px;color:var(--mut)}
details.day summary::after{content:"▾";color:var(--mut2);margin-left:auto}
details.day[open] summary::after{transform:rotate(180deg)}
.dbody{padding:0 14px 14px;display:grid;gap:8px}
.prow{display:grid;grid-template-columns:24px 1fr 38px;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--ln)}
.prow .k{font-size:12px;font-weight:800;color:var(--mut);text-align:center}
.prow b{font-size:13px;display:block}
.prow small{font-size:11px;color:var(--pklt);font-weight:700}
.prow .pv{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pk);color:#fff}
.prow .pv svg{width:12px;height:12px;fill:#fff;stroke:none;margin-left:2px}
.rules{list-style:none;padding:0;display:grid;gap:6px;margin-top:10px}
.rules li{font-size:12px;color:#d6d8de;line-height:1.45;padding-left:14px;position:relative}
.rules li::before{content:"•";position:absolute;left:2px;color:var(--pk);font-weight:900}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.tbl th{font-size:9px;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 4px;border-bottom:1px solid var(--ln)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--ln)}
.lst{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;background:var(--bg2);border-radius:12px;border:1px solid var(--ln);font-size:12px;margin-top:8px}
.lst .d{font:10px ui-monospace,Menlo,monospace;color:var(--mut2);display:block}
.del{color:var(--mut2);font-size:15px;min-width:40px;min-height:40px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:5px}
.f input{width:100%;background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:16px;font-weight:700;color:#fff;min-height:48px;color-scheme:dark}
.f input:focus{outline:0;border-color:var(--pk)}
.tip{padding:12px;background:var(--bg2);border-radius:12px;border:1px solid var(--ln);font-size:13px;color:#d6d8de;line-height:1.6;margin-top:10px}
.tip b{display:block;margin-bottom:3px}

/* ======================= JANELAS ======================= */
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,6,9,.78);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{position:relative;width:100%;max-width:448px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--ln);border-radius:22px 22px 0 0;padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.sheet h3{font-size:16px;font-weight:900;margin-bottom:12px;padding-right:44px;line-height:1.35}
.xbtn{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--ln);color:#fff;font-size:15px;z-index:2}
.xbtn:focus{outline:none}
.shr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--ln);margin-top:8px;text-align:left;font-size:14px;font-weight:700}
.mi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--pkbg);color:var(--pk);font-size:12px;font-weight:900}
.mi small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.mi.on{border-color:var(--pkln)}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--ln);margin-top:8px;font-size:14px;font-weight:700}
.opt input{width:20px;height:20px;accent-color:var(--pk)}
.mtbl{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:6px;align-items:center;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--ln)}
.mrow.one{grid-template-columns:22px 1fr 46px}
.mrow.on{border-color:var(--pkln);background:var(--pkbg)}
.mrow>span{font-size:12px;font-weight:800;color:var(--mut);text-align:center}
.mrow input{width:100%;min-width:0;background:var(--bg2);border:1px solid var(--ln);border-radius:9px;padding:10px 2px;font-size:16px;font-weight:800;text-align:center;color:#fff}
.mrow input:focus{outline:0;border-color:var(--pk)}
.mhd{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:6px;font-size:10px;font-weight:800;color:var(--mut);text-align:center;padding:0 8px}
.mhd.one{grid-template-columns:22px 1fr 46px}
.mck{width:46px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--ln);color:var(--mut2)}
.mck.on{background:var(--pk);border-color:var(--pk);color:#fff}
.tut{display:grid;gap:14px}
.tut .tic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--pkbg);color:var(--pk);margin:4px auto 0}
.tut .tic svg{width:32px;height:32px}
.tut h4{font-size:19px;font-weight:900;text-align:center}
.tut .tsub{font-size:13px;color:var(--mut);text-align:center;margin-top:-8px}
.tut ul{list-style:none;padding:0;display:grid;gap:8px}
.tut li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--ln);font-size:13px;line-height:1.45;color:#dcdee4}
.tut li .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--pkbg);color:var(--pk)}
.tut li .k svg{width:16px;height:16px}
.tut li b{color:#fff}
.dots{display:flex;justify-content:center;gap:6px}
.dots button{width:8px;height:8px;border-radius:99px;background:var(--ln);padding:0}
.dots button.on{width:22px;background:var(--pk)}
.tnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tchk{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mut);min-height:40px}
.tchk input{width:18px;height:18px;accent-color:var(--pk)}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#f1f2f5;color:#121318;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:800;z-index:95;display:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none}
body.frs .toast{bottom:calc(130px + env(safe-area-inset-bottom))}
.toast.show{display:block}

/* ======================= NUTRIÇÃO ======================= */
.ntabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ntabs::-webkit-scrollbar{display:none}
.ntabs button{flex:1 1 0;min-height:40px;padding:0 4px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:12px;font-weight:700;color:#d0d3db;white-space:nowrap}
.ntabs button.on{background:#e9eaee;color:#121318;border-color:#e9eaee}
.dnav{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center}
.dmid{text-align:center;min-width:0}
.dmid b{display:block;font-size:15px;font-weight:900}
.dmid small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.useg{grid-template-columns:1fr 1fr}
.kcard{display:grid;grid-template-columns:116px 1fr;gap:14px;align-items:center}
.kring{position:relative;width:116px;height:116px;display:grid;place-items:center}
.kring svg{position:absolute;inset:0}
.kring div{text-align:center}
.kring b{display:block;font-size:22px;font-weight:900}
.kring small{font-size:10px;color:var(--mut)}
.kinfo{display:grid;gap:6px;min-width:0}
.kl{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--mut)}
.kl b{color:var(--tx);font-size:13px;white-space:nowrap}
.kbar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:2px 0 8px}
.kbar.sm{height:5px;margin:0}
.kbar i{display:block;height:100%;background:var(--pk);border-radius:99px}
.kbonus{grid-column:1/-1;display:flex;align-items:center;gap:6px;justify-content:center;min-height:38px;border-radius:12px;background:var(--bg2);border:1px dashed var(--ln);font-size:11.5px;color:#d0d3db;font-weight:600;padding:4px 8px}
.tline{display:grid;gap:10px}
.meal{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}
.meal.nx{border-color:var(--pk);box-shadow:0 0 0 3px var(--pkbg)}
.meal.dn{opacity:.62}
.meal .mh{display:flex;align-items:center;gap:10px}
.meal .mt{width:48px;flex-shrink:0;font:900 14px ui-monospace,Menlo,monospace;color:var(--pklt);line-height:1.15}
.meal .mt small{display:block;font:600 9px system-ui;color:var(--mut)}
.meal .mh small{display:block;font-size:11px;color:var(--mut)}
.meal .mh b{display:block;font-size:14px;line-height:1.3}
.mchk{width:42px;height:42px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ln);color:var(--mut2)}
.mchk.on{background:var(--ok);border-color:var(--ok);color:#06281b}
.fl{list-style:none;padding:0;margin:8px 0 0 58px;display:grid;gap:3px}
.fl li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#d6d8de}
.fl li span{flex:1;min-width:0}
.fl li b{max-width:55%;text-align:right;color:#fff;font-weight:700}
.mf{display:flex;justify-content:space-between;align-items:center;margin:8px 0 0 58px;font-size:11.5px;color:var(--mut)}
.meal.mavi .fl li{font-size:14px}
.prep{font-size:12.5px;line-height:1.5;color:#c9f5df;background:rgba(61,213,152,.09);border:1px solid rgba(61,213,152,.3);border-radius:12px;padding:9px 11px;margin-top:8px}
.prep b{color:#fff}
.nxc{display:block;width:100%;text-align:left}
.nxl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.nxl small{display:block;font-size:11px;color:var(--mut)}
.nxl b{display:block;font-size:13px;line-height:1.3}
.nxt{font:900 15px ui-monospace,Menlo,monospace;color:var(--pklt);width:50px;flex-shrink:0}
.nxk{font-size:11px;color:var(--mut);white-space:nowrap}
.wday{display:block;width:100%;text-align:left}
.wday.td{border-color:var(--pk)}
.wl{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:12px;padding:3px 0;color:#d6d8de}
.wl span{font-family:ui-monospace,Menlo,monospace;color:var(--mut)}
.wl b{font-weight:600}
.scost{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.scost span{display:block;font-size:10px;color:var(--mut);font-weight:800;text-transform:uppercase}
.scost b{font-size:16px;font-weight:900}
.sitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--ln);min-height:52px}
.sitem .cb{width:26px;height:26px;flex-shrink:0;border-radius:8px;border:2px solid var(--ln);display:grid;place-items:center;color:#fff}
.sitem .cb svg{width:15px;height:15px;stroke-width:3}
.sitem.on .cb{background:var(--ok);border-color:var(--ok)}
.sitem.on b{text-decoration:line-through;color:var(--mut)}
.sitem b{display:block;font-size:14px}
.sitem small{display:block;font-size:12px;color:var(--pklt);font-weight:700}
.sitem .sp{font-size:12px;color:var(--mut);white-space:nowrap}
details.pday{border-top:1px solid var(--ln)}
details.pday summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 2px;min-height:44px}
details.pday summary::-webkit-details-marker{display:none}
details.pday summary small{font-size:11px;color:var(--mut)}
.pot{background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:9px 11px;margin-bottom:8px;display:grid;gap:4px}
.erow{display:grid;grid-template-columns:1fr 84px 26px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.erow b{display:block;font-size:13px}
.erow small{display:block;font-size:11px;color:var(--mut)}
.erow input{width:100%;min-height:44px;background:var(--card);border:1px solid var(--ln);border-radius:10px;text-align:center;font-size:17px;font-weight:800;color:#fff}
.erow input:focus{outline:0;border-color:var(--pk)}
.erow .u{font-size:12px;color:var(--mut)}
.etot{margin-top:12px;text-align:center;font-size:15px;font-weight:900;color:var(--pklt)}


/* ======================= CARDIO + V14 ======================= */
.cmode{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cmode button{min-height:82px;border-radius:16px;background:var(--card);border:1px solid var(--ln);font-weight:800}.cmode button b{display:block;font-size:25px}.cmain{text-align:center}.cdist{font-size:52px;font-weight:950;letter-spacing:-2px}.cunit{font-size:14px;color:var(--mut)}.cgps{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--card2);font-size:11px;font-weight:800}.cgps.good{color:var(--ok)}.cgps.mid{color:var(--warn)}.cgps.bad{color:#f87171}.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cstats div{background:var(--bg2);border:1px solid var(--ln);border-radius:14px;padding:10px 4px;text-align:center}.cstats b{font-size:18px;display:block}.cstats span{font-size:10px;color:var(--mut)}.split{display:grid;grid-template-columns:50px 1fr 80px;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:12px}.recpop{text-align:center;display:grid;gap:12px}.recpop .heroic{font-size:42px}.guidepop{display:grid;gap:12px}.guidepop .media{max-height:38vh}.analysis{line-height:1.55;font-size:13px;color:#d6d8de}.analysis b{color:#fff}.share3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.share3 button{min-height:56px;border-radius:14px;background:var(--card);border:1px solid var(--ln);font-size:11px;font-weight:800}

/* ======================= V15: PERÍODO, RELATÓRIOS E DESCANSO ======================= */
.frest{box-shadow:0 0 0 3px var(--pkbg),0 14px 34px rgba(0,0,0,.7)}.frest .fo{cursor:pointer}.frest .fl{font-size:10px;letter-spacing:.45px}.frest .fo:active{transform:scale(.99)}.reportBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reportBtns .btn{border-radius:16px;min-height:62px;line-height:1.3}.reportBtns small{display:block;font-size:10px;font-weight:600;opacity:.8;margin-top:3px}.periodPick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.periodPick button{min-height:50px;border-radius:14px;background:var(--card);border:1px solid var(--ln);font-weight:800}.periodPick button.on{background:var(--pk);border-color:var(--pk)}.weekly{border-color:var(--pkln);background:linear-gradient(180deg,var(--pkbg),var(--card))}.rptPreview{background:#121318;border:1px solid var(--ln);border-radius:16px;padding:14px;line-height:1.5}.rptPreview h4{font-size:17px;margin-bottom:8px}.rptPreview p{font-size:12px;color:#d6d8de}.rptPreview .rk{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:10px 0}.rptPreview .rk div{background:#20232c;border-radius:10px;padding:8px}.rptPreview .rk b{font-size:16px;display:block}.rptPreview .rk span{font-size:9px;color:#a0a5b1}
</style>

 elevM:"Apoie a parte alta das costas no encosto e posicione o apoio sobre o quadril, pés na largura do quadril.|Empurre com os calcanhares e suba o quadril até o tronco ficar alinhado com as coxas.|Segure 1 s no topo contraindo o glúteo, costelas para baixo.|Desça controlando, sem arquear a lombar.",

 puxF:"Sente com as coxas presas no apoio e segure a barra um pouco mais aberta que os ombros.|Puxe a barra até o alto do peito levando os cotovelos para baixo e para trás.|Peito aberto, sem jogar o tronco para trás.|Volte devagar até esticar os braços.",
 remN:"Sente com os pés apoiados, joelhos levemente flexionados e coluna reta.|Puxe o triângulo até a barriga, cotovelos rentes ao corpo.|Aproxime as escápulas no final e segure 1 s.|Volte devagar, sem curvar as costas.",

 elevL:"Em pé, halteres ao lado do corpo e cotovelos levemente dobrados.|Suba os braços pelas laterais até a linha dos ombros, sem dar impulso.|As mãos não passam da altura dos ombros.|Desça devagar.",
 roscaB:"Em pé, barra com as palmas para cima, na largura dos ombros.|Dobre os cotovelos e suba a barra até perto dos ombros.|Cotovelos fixos ao lado do corpo, sem balançar o tronco.|Desça devagar até quase esticar.",
 triB:"De frente para a polia alta, segure a barra com os cotovelos colados ao corpo.|Empurre a barra para baixo até esticar os braços.|Só o antebraço se move: cotovelos parados.|Volte devagar até a altura do peito.",
 triC:"De frente para a polia alta, segure a corda com os cotovelos colados ao corpo.|Empurre para baixo e abra a corda no final do movimento.|Cotovelos parados ao lado do corpo.|Volte devagar até a altura do peito.",
 triF:"De costas para a polia, segure a corda atrás da cabeça com os cotovelos apontando para cima.|Estique os braços para frente e para cima.|Cotovelos parados perto da cabeça.|Volte devagar até alongar o tríceps.",

 bird:"Fique em quatro apoios, mãos sob os ombros e joelhos sob o quadril.|Estique o braço e a perna opostos até ficarem alinhados com o tronco.|Quadril parado, sem girar. Segure 1 s.|Volte devagar e troque o lado.",

 roscaAlt:"Em pé, um halter em cada mão, palmas para frente.|Suba um braço de cada vez, com o cotovelo parado ao lado do corpo.|Desça devagar e troque o braço.",
 roscaM:"Em pé, halteres com as palmas viradas para o corpo.|Suba os halteres mantendo os cotovelos parados.|Desça devagar até quase esticar.",
 goblet:"Segure um halter junto ao peito, pés um pouco mais abertos que os ombros.|Desça como se fosse sentar, tronco ereto e joelhos na direção dos pés.|Desça até as coxas ficarem paralelas ao chão.|Suba empurrando o chão.",
 supRH:"Deite no banco com os halteres na linha do peito e os pés firmes no chão.|Escápulas encaixadas: empurre os halteres para cima até quase esticar.|Desça controlando até os cotovelos ficarem um pouco abaixo do banco.",
 remCavM:"Apoie o peito no encosto e segure as pegadas.|Puxe levando os cotovelos para trás.|Aperte as escápulas no final.|Volte devagar sem tirar o peito do apoio.",

  return{date:isDate(v.date)?v.date:today(),code:v.code,msg:String(v.msg||"").slice(0,220),target:t,reps:Array.isArray(v.reps)?v.reps.slice(0,10).map(int):[],sets:int(v.sets)}}
const cleanProgMap=o=>Object.fromEntries(Object.entries(o&&typeof o==="object"?o:{}).filter(([k])=>KEYRE.test(k)).map(([k,v])=>[k,cleanProg(v)]).filter(([,v])=>v));
function cleanSum(h){return{date:h.date,user:h.user,who:h.user==="natalia"?"Natália":"Thiago",name:String(h.name).slice(0,120),tag:typeof h.tag==="string"?h.tag.slice(0,120):"",
  sets:int(h.sets),exs:int(h.exs),vol:int(h.vol),min:int(h.min),kcal:int(h.kcal),kg:num(h.kg),uid:typeof h.uid==="number"?h.uid:0}}

  return{start:v.start,pausedMs:Math.max(0,+v.pausedMs||0),pausedAt:typeof v.pausedAt==="number"?v.pausedAt:null}}

  if(Array.isArray(o.hist)) out.hist=o.hist.filter(h=>h&&isDate(h.date)&&USERS.includes(h.user)&&typeof h.name==="string").map((h,i)=>{const c=cleanSum(h);if(!c.uid)c.uid=Date.parse(h.date)+i;
    return{...c,logs:cleanLogs(h.logs),prog:cleanProgMap(h.prog),skipped:Array.isArray(h.skipped)?h.skipped.filter(k=>KEYRE.test(k)).slice(0,30):[]}}).sort((a,b)=>a.date.localeCompare(b.date));

  if(o.videos) out.videos=pick(o.videos,v=>!!safeYt(v));
  if(o.rest) out.rest=pick(o.rest,v=>Number.isInteger(v)&&v>=0&&v<=600);
  if(o.sess&&typeof o.sess==="object") out.sess=Object.fromEntries(Object.entries(o.sess).filter(([k])=>USERS.includes(k)).map(([k,v])=>[k,cleanSess(v)]).filter(([,v])=>v));
  if(o.lastSum&&isDate(o.lastSum.date)&&USERS.includes(o.lastSum.user)) out.lastSum=cleanSum(o.lastSum);

    out.timer={mode:"rest",run:!!t.run,end:t.end,sec:Math.min(600,int(t.sec)),init:Math.min(600,int(t.init))||60,label:String(t.label||"").slice(0,120),next:String(t.next||"").slice(0,120),
      done:!!t.done,work:!!t.work,tip:String(t.tip||"").slice(0,240),tipc:["upg","keep","down"].includes(t.tipc)?t.tipc:""};
  const u=o.ui; if(u&&typeof u==="object"){
    const a=u.ask&&typeof u.ask==="object"&&KEYRE.test(u.ask.id||"")?{id:u.ask.id,i:int(u.ask.i),j:int(u.ask.j),to:int(u.ask.to)}:null;

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}

/* ======================= SESSÃO DE TREINO (com pausa) ======================= */
const sess=()=>S.sess[S.prof]||null;
const sessOn=()=>!!sess();
const elapsedOf=s=>s?((s.pausedAt||Date.now())-s.start-s.pausedMs)/1000:0;
const elapsed=()=>elapsedOf(sess());
function startSess(silent){if(!sess()){S.sess[S.prof]={start:Date.now(),pausedMs:0,pausedAt:null};save();if(!silent)toast("Treino iniciado ⏱️ Bora!")}else if(sess().pausedAt)resumeSess(true);keepAwake(true)}

function resumeSess(silent){const s=sess();if(!s||!s.pausedAt)return;s.pausedMs+=Date.now()-s.pausedAt;s.pausedAt=null;save();keepAwake(true);if(!silent){render();toast("Treino retomado ▶")}}
let wl=null;
async function keepAwake(on){try{if(on&&"wakeLock" in navigator&&!wl&&!document.hidden){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}if(!on&&wl){await wl.release();wl=null}}catch(e){}}

/* ======================= VIRADA DO DIA ======================= */
function rollover(){
  const t=today(); let msg="";
  USERS.forEach(u=>{if(S.sess[u])return;let n=0;
    for(const k of Object.keys(S.logs))if(k.startsWith(u+"_")&&S.draftDay[k]&&S.draftDay[k]!==t){delete S.logs[k];delete S.draftDay[k];n++}
    for(const k of Object.keys(S.skip))if(k.startsWith(u+"_")&&S.skip[k]!==t)delete S.skip[k];
    for(const k of Object.keys(S.prog))if(k.startsWith(u+"_")&&S.prog[k].date!==t)delete S.prog[k];
    if(n)msg="Séries não finalizadas de outro dia foram limpas."});
  if(S.timer&&isoOf(S.timer.end||0)!==t&&!S.timer.run) S.timer=null;
  if(msg){save();setTimeout(()=>toast(msg),400)}
  return !!msg;
}

/* ======================= FICHAS ======================= */
const P=()=>S.prof==="thiago"?THIAGO:NATALIA;
function routines(){return (S.prof==="thiago"?TH_DAYS:NAT_DAYS).map(d=>({...d,name:`${d.day} — ${d.title}`,ex:d.ex.map(e=>({...e,q:e.name}))}))}
function schedIdx(){const w=new Date().getDay();return routines().findIndex(d=>d.dows?d.dows.includes(w):d.dow===w)}
function curIdx(){
  const t=today();
  if(S.idxDay!==t&&!sessOn()){S.idxDay=t;S.idx={thiago:null,natalia:null}}
  let i=S.idx[S.prof];
  if(i==null){i=schedIdx();if(i<0)i=0;S.idx[S.prof]=i;save()}
  return Math.max(0,Math.min(i,routines().length-1));
}
const cur=()=>routines()[curIdx()];
const histName=r=>S.prof==="thiago"?`${r.title} — ${r.tag}`:r.name;
const logKey=id=>`${S.prof}_${id}`;
const restKey=id=>`${S.prof}_${id}`;
const isOne=ex=>ex.kind==="c";
const nSets=ex=>isOne(ex)?1:ex.sets;
const rng=ex=>{const n=String(ex.reps).match(/\d+/g)||["10"];const a=+n[0],b=+(n[1]||n[0]);return[Math.min(a,b),Math.max(a,b)]};
const topRep=ex=>rng(ex)[1];
const margin=ex=>ex.kind==="t"?5:1;
const eqOf=ex=>S.eq[restKey(ex.id)]||ex.eq||"l";
const r1=v=>Math.round(v*10)/10;
function stepUp(kg,eq){kg=+kg||0;if(eq!=="m")return r1(kg+2);return kg<30?kg+5:kg+10}
function stepDown(kg,eq){kg=+kg||0;if(eq!=="m")return Math.max(0,r1(kg-2));return kg>30?Math.max(30,kg-10):Math.max(0,kg-5)}
function lastFor(id){for(let i=S.hist.length-1;i>=0;i--){const h=S.hist[i];if(h.user===S.prof&&h.logs&&h.logs[logKey(id)])return{date:h.date,sets:h.logs[logKey(id)]}}return null}
function progForKey(k){for(let i=S.hist.length-1;i>=0;i--){const h=S.hist[i];if(h.prog&&h.prog[k])return h.prog[k]}return null}
const lastProgFor=id=>progForKey(logKey(id));
const pgCls=c=>c==="up"?"upg":c==="keep"?"keep":"down";
const pgIco=c=>c==="up"?"⬆️":c==="keep"?"➡️":"⬇️";
function restOf(ex){const v=S.rest[restKey(ex.id)];return v!=null?v:(ex.rest||0)}
const logsOf=ex=>S.logs[logKey(ex.id)]||[];
const isSkipped=ex=>!!S.skip[logKey(ex.id)]||S.discard[logKey(ex.id)]===today();
const doneCount=ex=>{const l=logsOf(ex);let c=0;for(let j=0;j<nSets(ex);j++)if(l[j]&&l[j].completed)c++;return c};
const exDone=ex=>isSkipped(ex)||doneCount(ex)>=nSets(ex);
const firstOpen=ex=>{const l=logsOf(ex);for(let j=0;j<nSets(ex);j++)if(!(l[j]&&l[j].completed))return j;return nSets(ex)};
function prevVal(id,j,f){return(((lastFor(id)||{sets:[]}).sets[j])||{})[f]||""}
function curVal(ex,j,f){const l=logsOf(ex)[j];if(l&&l[f]!=null&&l[f]!=="")return l[f];if(f==="weight"&&S.nextLoad[logKey(ex.id)]!=null)return String(S.nextLoad[logKey(ex.id)]).replace(".",",");return prevVal(ex.id,j,f)}
function setLog(id,j,f,v){
  const k=logKey(id); const a=S.logs[k]=S.logs[k]||[];
  if(!a[j]){a[j]={weight:prevVal(id,j,"weight"),reps:"",completed:false}}
  a[j][f]=v; S.draftDay[k]=today(); save();
}
function nextOpenIdx(r,from){const n=r.ex.length,cand=[];for(let step=1;step<=n;step++){const i=(from+step)%n,ex=r.ex[i];if(exDone(ex))continue;const d=S.defer[logKey(ex.id)];cand.push({i,d});if(d!=="last"&&!(d==="next"&&step===1)) return i}return cand.length?cand.find(x=>x.d!=="last")?.i??cand[0].i:-1}
const plainEx=ex=>!isOne(ex);
function pairRoles(r){const ro=r.ex.map(()=>null);for(let i=0;i<r.ex.length-1;i++){if(ro[i]||!S.bs[restKey(r.ex[i].id)])continue;if(plainEx(r.ex[i])&&plainEx(r.ex[i+1])&&!ro[i+1]){ro[i]="a";ro[i+1]="b"}}return ro}
const canPair=(r,i,ro)=>i+1<r.ex.length&&!ro[i]&&!ro[i+1]&&plainEx(r.ex[i])&&plainEx(r.ex[i+1]);
function estMin(r){let s=300;r.ex.forEach(ex=>{if(ex.kind==="c")s+=(parseInt(ex.reps,10)||10)*60;else s+=ex.sets*(45+restOf(ex))});
  const h=S.hist.filter(x=>x.user===S.prof&&x.name===histName(r)&&x.min);if(h.length){const a=h.slice(-3).reduce((t,x)=>t+x.min,0)/Math.min(3,h.length);return Math.round(a/5)*5}
  return Math.max(10,Math.round(s/60/5)*5)}
const metOf=r=>{const c=r.ex.filter(isOne).length;return c===r.ex.length?6.0:(c?5.0:4.5)};
const wList=()=>S.metrics.filter(m=>m.user===S.prof).sort((a,b)=>a.date.localeCompare(b.date));

/* ======================= SUGESTÃO DE CARGA POR REPETIÇÕES ======================= */
function qOptions(ex){
  const[a,b]=rng(ex),o=[];
  if(ex.kind==="t"){for(let v=Math.max(10,a-20);v<=b+20;v+=10)o.push(v);return o}
  for(let v=Math.max(1,a-2);v<=b+2;v++)o.push(v);return o;
}
function baseKg(ex){const l=logsOf(ex);let b=null;for(let j=0;j<nSets(ex);j++){const s=l[j];if(s&&s.completed&&num(s.weight)!=null&&num(s.weight)>0)b=num(s.weight)}return b}
function evalEx(ex,reps){
  const[a,b]=rng(ex),mg=margin(ex),eq=eqOf(ex),base=baseKg(ex);
  const code=reps.every(r=>r>=b)?"up":reps.some(r=>r<a-mg)?"down":"keep";
  let msg,target=null;
  if(ex.kind==="t"){
    if(code==="up"){target={sec:b+10};msg=`Você aguentou ${b} s ou mais em todas as séries. Sugestão: aumentar o tempo para ${b+10} s no próximo treino.`}
    else if(code==="keep")msg=`Você ficou perto da meta (${a===b?b:a+"–"+b} s). Mantenha o tempo no próximo treino.`;
    else{const s=Math.max(10,a-10);target={sec:s};msg=`Em pelo menos uma série você ficou abaixo de ${a-mg} s. Sugestão: reduzir para ${s} s no próximo treino.`}
  }else if(code==="up"){
    if(ex.bw&&!base)msg=`Você fez todas as repetições certinhas (${b} ou mais em todas as séries). Sugestão: começar a usar carga (anilha ou halter) no próximo treino.`;
    else if(base){const n=stepUp(base,eq);target={kg:n};msg=`Você fez ${b} repetições ou mais em todas as séries. Sugestão: aumentar a carga para ${fx(n)} kg no próximo treino.`}
    else msg=`Você fez ${b} repetições ou mais em todas as séries. Sugestão: aumentar a carga no próximo treino.`;
  }else if(code==="keep")msg=`Você ficou dentro da faixa (${a===b?b:a+"–"+b} repetições). Mantenha ${base?fx(base)+" kg":"a carga"} no próximo treino.`;
  else if(base){const n=stepDown(base,eq);target={kg:n};msg=`Em pelo menos uma série você fez menos de ${a-mg} repetições. Sugestão: reduzir a carga para ${fx(n)} kg no próximo treino.`}
  else msg=`Em pelo menos uma série você fez menos de ${a-mg} repetições. Sugestão: fazer com calma e boa execução até completar a faixa.`;
  return{date:today(),code,msg,target,reps,sets:nSets(ex)};
}
function midTip(ex,j,r){
  const[a,b]=rng(ex),mg=margin(ex),eq=eqOf(ex),w=num(curVal(ex,j,"weight"));
  if(ex.kind==="t"){if(r<a-mg)return{c:"down",t:`Você aguentou ${r} s, abaixo da meta. Na próxima série, tente com os joelhos apoiados.`};if(r>=b+10)return{c:"upg",t:`Ficou fácil (${r} s). Na próxima série, tente aguentar um pouco mais.`};return null}
  if(r<a-mg)return{c:"down",t:w>0?`Você fez ${r} repetições, abaixo da faixa (${a}–${b}). Considere reduzir para ${fx(stepDown(w,eq))} kg na próxima série.`:`Você fez ${r} repetições, abaixo da faixa (${a}–${b}). Na próxima série, faça com calma e boa execução.`};
  if(r>=b+2)return{c:"upg",t:w>0?`Ficou leve (${r} repetições). Se quiser, aumente para ${fx(stepUp(w,eq))} kg na próxima série.`:ex.bw?`Ficou leve (${r} repetições). Se quiser, use uma carga na próxima série.`:`Ficou leve (${r} repetições). Se quiser, aumente a carga na próxima série.`};
  return null;
}

/* ======================= ÁUDIO — sem pausar a música ======================= */
const AC=window.AudioContext||window.webkitAudioContext;
let actx=null;
function audioMix(){try{if(navigator.audioSession)navigator.audioSession.type="transient"}catch(e){}}
function getCtx(){audioMix();actx=actx||new AC();if(actx.state==="suspended")actx.resume();return actx}
function unlockAudio(){try{const c=getCtx(),b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);s.onended=()=>{try{c.suspend()}catch(e){}}}catch(e){}}
document.addEventListener("pointerdown",unlockAudio,{once:true});
const SND={gong:{l:"Gongo",s:3.2},bell:{l:"Sino",s:2.4},beep:{l:"Bipe",s:1.1}};
function partials(f,start,sr,f0,Pp,len,amp){const n=Math.min(f.length-start,Math.round(len*sr));for(let i=0;i<n;i++){const t=i/sr;let s=0;for(const[r,a,tau]of Pp)s+=a*Math.sin(6.2831853*f0*r*t)*Math.exp(-t/tau);f[start+i]+=s*Math.min(1,t/0.004,(len-t)/.15)*amp}}
function soundInto(f,start,sr,kind,vol){
  const v=Math.max(0,Math.min(1,vol));

/* ======================= EXERCÍCIO (um por vez) ======================= */
let howOpen=false;
function goalLine(ex){
  const m=String(ex.rir).match(/RIR\s*(\d+)(?:\s*-\s*(\d+))?/i);
  if(m)return`🎯 Termine cada série sentindo que ainda faria mais ${m[2]?m[1]+" a "+m[2]:m[1]} ${m[2]||m[1]!=="1"?"repetições":"repetição"} com boa execução.`;
  if(isOne(ex))return`🎯 Intensidade: ${ex.rir.toLowerCase()}.`;
  return"🎯 Movimento lento e controlado.";
}
function setsTxt(ex,s){
  if(ex.kind==="t")return`${s.reps||"?"} s`;
  const w=num(s.weight);return`${w>0?fx(w)+" kg":ex.bw?"sem carga":"— kg"} × ${s.reps||"?"}`;
}
function lastBlock(ex){
  if(isOne(ex))return"";
  const last=lastFor(ex.id),pg=lastProgFor(ex.id);let t="";
  if(last){const d=last.sets.filter(s=>s&&s.completed);if(d.length)t+=`<p class="small mut">Última vez (${fmtD(last.date)}): <b style="color:#fff">${esc(d.map(s=>setsTxt(ex,s)).join(" · "))}</b></p>`}
  if(pg){t+=`<div class="hint ${pgCls(pg.code)}">${pgIco(pg.code)} ${esc(pg.msg)}</div>`;
    if(pg.target&&pg.target.kg!=null&&firstOpen(ex)<nSets(ex)&&!isSkipped(ex)){
      const pend=Array.from({length:nSets(ex)},(_,k)=>k).filter(k=>!((logsOf(ex)[k]||{}).completed));
      if(pend.some(k=>num(curVal(ex,k,"weight"))!==pg.target.kg))t+=`<button type="button" class="btn dk" data-act="apply" style="min-height:44px">Aplicar ${fx(pg.target.kg)} kg nas séries de hoje</button>`}}
  return t?`<div class="sugg">${t}</div>`:"";
}
function scrExercicio(){

    :ro[i]==="b"?`<div class="bsband">${ic("zap")}<span><b>BI-SET 2/2</b> · logo após ${esc(r.ex[i-1].name)}. Descanse depois deste.</span></div>`:"";
  return `${hdr("ficha",`Exercício ${i+1} de ${r.ex.length}`,esc(S.prof==="thiago"?r.title+" · "+r.tag:r.title),`<button type="button" class="ib pl" data-act="exmenu" aria-label="Mais opções">${ic("vdots")}</button>`)}

   <div><div class="exhead"><h2 class="exname">${esc(ex.name)}</h2>${hasV?`<button type="button" class="vbtn" data-act="vid" aria-label="Ver vídeo de execução">${ic("play")}Vídeo</button>`:""}</div>

    <div class="howb"><ol class="steps">${steps.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol>
     ${ex.h&&ex.notes?`<div class="dica">💡 ${esc(ex.notes)}</div>`:""}
     ${hasV?`<button type="button" class="btn dk" data-act="vid">${ic("play","fill:currentColor;stroke:none;width:14px;height:14px")}Ver vídeo de execução</button>`:`<a class="btn dk" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.q+" shorts")}" target="_blank" rel="noopener">${ic("search")}Buscar vídeo no YouTube</a>`}</div></details>
   <div class="stats"><div><span>Séries</span><b>${isOne(ex)?1:ex.sets}</b></div><div><span>${ex.kind==="t"?"Segundos":isOne(ex)?"Duração":"Repetições"}</span><b>${esc(ex.reps)}</b></div>

  </div>`;

function seriesCard(r,ex,i,allDone){
  const n=nSets(ex),j=firstOpen(ex),nx=nextOpenIdx(r,i),l=logsOf(ex),pg=S.prog[logKey(ex.id)];
  const nextBtn=allDone?`<button type="button" class="btn ok" data-act="finish">🏁 Finalizar treino</button>`:nx>=0?`<button type="button" class="btn" data-ex="${nx}">Próximo: ${esc(r.ex[nx].name)} ${ic("arrow")}</button>`:"";
  if(isSkipped(ex)) return `<div class="serie"><div class="skipbox"><b style="color:var(--warn);font-size:15px">⤼ Exercício pulado</b><span class="small mut">Fica registrado como pulado no histórico deste treino.</span>
    <button type="button" class="btn gh" data-act="unskip">Desfazer e fazer agora</button>${nextBtn}</div></div>`;
  const rows=isOne(ex)?"":Array.from({length:n},(_,k)=>{
    const s=l[k]||{};
    if(s.completed) return `<button type="button" class="srow done" data-act="manual" aria-label="Série ${k+1} feita — toque para editar"><span class="sn">✓</span><span class="sv">${esc(setsTxt(ex,s))}</span><span class="stc ok">Feita</span></button>`;
    if(k===j) return currentRow(ex,k,n);
    const w=num(curVal(ex,k,"weight"));
    const pv=ex.kind==="t"?metaTxt(ex):`${w>0?fx(w)+" kg":ex.bw?"sem carga":"— kg"} · ${metaTxt(ex)}`;
    return `<div class="srow pend"><span class="sn">${k+1}</span><span class="sv">${esc(pv)}</span><span class="stc">Pendente</span></div>`;
  }).join("");
  const skipBtn=`<button type="button" class="btn gh" data-act="skipex" style="min-height:44px">${ic("skip")}Pular exercício</button>`;
  if(j>=n){
    const canMk=!pg&&!isOne(ex)&&l.slice(0,n).every(s=>s&&s.completed&&s.reps!=="");
    return `<div class="serie"><div class="donebox"><b>✓ Exercício concluído</b><span class="small mut">${doneCount(ex)} de ${n} ${n>1?"séries feitas":"feito"}</span>
    ${pg?`<div class="hint ${pgCls(pg.code)}" style="text-align:left">${pgIco(pg.code)} ${esc(pg.msg)}</div>`:canMk?`<button type="button" class="lnk" data-act="mkprog">Ver sugestão para o próximo treino</button>`:""}
    ${nextBtn}</div>${rows?`<div class="slist">${rows}</div>`:""}</div>`}
  if(isOne(ex)) return `<div class="serie"><h3>Atividade <small>${esc(ex.rir)}</small></h3><p class="small mut">Duração: <b style="color:#fff">${esc(ex.reps)}</b></p>
    <button type="button" class="btn" data-act="conclude">${ic("check")}Marcar como concluído</button>${skipBtn}</div>`;
  return `<div class="serie"><h3>Séries <small>Meta: ${esc(metaTxt(ex))}</small></h3><div class="slist">${rows}</div>${skipBtn}</div>`;
}
function currentRow(ex,j,n){
  const eq=eqOf(ex),st=eq==="m"?"":"2 kg";
  let body="";
  if(ex.kind==="w") body=`<div class="fld"><label for="cW">${ex.bw?"Carga extra (opcional)":"Carga"} <span style="font-weight:600">· ${eq==="m"?"máquina":"peso livre"}</span></label><div class="box">
     <input id="cW" data-cf="weight" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" value="${esc(curVal(ex,j,"weight"))}" placeholder="0"><span class="u">kg</span>
     <button type="button" class="kb" data-kg="-" aria-label="Diminuir carga">−${st?" "+st:""}</button><button type="button" class="kb" data-kg="+" aria-label="Aumentar carga">+${st?" "+st:""}</button></div></div>`;
  else body=`<p class="small mut">Meta: <b style="color:#fff">${esc(ex.reps)} s</b>. Use o cronômetro e, ao terminar, toque em Concluir série.</p><button type="button" class="btn dk" data-act="worktimer">${ic("clock")}Cronômetro de ${rng(ex)[1]} s</button>`;
  return `<div class="srow cur"><div class="srh"><span class="sn">${j+1}</span><b>Série ${j+1} de ${n}</b><span class="stc cur">Atual</span></div>${body}
   <button type="button" class="btn" data-act="conclude">${ic("check")}Concluir série ${j+1}</button></div>`;
}

/* ======================= REPLICAR CARGA PARA AS OUTRAS SÉRIES ======================= */
const repAsked=new Set(); let repTimer=null, repPending=null;
async function maybeReplicate(id,j,field){
  repPending=null;
  const ex=cur().ex.find(x=>x.id===id); if(!ex||ex.kind!=="w") return null;
  const val=(logsOf(ex)[j]||{})[field]; if(!val) return null;
  const tg=[];for(let k=0;k<nSets(ex);k++){if(k===j)continue;const l=logsOf(ex)[k];if(l&&l.completed)continue;if(String(curVal(ex,k,field))!==String(val))tg.push(k)}
  const key=`${id}|${field}|${val}`; if(!tg.length||repAsked.has(key)) return null;
  repAsked.add(key);
  const names=tg.map(k=>k+1),lst=names.length>1?names.slice(0,-1).join(", ")+" e "+names[names.length-1]:names[0];
  const ok=await ask(`Replicar ${val} kg para ${names.length>1?"as séries":"a série"} ${lst}?`,{ok:"Replicar",cancel:"Só esta série",sub:ex.name});
  if(ok){tg.forEach(k=>setLog(id,k,field,val));toast(`Carga de ${val} kg aplicada ✓`)}
  if(S.ui.screen==="exercicio"&&sheetKind!=="manual")render();
  return ok;
}
function scheduleRep(id,j,field){clearTimeout(repTimer);repPending={id,j,field};repTimer=setTimeout(()=>{const p=repPending;if(p)maybeReplicate(p.id,p.j,p.field)},900)}
async function flushRep(){clearTimeout(repTimer);if(repPending){const p=repPending;await maybeReplicate(p.id,p.j,p.field)}}

/* ======================= FINALIZAR / DESCARTAR ======================= */
let lastUndo=null;
function clearDraft(r){r.ex.forEach(ex=>{const k=logKey(ex.id);delete S.logs[k];delete S.draftDay[k];delete S.skip[k];delete S.prog[k]})}
async function finishWorkout(){
  await flushRep();
  const r=cur(),s=sess();const logs={},prog={};let sets=0,vol=0,exs=0;
  r.ex.forEach(ex=>{const k=logKey(ex.id),a=S.logs[k];if(a&&a.some(x=>x&&x.completed)){exs++;logs[k]=a;a.forEach(x=>{if(x&&x.completed){sets++;vol+=(num(x.weight)||0)*(ex.kind==="w"?(num(x.reps)||0):0)}})}if(S.prog[k])prog[k]=S.prog[k]});
  const skipped=r.ex.filter(isSkipped).map(ex=>logKey(ex.id));
  if(!sets){
    if(s&&await ask("Nenhuma série foi concluída. Encerrar e descartar este treino?",{ok:"Descartar treino",danger:true})){
      delete S.sess[S.prof];clearDraft(r);keepAwake(false);stopTimer();go("home");toast("Treino descartado")}
    else if(!s) toast("Conclua pelo menos uma série antes de finalizar");
    return;
  }
  const pend=r.ex.reduce((a,ex)=>a+(isSkipped(ex)?0:nSets(ex)-doneCount(ex)),0);
  if(pend&&!(await ask(`Ainda faltam ${pend} séries. Finalizar mesmo assim?`,{ok:"Finalizar"})))return;
  let date=today();
  const startIso=s?isoOf(s.start):today();
  if(startIso!==date){date=await askDate(startIso);if(!date)return}
  let min=s?Math.round(elapsedOf(s)/60):null;
  if(min==null||min>180){
    const v=await ask(min>180?`O relógio marcou ${fmtMin(min)}. Quantos minutos o treino durou de verdade?`:"Quanto tempo durou o treino (minutos)?",{input:"60",ok:"Salvar"});
    if(v==null)return;min=parseInt(v,10);if(!(min>=1&&min<=300)){toast("Informe entre 1 e 300 minutos");return}
  }
  min=Math.max(1,min);
  const kg=bodyWeight(),kcal=Math.round(metOf(r)*kg*(min/60)),uid=Date.now();
  const snap=o=>JSON.parse(JSON.stringify(o));
  lastUndo={uid,prof:S.prof,sess:s?{...s}:null,exIdx:S.ui.exIdx,logs:snap(Object.fromEntries(r.ex.map(ex=>[logKey(ex.id),S.logs[logKey(ex.id)]]).filter(([,v])=>v))),
    skip:snap(Object.fromEntries(skipped.map(k=>[k,S.skip[k]]))),prog:snap(prog)};
  const sum={date,user:S.prof,who:P().name,name:histName(r),tag:r.tag,sets,exs,vol:Math.round(vol),min,kcal,kg,uid};
  S.hist.push({...sum,logs:snap(logs),prog:snap(prog),skipped});S.hist.sort((a,b)=>a.date.localeCompare(b.date));
  clearDraft(r);
  delete S.sess[S.prof];keepAwake(false);stopTimer();S.ui.ask=null;
  S.lastSum=sum;S.ui.exIdx=0;go("done");playEnd();
}
function undoFinish(){
  if(!lastUndo)return;
  const i=S.hist.findIndex(h=>h.uid===lastUndo.uid);if(i>=0)S.hist.splice(i,1);
  Object.assign(S.logs,lastUndo.logs);Object.keys(lastUndo.logs).forEach(k=>S.draftDay[k]=today());
  Object.assign(S.skip,lastUndo.skip);Object.assign(S.prog,lastUndo.prog);
  if(lastUndo.sess){S.sess[lastUndo.prof]=lastUndo.sess;keepAwake(true)}
  S.ui.exIdx=lastUndo.exIdx;lastUndo=null;S.lastSum=null;go("ficha");toast("Treino reaberto ↩️");
}

    x.fillStyle="#a0a5b1";x.font=`800 30px ${F}`;x.fillText(v[0],cx+36,cy+64);x.fillStyle=v[2];x.font=`900 ${v[1].length>9?62:76}px ${F}`;x.fillText(v[1],cx+36,cy+ch-50)});

/* =====================================================================
   NUTRIÇÃO (v13) — plano alimentar da planilha "Plano_Alimentar_Familia_v5"
   NUT.M[versão][semana][dia(seg=0)][pessoa(0 Thiago,1 Natália,2 Mavi)] = refeições

   item = [alimento(F), gramas, kcal, proteína, itemCompra(P), gCompra, medidaCaseira(S)]
   ===================================================================== */
const NV=["Custo médio","Custo reduzido"], NDAY=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const NGOAL=[{k:2290,p:155,w:"~3 L"},{k:1630,p:104,w:"~2,5 L"}];
const NBONUS=[0,10,20,30];
function nutDefaults(){return{ver:0,start:"2026-11-16",unit:"c",portionV15:true,who:"all",bonus:10,remind:false,done:{},edit:{},livre:{},notified:{},bought:{},view:"me",tab:"hoje"}}
function cleanNut(o){
  const d=nutDefaults();if(!o||typeof o!=="object")return d;
  const flag=x=>Object.fromEntries(Object.entries(x&&typeof x==="object"?x:{}).filter(([k,v])=>/^[\w|:-]{1,60}$/.test(k)&&v===true).slice(-3000));
  const nums=x=>Object.fromEntries(Object.entries(x&&typeof x==="object"?x:{}).filter(([k,v])=>/^[\w|:-]{1,60}$/.test(k)&&typeof v==="number"&&v>=0&&v<=5000).slice(-3000));
  return{ver:o.ver===1?1:0,start:isDate(o.start)?o.start:d.start,unit:o.portionV15===true&&o.unit==="g"?"g":"c",portionV15:true,who:o.who==="adults"?"adults":"all",bonus:[0,10,20,30].includes(o.bonus)?o.bonus:10,
    remind:o.remind===true,done:flag(o.done),edit:nums(o.edit),livre:nums(o.livre),notified:flag(o.notified),bought:flag(o.bought),
    view:o.view==="mavi"?"mavi":"me",tab:["hoje","semana","compras","preparo","dicas"].includes(o.tab)?o.tab:"hoje"};
}
const NS=i=>NUT.S[i]||"";
const pIdx=()=>S.prof==="thiago"?0:1;
const pName=p=>["Thiago","Natália","Mavi"][p];
const dayMs=864e5;
const isoAdd=(iso,n)=>isoOf(new Date(iso+"T12:00:00").getTime()+n*dayMs);
const dIdx=iso=>(new Date(iso+"T12:00:00").getDay()+6)%7;
function wIdx(iso){const diff=Math.round((new Date(iso+"T12:00:00")-new Date(S.nut.start+"T12:00:00"))/dayMs);return(((Math.floor(diff/7))%4)+4)%4}
function cycleWeekNo(iso){const diff=Math.round((new Date(iso+"T12:00:00")-new Date(S.nut.start+"T12:00:00"))/dayMs);return Math.floor(diff/7)+1}
function mealsOf(iso,p){return NUT.M[S.nut.ver][wIdx(iso)][dIdx(iso)][p]||[]}
const mKey=(iso,p,mi)=>`${iso}|${p}|${mi}`;
function itemG(iso,p,mi,k,it){const v=S.nut.edit[`${mKey(iso,p,mi)}|${k}`];return v!=null?v:it[1]}
function mealTot(iso,p,m){
  if(!m[5].length){const lv=S.nut.livre[mKey(iso,p,m[0])];return{k:lv!=null?lv:m[6],p:0}}
  let k=0,pr=0;m[5].forEach((it,i)=>{const g=itemG(iso,p,m[0],i,it),f=it[1]?g/it[1]:0;k+=it[2]*f;pr+=it[3]*f});return{k,p:pr};
}
function dayTot(iso,p){let pk=0,pp=0,dk=0,dp=0;mealsOf(iso,p).forEach(m=>{const t=mealTot(iso,p,m);pk+=t.k;pp+=t.p;if(S.nut.done[mKey(iso,p,m[0])]){dk+=t.k;dp+=t.p}});return{pk,pp,dk,dp}}
function trainKcal(iso,user){return S.hist.filter(h=>h.user===user&&h.date===iso).reduce((a,h)=>a+(h.kcal||0),0)+(S.cardio||[]).filter(c=>c.user===user&&c.date===iso).reduce((a,c)=>a+(c.kcal||0),0)}
function goalOf(iso,p){const g=NGOAL[p],tr=trainKcal(iso,p===0?"thiago":"natalia"),b=Math.round(tr*S.nut.bonus/100);return{k:g.k+b,base:g.k,tr,b,p:g.p}}
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function nextMeal(p){const t=today(),ms=mealsOf(t,p),n=nowMin();return ms.find(m=>!S.nut.done[mKey(t,p,m[0])]&&toMin(m[1])>=n-30)||null}
const kc=v=>Math.round(v).toLocaleString("pt-BR");
function qtyTxt(iso,p,m,k,it){
  const g=itemG(iso,p,m[0],k,it),ed=g!==it[1],ml=/Leite/.test(NUT.F[it[0]]);
  if(S.nut.unit==="c"&&!ed){const c=NS(it[6]);if(c)return c;return`1 porção do plano · ${fx(g)} ${ml?"ml":"g"}`}
  return`${fx(g)} ${ml?"ml":"g"}${ed?" ✎":""}`;
}
let nutDate=null;
const nDate=()=>nutDate||today();

/* ---------- Card da tela inicial ---------- */
function homeNutCard(){
  const p=pIdx(),t=today(),me=nextMeal(p),mv=nextMeal(2),tot=dayTot(t,p),g=goalOf(t,p),pc=Math.min(100,tot.dk/g.k*100);
  const line=(who,m,pp)=>m?`<div class="nxl"><span class="nxt">${m[1]}</span><span class="grow"><small>${who}</small><b>${esc(NS(m[3]))}</b></span>${pp<2?`<span class="nxk">${kc(mealTot(t,pp,m).k)} kcal</span>`:""}</div>`
    :`<div class="nxl"><span class="nxt">—</span><span class="grow"><small>${who}</small><b>Refeições do dia concluídas</b></span></div>`;

   <div class="kbar"><i style="width:${pc}%"></i></div>${line(pName(p),me,p)}${line("Mavi 👶",mv,2)}</button>`;
}

/* ---------- Tela Nutrição ---------- */
function scrNutri(){
  const p=pIdx(),v=S.nut.view,mav=v==="mavi",iso=nDate();
  const tabs=mav?[["hoje","Dia"],["semana","Semana"],["dicas","Cuidados"]]:[["hoje","Hoje"],["semana","Semana"],["compras","Compras"],["preparo","Preparo"],["dicas","Dicas"]];
  if(!tabs.some(x=>x[0]===S.nut.tab))S.nut.tab="hoje";
  let body="";
  if(S.nut.tab==="hoje")body=mav?nMaviDay(iso):nDay(iso,p);
  else if(S.nut.tab==="semana")body=nWeek(iso,mav?2:p);
  else if(S.nut.tab==="compras")body=nShop();
  else if(S.nut.tab==="preparo")body=nPrep();
  else body=mav?nMaviTips():nTips();
  return `${hdr("","Nutrição",`Semana ${wIdx(iso)+1} do ciclo · ${NV[S.nut.ver]}`,`<button type="button" class="ib pl" data-act="nset" aria-label="Ajustes da nutrição">${ic("gear")}</button>`)}
  <div class="scr">
   <div class="seg" style="grid-template-columns:1fr 1fr"><button type="button" data-nv="me" class="${!mav?"on":""}">${ic("user","width:15px;height:15px;vertical-align:-3px")} ${pName(p)}</button><button type="button" data-nv="mavi" class="${mav?"on":""}">👶 Mavi</button></div>
   <div class="ntabs">${tabs.map(([k,l])=>`<button type="button" data-nt="${k}" class="${S.nut.tab===k?"on":""}">${l}</button>`).join("")}</div>
   ${body}
  </div>`;
}
function dateNav(iso){
  const d=new Date(iso+"T12:00:00"),isT=iso===today();
  return `<div class="dnav"><button type="button" class="ib" data-nd="-1" aria-label="Dia anterior">${ic("back")}</button>
   <button type="button" class="dmid" data-nd="0"><b>${isT?"Hoje · ":""}${DOW[d.getDay()]}</b><small>${fmtD(iso)} · Semana ${wIdx(iso)+1}${isT?"":" · toque para voltar a hoje"}</small></button>
   <button type="button" class="ib" data-nd="1" aria-label="Próximo dia">${ic("next")}</button></div>`;
}
const unitSeg=()=>`<div class="seg useg"><button type="button" data-nu="g" class="${S.nut.unit==="g"?"on":""}">Peso exato</button><button type="button" data-nu="c" class="${S.nut.unit==="c"?"on":""}">Porção do dia a dia</button></div>`;
function nDay(iso,p){
  const ms=mealsOf(iso,p),tot=dayTot(iso,p),g=goalOf(iso,p),left=g.k-tot.dk,pc=Math.min(100,tot.dk/g.k*100),pp=Math.min(100,tot.dp/g.p*100);
  const nx=iso===today()?nextMeal(p):null,C=301.6;
  const card=`<div class="card kcard">
    <div class="kring"><svg width="116" height="116" aria-hidden="true"><circle cx="58" cy="58" r="48" stroke="#262932" stroke-width="10" fill="none"/><circle cx="58" cy="58" r="48" stroke="${tot.dk>g.k?"#f87171":accent()}" stroke-width="10" fill="none" stroke-dasharray="${C}" stroke-dashoffset="${C-C*pc/100}" stroke-linecap="round" transform="rotate(-90 58 58)"/></svg>
     <div><b>${kc(tot.dk)}</b><small>de ${kc(g.k)} kcal</small></div></div>
    <div class="kinfo"><div class="kl"><span>${left>=0?"Ainda pode consumir":"Acima da meta"}</span><b class="${left>=0?"":"dn"}">${kc(Math.abs(left))} kcal</b></div>
     <div class="kl"><span>Proteína</span><b>${kc(tot.dp)} / ${g.p} g</b></div><div class="kbar sm"><i style="width:${pp}%;background:var(--ok)"></i></div>
     <div class="kl"><span>Planejado no dia</span><b>${kc(tot.pk)} kcal</b></div></div>
    <button type="button" class="kbonus" data-act="nbonus">${ic("flame","width:14px;height:14px;color:#ff7a3d")}${g.tr?`Treino: ${kc(g.tr)} kcal → +${kc(g.b)} kcal na meta (${S.nut.bonus}%)`:`Sem treino registrado neste dia · bônus de ${S.nut.bonus}% do treino`} ✎</button></div>`;
  return `${dateNav(iso)}${card}${unitSeg()}
   <div class="tline">${ms.map(m=>mealCard(iso,p,m,nx&&nx[0]===m[0])).join("")}</div>
   <p class="tiny mut" style="text-align:center">Toque em ✓ quando comer. Use ✎ para ajustar quantidades; as calorias recalculam sozinhas.</p>`;
}
function mealCard(iso,p,m,isNext){
  const key=mKey(iso,p,m[0]),done=!!S.nut.done[key],t=mealTot(iso,p,m),livre=!m[5].length,note=NS(m[7]);
  return `<div class="meal ${done?"dn":""} ${isNext?"nx":""}"><div class="mh"><span class="mt">${m[1]}${m[2]?`<small>pós-treino</small>`:""}</span>
    <span class="grow"><small>${NUT.ML[m[0]]}${isNext?" · <b class=\"acc\">próxima</b>":""}</small><b>${esc(NS(m[3]))}</b></span>
    <button type="button" class="mchk ${done?"on":""}" data-nck="${key}" aria-label="${done?"Desmarcar":"Marcar como feita"}">${ic("check")}</button></div>
   ${livre?`<p class="small mut" style="margin:6px 0 0 58px">${esc(note)}</p>`:`<ul class="fl">${m[5].map((it,k)=>`<li><span>${esc(NUT.F[it[0]])}</span><b>${esc(qtyTxt(iso,p,m,k,it))}</b></li>`).join("")}</ul>`}
   <div class="mf"><span>${kc(t.k)} kcal${t.p?` · ${kc(t.p)} g prot.`:""}</span>${p<2?`<button type="button" class="chip" data-ned="${m[0]}">${ic("edit","width:12px;height:12px")}Ajustar</button>`:""}</div></div>`;
}
function sheetNutEdit(mi){
  const iso=nDate(),p=pIdx(),m=mealsOf(iso,p).find(x=>x[0]===mi);if(!m)return;
  const key=mKey(iso,p,mi),livre=!m[5].length;
  const rows=livre?`<div class="f"><label for="nlv">Calorias estimadas da refeição livre</label><input id="nlv" data-nlv="1" type="text" inputmode="numeric" value="${mealTot(iso,p,m).k}"></div>`
    :m[5].map((it,k)=>`<div class="erow"><span class="grow"><b>${esc(NUT.F[it[0]])}</b><small>Sugerido: ${fx(it[1])} ${/Leite/.test(NUT.F[it[0]])?"ml":"g"}${NS(it[6])?" · "+esc(NS(it[6])):""}</small></span>
      <input type="text" inputmode="decimal" data-neg="${k}" value="${fx(itemG(iso,p,mi,k,it))}" aria-label="Quantidade de ${esc(NUT.F[it[0]])}"><span class="u">${/Leite/.test(NUT.F[it[0]])?"ml":"g"}</span></div>`).join("");
  openModal(`<h3>${esc(NS(m[3]))}<br><small class="mut" style="font-size:12px;font-weight:600">${NUT.ML[mi]} · ${m[1]} · ${fmtD(iso)}</small></h3>
   <div class="eform">${rows}</div>
