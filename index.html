  sheetNutEdit.ctx={iso,p,mi,key};
}
function nWeek(iso,p){
  const mon=isoAdd(iso,-dIdx(iso));
  return `<div class="dnav"><button type="button" class="ib" data-nd="-7" aria-label="Semana anterior">${ic("back")}</button><div class="dmid"><b>Semana ${wIdx(mon)+1} do ciclo</b><small>${fmtDM(mon)} a ${fmtDM(isoAdd(mon,6))} · ${pName(p)}</small></div><button type="button" class="ib" data-nd="7" aria-label="Próxima semana">${ic("next")}</button></div>
   ${NDAY.map((dn,k)=>{const d=isoAdd(mon,k),ms=mealsOf(d,p),tot=p<2?dayTot(d,p):null,isT=d===today();
    return `<button type="button" class="card wday ${isT?"td":""}" data-ngo="${d}"><div class="ctitle" style="margin-bottom:6px"><span>${dn} <small>${fmtDM(d)}${isT?" · hoje":""}</small></span><small>${tot?kc(tot.pk)+" kcal":""}</small></div>
     ${ms.filter(m=>p===2||[0,2,3,5].includes(m[0])).map(m=>`<div class="wl"><span>${m[1]}</span><b>${esc(NS(m[3]))}</b></div>`).join("")}</button>`}).join("")}`;
}
function nMaviDay(iso){
  const ms=mealsOf(iso,2),nx=iso===today()?nextMeal(2):null;
  return `${dateNav(iso)}${unitSeg()}
   <div class="tline">${ms.map(m=>{const key=mKey(iso,2,m[0]),done=!!S.nut.done[key],isNext=nx&&nx[0]===m[0];
    return `<div class="meal mavi ${done?"dn":""} ${isNext?"nx":""}"><div class="mh"><span class="mt">${m[1]}</span><span class="grow"><small>${NUT.ML[m[0]]}${isNext?" · <b class=\"acc\">próxima</b>":""}</small><b>${esc(NS(m[3]))}</b></span>
     <button type="button" class="mchk ${done?"on":""}" data-nck="${key}" aria-label="${done?"Desmarcar":"Marcar como dada"}">${ic("check")}</button></div>
     <ul class="fl">${m[5].map((it,k)=>`<li><span>${esc(NUT.F[it[0]])}</span><b>${esc(qtyTxt(iso,2,m,k,it))}</b></li>`).join("")}</ul>
     ${NS(m[4])?`<div class="prep">👶 <b>Como preparar:</b> ${esc(NS(m[4]))}</div>`:""}</div>`}).join("")}</div>
   <p class="tiny mut" style="text-align:center">Quantidades são referência: ofereça, não force. Valide o plano da Mavi com a pediatra.</p>`;

/* ---------- Compras ---------- */
function shopWeekIso(){const t=today(),d=dIdx(t);return d>=5?isoAdd(t,7-d):isoAdd(t,-d)}
let shopIso=null;
const sWk=()=>shopIso||shopWeekIso();
function shopList(mon){
  const w=wIdx(mon),who=S.nut.who==="adults"?[0,1]:[0,1,2],tot={};
  for(let d=0;d<7;d++)who.forEach(p=>(NUT.M[S.nut.ver][w][d][p]||[]).forEach(m=>m[5].forEach(it=>{if(it[4]>=0)tot[it[4]]=(tot[it[4]]||0)+it[5]})));
  return NUT.P.map((pr,i)=>{const g=tot[i]||0;if(!g)return null;const u=g/pr[2],c=pr[5],q=c===0?Math.ceil(u-1e-9):Math.ceil(u*10**c-1e-9)/10**c;return{i,n:pr[0],u:pr[1],sec:pr[4],q,cost:q*pr[3],pr:pr[3]}}).filter(Boolean);
}
const qtyU=x=>{const q=fx(x.q);if(x.u==="kg")return`${q} kg`;if(x.u==="unidade")return`${q} ${x.q===1?"unidade":"unidades"}`;if(x.u==="litro")return`${q} ${x.q===1?"litro":"litros"}`;return`${q} × ${x.u}`};
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function nShop(){
  const mon=sWk(),w=wIdx(mon),L=shopList(mon),bk=k=>`${S.nut.ver}|${mon}|${k}`;
  const total=L.reduce((a,x)=>a+x.cost,0),left=L.filter(x=>!S.nut.bought[bk(x.i)]).reduce((a,x)=>a+x.cost,0),nb=L.filter(x=>S.nut.bought[bk(x.i)]).length;
  const secs=["Açougue","Mercado","Padaria","Feira","Despensa","Doces"],ico={"Açougue":"🥩","Mercado":"🛒","Padaria":"🥖","Feira":"🥬","Despensa":"🫙","Doces":"🍫"};
  return `<div class="dnav"><button type="button" class="ib" data-nsw="-7" aria-label="Semana anterior">${ic("back")}</button><div class="dmid"><b>Compras da Semana ${w+1}</b><small>Para ${fmtDM(mon)} a ${fmtDM(isoAdd(mon,6))} · comprar até ${fmtDM(isoAdd(mon,-2))}</small></div><button type="button" class="ib" data-nsw="7" aria-label="Próxima semana">${ic("next")}</button></div>
   <div class="seg" style="grid-template-columns:1fr 1fr"><button type="button" data-nwho="all" class="${S.nut.who==="all"?"on":""}">Família toda</button><button type="button" data-nwho="adults" class="${S.nut.who==="adults"?"on":""}">Só Thiago e Natália</button></div>
   <div class="card scost"><div><span>Custo estimado</span><b>${brl(total)}</b></div><div><span>Falta comprar</span><b class="acc">${brl(left)}</b></div><div><span>Itens</span><b>${nb}/${L.length}</b></div></div>
   ${secs.map(s=>{const it=L.filter(x=>x.sec===s);if(!it.length)return"";return `<div class="card"><div class="ctitle">${ico[s]} ${s} <small>${brl(it.reduce((a,x)=>a+x.cost,0))}</small></div>
    ${it.map(x=>{const on=!!S.nut.bought[bk(x.i)];return `<button type="button" class="sitem ${on?"on":""}" data-nb="${bk(x.i)}"><span class="cb">${on?ic("check"):""}</span><span class="grow"><b>${esc(x.n)}</b><small>${esc(qtyU(x))}${x.u!=="kg"&&x.u!=="unidade"&&x.u!=="litro"&&x.q<1?" (usa só uma parte)":""}</small></span><span class="sp">${brl(x.cost)}</span></button>`}).join("")}</div>`}).join("")}
   <div class="shr"><button type="button" class="btn" data-act="nshopwa" style="background:#22b55a;box-shadow:none">${ic("wa","width:18px;height:18px")}Enviar no WhatsApp</button><button type="button" class="btn gh" data-act="nshopclr">Desmarcar tudo</button></div>
   <p class="tiny mut">Quantidades já convertidas para alimento cru, como na planilha. Itens de despensa e doces em fração = quanto se usa na semana (um pote dura várias semanas). Temperos não entram. Preços são estimativas da planilha.</p>`;
}
function shopText(){
  const mon=sWk(),L=shopList(mon),bk=k=>`${S.nut.ver}|${mon}|${k}`,secs=["Açougue","Mercado","Padaria","Feira","Despensa","Doces"];
  let t=`🛒 *Lista de compras – Semana ${wIdx(mon)+1}* (${fmtDM(mon)} a ${fmtDM(isoAdd(mon,6))})\n${S.nut.who==="all"?"Família toda":"Thiago e Natália"} · ${NV[S.nut.ver]}\n`;
  secs.forEach(s=>{const it=L.filter(x=>x.sec===s&&!S.nut.bought[bk(x.i)]);if(!it.length)return;t+=`\n*${s}*\n`+it.map(x=>`• ${x.n} – ${qtyU(x)}`).join("\n")+"\n"});
  t+=`\nCusto estimado: ${brl(L.filter(x=>!S.nut.bought[bk(x.i)]).reduce((a,x)=>a+x.cost,0))}`;return t;
}

/* ---------- Preparo do fim de semana ---------- */
const COOK=/grelhado|cozid|refogad|assado/i, PROT=/Frango|Carne|Peixe|Músculo/;
const LOTES=[{n:"Sábado",d:[0,2,4,5]},{n:"Domingo",d:[1,3,6]}];
function nPrep(){
  const mon=sWk(),w=wIdx(mon),L=NUT.L[`${S.nut.ver}${w+1}`]||["","","",""],who=S.nut.who==="adults"?[0,1]:[0,1,2];
  const lote=(lt,dish)=>{
    const tot={},pots=[];
    lt.d.forEach(d=>who.forEach(p=>(NUT.M[S.nut.ver][w][d][p]||[]).forEach(m=>{
      const ck=m[5].filter(it=>COOK.test(NUT.F[it[0]]));ck.forEach(it=>{const f=NUT.F[it[0]];tot[f]=tot[f]||{g:0,raw:0,buy:it[4]>=0?NUT.P[it[4]][0]:""};tot[f].g+=it[1];tot[f].raw+=it[5]});
      if((m[0]===2||m[0]===5)&&ck.length)pots.push({d,p,m,ck,fresh:m[5].filter(it=>!COOK.test(NUT.F[it[0]]))})})));
    const ks=Object.keys(tot).sort((a,b)=>(PROT.test(b)-PROT.test(a))||tot[b].g-tot[a].g);
    const byDay=lt.d.map(d=>({d,ps:pots.filter(x=>x.d===d)})).filter(x=>x.ps.length);
    return `<div class="card"><div class="ctitle">${ic("pot","color:var(--pk)")}<span class="grow" style="margin-left:6px">Cozinhar no ${lt.n.toLowerCase()}</span><small>serve ${lt.d.map(d=>NDAY[d].slice(0,3).toLowerCase()).join(", ")}</small></div>
     <p class="small" style="margin-bottom:8px"><b class="acc">${esc(dish)}</b></p>
     <table class="tbl"><thead><tr><th>Preparar</th><th>Pronto</th><th>Cru (compra)</th></tr></thead><tbody>
     ${ks.map(f=>`<tr><td>${esc(f.replace(/\s*\(.*\)/,""))}</td><td><b>${kgTxt(tot[f].g)}</b></td><td>${kgTxt(tot[f].raw)}</td></tr>`).join("")}</tbody></table>
     <div class="ctitle" style="margin:14px 0 6px">Potes <small>${pots.length} potes</small></div>
     ${byDay.map(x=>`<details class="pday"><summary><b>${NDAY[x.d]}</b><small>${fmtDM(isoAdd(mon,x.d))} · ${x.ps.length} potes</small></summary>
       ${x.ps.map(pt=>`<div class="pot"><div class="row between"><b>${pName(pt.p)} · ${NUT.ML[pt.m[0]]}</b><span class="tiny mut">${pt.m[1]}</span></div>
        <div class="small">${pt.ck.map(it=>`${esc(NUT.F[it[0]].replace(/\s*\(.*\)/,""))} <b>${fx(it[1])} g</b>`).join(" · ")}</div>
        ${pt.fresh.length?`<div class="tiny mut">Na hora: ${pt.fresh.map(it=>esc(NUT.F[it[0]].replace(/\s*\(.*\)/,""))+" "+fx(it[1])+(/Leite/.test(NUT.F[it[0]])?" ml":" g")).join(", ")}</div>`:""}
        ${pt.p===2&&NS(pt.m[4])?`<div class="tiny" style="color:#9ff0c9;margin-top:4px">👶 ${esc(NS(pt.m[4]))}</div>`:""}</div>`).join("")}</details>`).join("")}</div>`;
  };
  return `<div class="dnav"><button type="button" class="ib" data-nsw="-7" aria-label="Semana anterior">${ic("back")}</button><div class="dmid"><b>Preparo da Semana ${w+1} · ${esc(L[0])}</b><small>Fim de semana de ${fmtDM(isoAdd(mon,-2))} e ${fmtDM(isoAdd(mon,-1))}</small></div><button type="button" class="ib" data-nsw="7" aria-label="Próxima semana">${ic("next")}</button></div>
   <div class="seg" style="grid-template-columns:1fr 1fr"><button type="button" data-nwho="all" class="${S.nut.who==="all"?"on":""}">Família toda</button><button type="button" data-nwho="adults" class="${S.nut.who==="adults"?"on":""}">Só Thiago e Natália</button></div>
   ${lote(LOTES[0],L[1])}${lote(LOTES[1],L[2])}
   ${who.includes(2)&&L[3]?`<div class="prep">👶 <b>Mavi:</b> ${esc(L[3])} Separe a porção dela ANTES de dourar e de pôr sal.</div>`:""}
   <div class="tip"><b>Conservação</b>Na geladeira, consuma os potes em até 3 dias. Congele os potes dos dias seguintes e descongele na geladeira na véspera.</div>
   <p class="tiny mut">“Pronto” = quantidade cozida que vai nos potes. “Cru” = quanto comprar/usar antes de cozinhar (fator da planilha). Cuscuz, ovos, tapioca e saladas são feitos na hora.</p>`;
}
const kgTxt=g=>g>=1000?`${fx(g/1000)} kg`:`${Math.round(g)} g`;

/* ---------- Dicas ---------- */
function nTips(){
  const t=S.prof==="thiago",g=NGOAL[pIdx()];
  return `<div class="card"><div class="ctitle">🎯 Metas do plano <small>da planilha</small></div><div class="kpi"><div><span>Calorias/dia</span><b>${kc(g.k)}</b></div><div><span>Proteína/dia</span><b>${g.p} g</b></div><div><span>Água</span><b>${g.w}</b></div></div>
   <p class="tiny mut" style="margin-top:8px">A meta da planilha já considera seu nível de atividade. Por isso, o bônus do treino deve ser pequeno (recomendado 0 a 10%).</p></div>
  <div class="card"><div class="ctitle">🥗 Dicas</div>
  ${t?`<div class="tip"><b style="color:#f5b84a">🔥 Troca dos biscoitos recheados</b>Substitua os 5–8 biscoitos por <strong>1 banana + 2 colheres de aveia + 2 ovos cozidos</strong> no lanche da tarde.</div>

async function conclude(){
  await flushRep();
  const r=cur(),i=S.ui.exIdx,ex=r.ex[i];if(!ex)return;
  const n=nSets(ex),j=firstOpen(ex);if(j>=n)return;
  if(ex.kind==="w"){const e=document.getElementById("cW");setLog(ex.id,j,"weight",cleanKg(e?e.value:curVal(ex,j,"weight")))}
  if(T.work&&(T.run||T.done))stopTimer();
  if(T.done){T.done=false;T.tip="";T.tipc=""}
  setLog(ex.id,j,"completed",true);
  startSess(true);
  const lastSet=j>=n-1,ro=pairRoles(r),rsec=restOf(ex);
  let to=i,rest=!isOne(ex)&&rsec>0,next="";
  const A=r.ex[i-1],B=r.ex[i+1];
  if(ro[i]==="a"&&B&&!isSkipped(B)&&firstOpen(B)<nSets(B)){to=i+1;rest=false}
  else if(ro[i]==="b"&&A&&!exDone(A)){to=i-1;next=`Próxima: ${A.name} · série ${firstOpen(A)+1}`}
  else if(!lastSet){next=`Próxima: série ${j+2} de ${n}`}
  else{const nx=nextOpenIdx(r,i);if(nx<0){rest=false}else{to=nx;next=`Próximo: ${r.ex[nx].name}`}}
  if(isOne(ex)){if(to!==i)S.ui.exIdx=to;save();render();window.scrollTo(0,0);
    if(r.ex.every(exDone))toast("Todos os exercícios concluídos! Finalize o treino 🏁");return}
  if(rest)startRest(rsec,ex.name,next);
  S.ui.ask={id:ex.id,i,j,to};save();render();paintQ();
}
function answerQ(v){
  const a=S.ui.ask;if(!a)return;
  const r=cur(),ex=r.ex.find(x=>x.id===a.id);
  if(!ex){S.ui.ask=null;save();paintQ();return}
  v=Math.max(0,Math.min(999,Math.round(v)));
  setLog(ex.id,a.j,"reps",String(v));
  const n=nSets(ex),last=a.j>=n-1;let tip="",tc="",pg=null;
  if(last){const reps=logsOf(ex).slice(0,n).map(s=>s&&s.completed?num(s.reps):null);
    if(reps.every(x=>x!=null)){pg=evalEx(ex,reps);S.prog[logKey(ex.id)]=pg;tip=pg.msg;tc=pgCls(pg.code)}}
  else{const m=midTip(ex,a.j,v);if(m){tip=m.t;tc=m.c}}
  S.ui.ask=null;
  if(a.to!==S.ui.exIdx||a.to!==a.i){S.ui.exIdx=a.to;howOpen=false}
  save();paintQ();render();window.scrollTo(0,0);
  const allDone=r.ex.every(exDone);
  if(pg){S.ui.rpOpen=false;save();sheetProgV14(ex,pg,allDone)}
  else if(restActive()){T.tip=tip;T.tipc=tc;S.ui.rpOpen=true;rpKey="";saveTimer();paint()}
  else if(tip)toast(tip);
  if(allDone&&!pg)toast("Todos os exercícios concluídos! Finalize o treino 🏁");
}
function undoQ(){
  const a=S.ui.ask;if(!a)return;
  const ex=cur().ex.find(x=>x.id===a.id);
  if(ex){setLog(ex.id,a.j,"completed",false);setLog(ex.id,a.j,"reps","")}
  stopTimer();S.ui.exIdx=a.i;S.ui.ask=null;save();paintQ();render();toast("Série desfeita");
}

    case "wsave":{

      if(w==null||w<30||w>250){toast("Peso inválido (30 a 250 kg)");break}
      if(!isDate(d)||d>today()){toast("Data inválida");break}
      saveWeight(w,d);sheetWeight(false);toast("Peso registrado ✅");break}
  }
}

/* ======================= CLIQUES NA TELA ======================= */
APP.addEventListener("click",async e=>{
  const t=e.target,a=t.closest("[data-act]");
  if(a){doAct(a.dataset.act);return}
  /* nutrição */
  const nv=t.closest("[data-nv]"); if(nv){S.nut.view=nv.dataset.nv;S.nut.tab="hoje";save();render();return}
  const nt=t.closest("[data-nt]"); if(nt){S.nut.tab=nt.dataset.nt;save();render();window.scrollTo(0,0);return}
  const nd=t.closest("[data-nd]"); if(nd){const v=+nd.dataset.nd;nutDate=v===0?null:isoAdd(nDate(),v);render();return}
  const ngo=t.closest("[data-ngo]"); if(ngo){nutDate=ngo.dataset.ngo===today()?null:ngo.dataset.ngo;S.nut.tab="hoje";save();render();window.scrollTo(0,0);return}
  const nu=t.closest("[data-nu]"); if(nu){S.nut.unit=nu.dataset.nu;save();render();return}
  const nck=t.closest("[data-nck]"); if(nck){const k=nck.dataset.nck;if(S.nut.done[k])delete S.nut.done[k];else S.nut.done[k]=true;save();render();return}
  const ned=t.closest("[data-ned]"); if(ned){sheetNutEdit(+ned.dataset.ned);return}
  const nsw=t.closest("[data-nsw]"); if(nsw){shopIso=isoAdd(sWk(),+nsw.dataset.nsw);render();return}
  const nwho=t.closest("[data-nwho]"); if(nwho){S.nut.who=nwho.dataset.nwho;save();render();return}
  const nb=t.closest("[data-nb]"); if(nb){const k=nb.dataset.nb;if(S.nut.bought[k])delete S.nut.bought[k];else S.nut.bought[k]=true;save();render();return}
  const cs=t.closest("[data-cstart]"); if(cs){startCardio(cs.dataset.cstart);return}
  const pv=t.closest("[data-vid]"); if(pv){e.stopPropagation();sheetVideo(cur().ex[+pv.dataset.vid]);return}
  const g=t.closest("[data-go]"); if(g){go(g.dataset.go);return}
  const pf=t.closest("[data-prof]"); if(pf){const u=pf.dataset.prof;if(u!==S.prof){S.prof=u;S.ui.exIdx=0;save();render();window.scrollTo(0,0);if(sessOn()&&!sess().pausedAt)keepAwake(true)}return}
  const pk=t.closest("[data-pickr]"); if(pk){if(pickRoutine(+pk.dataset.pickr)){render();toast(`Treino escolhido: ${cur().title}`)}return}
  const dp=t.closest("[data-dopl]"); if(dp){if(pickRoutine(+dp.dataset.dopl))go("ficha");return}
  const ppv=t.closest("[data-pvid]"); if(ppv){const[k,j]=ppv.dataset.pvid.split("|").map(Number);sheetVideo(routines()[k].ex[j]);return}
  const ex=t.closest("[data-ex]"); if(ex){S.ui.exIdx=+ex.dataset.ex;howOpen=false;go("exercicio");setTimeout(()=>maybeGuide(S.ui.exIdx),60);return}
  const en=t.closest("[data-exnav]"); if(en){await flushRep();const r=cur();S.ui.exIdx=Math.max(0,Math.min(r.ex.length-1,S.ui.exIdx+(+en.dataset.exnav)));howOpen=false;save();render();window.scrollTo(0,0);return}
  const pr=t.closest("[data-per]"); if(pr){S.ui.per=pr.dataset.per;save();render();return}
  const kb=t.closest("[data-kg]");
  if(kb){const ex2=cur().ex[S.ui.exIdx],j=firstOpen(ex2),inp=$("#cW");if(!inp)return;
    const cv=num(inp.value)||0,eq=eqOf(ex2),nv2=kb.dataset.kg==="+"?stepUp(cv,eq):stepDown(cv,eq),sv=String(nv2).replace(".",",");
    inp.value=sv;setLog(ex2.id,j,"weight",sv);scheduleRep(ex2.id,j,"weight");return}
  const ad=t.closest("[data-add]"); if(ad){restAdd(+ad.dataset.add);return}
  const pre=t.closest("[data-pre]"); if(pre){startRest(+pre.dataset.pre,"Descanso livre","");return}
  const sh=t.closest("[data-share]"); if(sh){doShare(sh.dataset.share);return}
  const dm=t.closest("[data-delm]"); if(dm){if(await ask("Apagar este registro de medidas?",{ok:"Apagar",danger:true})){S.metrics.splice(+dm.dataset.delm,1);save();render()}return}
  const dh=t.closest("[data-delh]"); if(dh){if(await ask("Apagar este treino do histórico? As cargas dele saem da evolução.",{ok:"Apagar",danger:true})){const i=S.hist.findIndex(h=>h.uid===+dh.dataset.delh);if(i>=0)S.hist.splice(i,1);save();render()}return}
});
APP.addEventListener("toggle",e=>{if(e.target.id==="howBox")howOpen=e.target.open},true);
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{b.blur();const n=b.dataset.nav;if(n==="more")sheetMore();else go(n)}));
$("#rp").addEventListener("click",e=>{
  if(e.target.id==="rp"){closeRP();return}
  const b=e.target.closest("[data-rp]");if(!b)return;
  switch(b.dataset.rp){
    case "min":closeRP();break;
    case "sub":restAdd(-15);break;
    case "add":restAdd(15);break;
    case "pause":restPauseToggle();rpKey="";paint();break;
    case "skip":stopTimer();break;
    case "ok":S.ui.rpOpen=false;T.done=false;T.tip="";T.tipc="";saveTimer();paint();break;
  }
});
$("#frest").addEventListener("click",e=>{
  const b=e.target.closest("[data-fr]");if(!b)return;
  switch(b.dataset.fr){
    case "open":openRP();break;
    case "pause":restPauseToggle();frKey="";paint();break;
    case "skip":stopTimer();break;
    case "ok":T.done=false;T.tip="";T.tipc="";saveTimer();paint();break;
  }
});
$("#qp").addEventListener("click",e=>{
  const b=e.target.closest("[data-q]");if(!b)return;
  if(b.dataset.q==="undo"){undoQ();return}
  answerQ(+b.dataset.q);
});
$("#qp").addEventListener("submit",e=>{
  if(e.target.id!=="qForm")return;e.preventDefault();
  const v=parseInt(cleanReps($("#qIn").value),10);
  if(!isFinite(v)){toast("Digite um número");return}
  answerQ(v);
});
$("#qp").addEventListener("input",e=>{if(e.target.id==="qIn"){const v=cleanReps(e.target.value);if(v!==e.target.value)e.target.value=v}});
APP.addEventListener("input",e=>{
  const d=e.target.dataset;
  if(d.cf){const ex=cur().ex[S.ui.exIdx];if(!ex)return;const v=cleanKg(e.target.value);if(v!==e.target.value)e.target.value=v;setLog(ex.id,firstOpen(ex),"weight",v);return}
  if(e.target.id==="mn"){$("#mnv").textContent=`${e.target.value} / 10`;return}
  if(e.target.id==="volIn"){S.vol=Math.max(0,Math.min(1,(+e.target.value||0)/100));save();return}
});
APP.addEventListener("change",e=>{
  const d=e.target.dataset;
  if(d.cf){const ex=cur().ex[S.ui.exIdx];if(ex)scheduleRep(ex.id,firstOpen(ex),"weight");return}
  if(e.target.id==="evoSel"){S.ui.evoEx=e.target.value;save();render();return}
  if(e.target.id==="sndSel"){S.snd=e.target.value;save();playEnd();return}
  if(e.target.id==="volIn"){playEnd();return}
});
APP.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.cf){e.preventDefault();e.target.blur()}});
APP.addEventListener("submit",e=>{
  if(e.target.id!=="mform")return;e.preventDefault();
  const w=num($("#mw").value),cRaw=$("#mc").value.trim(),c=cRaw?num(cRaw):null,dt=$("#md").value;
  if(w==null||w<30||w>250){toast("Peso inválido (30 a 250 kg)");return}
  if(cRaw&&(c==null||c<40||c>200)){toast("Cintura inválida (40 a 200 cm)");return}
  if(!isDate(dt)||dt>today()){toast("Data inválida");return}
  saveWeight(w,dt,c,S.prof==="natalia"?Math.min(10,Math.max(0,parseInt($("#mn").value,10)||0)):null);render();toast("Registro salvo ✅");
});

/* ======================= CLIQUES NAS JANELAS ======================= */
$("#modal").addEventListener("click",async e=>{
  const t=e.target;
  if(t.id==="modal"||t.closest("[data-close]")){closeModal();return}
  const rp=t.closest("[data-rperiod]");if(rp){const[kind,key]=rp.dataset.rperiod.split("|");if(key==="custom")sheetCustomPeriod(kind);else{closeModal();shareReport(kind,key)}return}
  const rc=t.closest("[data-rcustom]");if(rc){const start=$("#rStart").value,end=$("#rEnd").value;if(!isDate(start)||!isDate(end)||start>end||end>today()){toast("Período inválido");return}const kind=rc.dataset.rcustom;closeModal();shareReport(kind,"custom",{start,end});return}
  const pa=t.closest("[data-progapply]");if(pa){const[id,v]=pa.dataset.progapply.split("|");S.nextLoad[logKey(id)]=+v;save();closeModal();if(restActive())openRP();else render();return}
  const pc=t.closest("[data-progclose]");if(pc){closeModal();if(restActive())openRP();else render();return}
  const gg=t.closest("[data-guidego]");if(gg){const i=+gg.dataset.guidego,k=logKey(cur().ex[i].id);if($("#guideNever")?.checked)S.guideOff[k]=true;save();closeModal();render();return}
  const df=t.closest("[data-deferopt]");if(df){const ex=cur().ex[S.ui.exIdx],k=logKey(ex.id),v=df.dataset.deferopt;if(v==="discard"){S.discard[k]=today();delete S.defer[k]}else{S.defer[k]=v;delete S.discard[k]}const nx=nextOpenIdx(cur(),S.ui.exIdx);if(nx>=0)S.ui.exIdx=nx;startSess(true);save();closeModal();render();return}
  const csh=t.closest("[data-cshare]");if(csh){shareCardio(sheetCardioDone.last,csh.dataset.cshare);return}
  const ts=t.closest("[data-tstep]"); if(ts&&!ts.disabled){tutSaveChoice();sheetTutorial(+ts.dataset.tstep);return}
  const nver=t.closest("[data-nver]"); if(nver){S.nut.ver=+nver.dataset.nver;save();sheetNutSet();if(S.ui.screen==="nutri"||S.ui.screen==="home")render();return}
  const nbo=t.closest("[data-nbo]"); if(nbo){S.nut.bonus=+nbo.dataset.nbo;save();sheetNutSet();if(S.ui.screen==="nutri"||S.ui.screen==="home")render();return}
  const g=t.closest("[data-go]"); if(g){closeModal();go(g.dataset.go);return}
  const ex=t.closest("[data-ex]"); if(ex){closeModal();S.ui.exIdx=+ex.dataset.ex;howOpen=false;go("exercicio");return}
  const wp=t.closest("[data-wper]"); if(wp){S.ui.per=wp.dataset.wper;save();sheetWeight(false);return}
  const wd=t.closest("[data-wdel]"); if(wd){const i=S.metrics.findIndex(m=>m.user===S.prof&&m.date===wd.dataset.wdel);if(i>=0){S.metrics.splice(i,1);save()}sheetWeight(false);return}
  const mk=t.closest("[data-mck]");
  if(mk){const ex2=cur().ex[S.ui.exIdx],j=+mk.dataset.mck,c0=((logsOf(ex2)[j])||{}).completed;
    if(!c0){const row=mk.closest(".mrow");row.querySelectorAll("input[data-m]").forEach(inp=>{const f=inp.dataset.m.split("|")[1];if(f==="weight"&&inp.value)setLog(ex2.id,j,f,cleanKg(inp.value));if(f==="reps"&&!inp.value&&!isOne(ex2))setLog(ex2.id,j,f,String(rng(ex2)[1]))})}
    setLog(ex2.id,j,"completed",!c0);if(!c0)startSess(true);sheetManual();return}
  const a=t.closest("[data-act]"); if(a){const act=a.dataset.act;if(["vlink","editrest","manual","finish","bstog","skipex","unskip","vid","eqtog"].includes(act))closeModal();doAct(act)}
});
$("#modal").addEventListener("input",e=>{
  const d=e.target.dataset;
  if(d.neg!=null||d.nlv){const c=sheetNutEdit.ctx;if(!c)return;
    const v=num(cleanKg(e.target.value));
    if(d.nlv){if(v!=null)S.nut.livre[c.key]=Math.min(5000,v);}
    else{const m=mealsOf(c.iso,c.p).find(x=>x[0]===c.mi),it=m&&m[5][+d.neg];if(!it)return;const k=`${c.key}|${d.neg}`;if(v==null||v===it[1])delete S.nut.edit[k];else S.nut.edit[k]=Math.min(5000,v)}
    save();const m=mealsOf(c.iso,c.p).find(x=>x[0]===c.mi),tt=mealTot(c.iso,c.p,m);const el=$("#etot");if(el)el.textContent=`${kc(tt.k)} kcal · ${kc(tt.p)} g de proteína`;return}
  const m=d.m;if(!m)return;
  const[j,f]=m.split("|"),ex=cur().ex[S.ui.exIdx];
  const v=f==="reps"?cleanReps(e.target.value):cleanKg(e.target.value);if(v!==e.target.value)e.target.value=v;
  setLog(ex.id,+j,f,v);
});
$("#modal").addEventListener("change",async e=>{
  if(e.target.id==="nstart"){const v=e.target.value;if(isDate(v)){const dd=new Date(v+"T12:00:00").getDay();S.nut.start=isoAdd(v,-((dd+6)%7));save();sheetNutSet();if(dd!==1)toast("Ajustado para a segunda-feira daquela semana");if(S.ui.screen==="nutri"||S.ui.screen==="home")render()}return}
  const m=e.target.dataset.m;
  if(m){const[j,f]=m.split("|");if(f==="weight"){const ex=cur().ex[S.ui.exIdx];if(await maybeReplicate(ex.id,+j,f)!==null)sheetManual()}return}
  if(e.target.id!=="imp")return;const fl=e.target.files[0];if(!fl)return;
  if(fl.size>8e6){toast("Arquivo grande demais");return}
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||typeof o!=="object"||typeof o.logs!=="object"||!Array.isArray(o.hist)||!Array.isArray(o.metrics))throw 0;
    const c=sanitize(o);["prof","idx","idxDay","logs","draftDay","hist","metrics","videos","sound","bgSound","tutOff","snd","vol","rest","sess","skip","prog","bs","eq","nut","cardio","guideOff","defer","discard","nextLoad"].forEach(k=>{if(k in c)S[k]=c[k]});
    save();closeModal();render();toast("Backup importado ✅")}catch(err){toast("Arquivo de backup inválido")}};
  rd.readAsText(fl);
});
$("#modal").addEventListener("keydown",e=>{
  if(e.key!=="Tab")return;
  const f=[...$("#sheet").querySelectorAll("button,a[href],input,select")];if(!f.length)return;
  const a=f[0],b=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#modal").classList.contains("show"))closeModal();else if($("#rp").classList.contains("show"))closeRP();else if(S.ui.screen==="timer")backFromTimer()}});

/* ======================= SEGUNDO PLANO / TELA BLOQUEADA ======================= */
window.addEventListener("scroll",()=>saveScroll(false),{passive:true});
window.addEventListener("pagehide",()=>{saveScroll(true);saveTimer()});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){saveScroll(true);saveTimer();notifyRunning();return}
  if(rollover()) render();
  if(T.run){tick();notifyClose()}
  tickSess();paint();mealReminders();
  if(S.ui.screen==="home"||S.ui.screen==="nutri")render();
  if(sessOn()&&!sess().pausedAt) keepAwake(true);
});
function tickSess(){const s=sess();if(s)document.querySelectorAll("[data-sess]").forEach(el=>el.textContent=mmss(elapsedOf(s)))}
setInterval(tickSess,1000);

/* ======================= INÍCIO ======================= */
rollover();
(function restoreTimer(){
  const t=S.timer;if(!t)return;
  Object.assign(T,{mode:"rest",run:t.run,end:t.end,sec:t.sec,init:t.init,label:t.label,next:t.next,done:t.done,work:t.work,tip:t.tip||"",tipc:t.tipc||""});
  if(T.run){
    if(T.end<=Date.now()){T.run=false;T.sec=0;T.done=true;if(!S.ui.ask)S.ui.rpOpen=true;setTimeout(()=>toast("Seu descanso terminou enquanto o app estava fechado"),500)}
    else{T.h=setInterval(tick,250);armEnd();tick()}
  }
})();
if(S.ui.screen==="timer"&&!timerActive()) S.ui.screen=sessOn()?"exercicio":"home";
render();paintQ();
requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,S.ui.scroll[S.ui.screen]||0)));
if(sessOn()&&!sess().pausedAt) keepAwake(true);
if(!S.tutOff&&!S.ui.ask) setTimeout(()=>{if(!$("#modal").classList.contains("show")&&!S.ui.ask)sheetTutorial(0)},350);
if("serviceWorker" in navigator&&location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
